id: https://meaningfy.ws/ns/rdf-persistence/generation
name: rp_generation
title: RDF persistence generation module
description: >-
  The data of the generation toolchain and of the testkit: the configuration of one `rp-generate`
  run, the manifest it writes, the files and problems it produces, the view-models its templates
  render, the conformance cases, the reviewed shape of a class and a guard violation.
prefixes:
  rp: https://meaningfy.ws/ns/rdf-persistence#
  linkml: https://w3id.org/linkml/
default_prefix: rp
default_range: string
imports:
  - linkml:types
annotations:
  module_kind: technical

classes:
  GenerationTarget:
    title: Generation target
    description: >-
      One entry of the `[tool.rp-generate]` table of a `pyproject.toml`: a schema and the folders its
      generated artefacts are written to. Paths are relative to the folder of the `pyproject.toml`.
    class_uri: rp:GenerationTarget
    slots:
      - schema_file
      - package
      - python
      - typescript
      - diagrams
    slot_usage:
      schema_file:
        required: true
      package:
        required: true

  ManifestEntry:
    title: Manifest entry
    description: A file and the SHA-256 of its bytes, as recorded by a generation run.
    class_uri: rp:ManifestEntry
    slots:
      - path
      - sha256
    slot_usage:
      path:
        required: true
      sha256:
        required: true
  GenerationManifest:
    title: Generation manifest
    description: >-
      What one generation run read and wrote: the installed `linkml` version, the files it read and
      the files it wrote. Written as `rp-manifest.json` in the target's Python folder.
    class_uri: rp:GenerationManifest
    slots:
      - linkml
      - inputs
      - outputs
    slot_usage:
      linkml:
        required: true
  ConstraintCase:
    title: Constraint case
    description: >-
      One row of the conformance table: a constraint kind, a class that declares it, and the instance
      files the generated class and shape must accept and refuse.
    class_uri: rp:ConstraintCase
    slots:
      - kind
      - class_name
      - valid
      - invalid
    slot_usage:
      kind:
        required: true
      class_name:
        required: true
  SlotShape:
    title: Slot shape
    description: The shape of one slot of a class, as the schema induces it.
    class_uri: rp:SlotShape
    slots:
      - name
      - required
      - multivalued
      - range
      - alias
    slot_usage:
      name:
        required: true
      required:
        required: true
      multivalued:
        required: true
      range:
        required: true
  ClassShape:
    title: Class shape
    description: The reviewed shape of one class, its name and the shape of each of its slots.
    class_uri: rp:ClassShape
    slots:
      - class_name
      - slots
    slot_usage:
      class_name:
        required: true

  CliFlag:
    title: Command-line flag
    description: A command-line flag of `rp-generate` and the GenerationTarget field it overrides.
    class_uri: rp:CliFlag
    slots:
      - option
      - field
    slot_usage:
      option:
        required: true
      field:
        required: true
  GeneratedFile:
    title: Generated file
    description: One file a generator renders, its name inside the target folder and its text.
    class_uri: rp:GeneratedFile
    slots:
      - name
      - text
    slot_usage:
      name:
        required: true
      text:
        required: true
  CheckProblem:
    title: Check problem
    description: >-
      One problem a check, a pipeline step or the freshness comparison found, with where and by which
      rule. Only the command line formats it for the developer.
    class_uri: rp:CheckProblem
    slots:
      - rule
      - element
      - message
      - schema_file
      - step
    slot_usage:
      message:
        required: true
  PresenceRule:
    title: Presence rule
    description: A class-level rule over alternatives, and when its validator refuses.
    class_uri: rp:PresenceRule
    slots:
      - name
      - need
      - refused
    slot_usage:
      name:
        required: true
      need:
        required: true
      refused:
        required: true
  RuleAlternative:
    title: Rule alternative
    description: One alternative of a rule, its readable label and the Python expression that tells it holds.
    class_uri: rp:RuleAlternative
    slots:
      - label
      - holds
    slot_usage:
      label:
        required: true
      holds:
        required: true
  UniqueKeyOn:
    title: Unique key on a slot
    description: >-
      A unique key that a class's multivalued slot is subject to, with the IRIs the constraint query
      needs.
    class_uri: rp:UniqueKeyOn
    slots:
      - name
      - slot_iri
      - key_name
      - description
      - key_iris
    slot_usage:
      name:
        required: true
      slot_iri:
        required: true
      key_name:
        required: true
      key_iris:
        required: true
  Frame:
    title: Frame
    description: A JSON-LD frame, the types it selects, its references and the frames of its owned parts.
    class_uri: rp:Frame
    slots:
      - type_terms
      - references
      - parts
    slot_usage:
      type_terms:
        required: true
      references:
        required: true
      parts:
        required: true
  FramePart:
    title: Frame part
    description: The frame of the parts nested in one owned slot of a frame.
    class_uri: rp:FramePart
    slots:
      - name
      - frame
    slot_usage:
      name:
        required: true
      frame:
        required: true
  TsField:
    title: TypeScript field
    description: A field of a TypeScript interface.
    class_uri: rp:TsField
    slots:
      - name
      - type
      - optional
      - doc
    slot_usage:
      name:
        required: true
      type:
        required: true
      optional:
        required: true
      doc:
        required: true
  TsInterface:
    title: TypeScript interface
    description: A TypeScript interface and its fields.
    class_uri: rp:TsInterface
    slots:
      - name
      - doc
      - fields
    slot_usage:
      name:
        required: true
      doc:
        required: true
      fields:
        required: true
  TsEnumValue:
    title: TypeScript enum value
    description: A string literal of a TypeScript union type.
    class_uri: rp:TsEnumValue
    slots:
      - literal
      - doc
    slot_usage:
      literal:
        required: true
      doc:
        required: true
  TsEnum:
    title: TypeScript enum
    description: A union of string literals that stands for an enum of the schema.
    class_uri: rp:TsEnum
    slots:
      - name
      - doc
      - values
    slot_usage:
      name:
        required: true
      doc:
        required: true
      values:
        required: true
  TsImport:
    title: TypeScript import
    description: The names a TypeScript module imports from another module.
    class_uri: rp:TsImport
    slots:
      - module
      - names
    slot_usage:
      module:
        required: true
      names:
        required: true
  TsModule:
    title: TypeScript module
    description: One TypeScript file, for one module of the schema.
    class_uri: rp:TsModule
    slots:
      - name
      - enums
      - interfaces
      - imports
    slot_usage:
      name:
        required: true
      enums:
        required: true
      interfaces:
        required: true
      imports:
        required: true
  MmdAttribute:
    title: Mermaid attribute
    description: An attribute line of a Mermaid class box.
    class_uri: rp:MmdAttribute
    slots:
      - type
      - name
    slot_usage:
      type:
        required: true
      name:
        required: true
  MmdClass:
    title: Mermaid class
    description: One class box of a Mermaid diagram.
    class_uri: rp:MmdClass
    slots:
      - name
      - stereotype
      - attributes
    slot_usage:
      name:
        required: true
      attributes:
        required: true
  MmdModule:
    title: Mermaid module
    description: One Mermaid class diagram, for one module of the schema.
    class_uri: rp:MmdModule
    slots:
      - classes
      - links
      - externals
    slot_usage:
      classes:
        required: true
      links:
        required: true
      externals:
        required: true
  Violation:
    title: Violation
    description: A hand-written model or a generated artefact that a guard found out of place.
    class_uri: rp:Violation
    slots:
      - where
      - what
    slot_usage:
      where:
        required: true
      what:
        required: true
  ContainerMarker:
    title: Container marker
    description: A pytest marker of the container tests, the container it starts and its help text.
    class_uri: rp:ContainerMarker
    slots:
      - marker
      - container
      - help
    slot_usage:
      marker:
        required: true
      container:
        required: true
      help:
        required: true

  ExecResult:
    title: Exec result
    description: What a command run inside a container printed, and how it ended.
    class_uri: rp:ExecResult
    slots:
      - stdout
      - stderr
      - exit_code
    slot_usage:
      stdout:
        required: true
      stderr:
        required: true
      exit_code:
        required: true
  FusekiServer:
    title: Fuseki server
    description: Where the test Fuseki answers, and the one user it admits.
    class_uri: rp:FusekiServer
    slots:
      - url
      - user
      - password
    slot_usage:
      url:
        required: true
      user:
        required: true
      password:
        required: true
  GarageServer:
    title: Garage server
    description: The S3 endpoint of the test Garage and the key bootstrapped on it.
    class_uri: rp:GarageServer
    slots:
      - endpoint
      - key_id
      - secret
      - region
    slot_usage:
      endpoint:
        required: true
      key_id:
        required: true
      secret:
        required: true
      region:
        required: true
  ZitadelServer:
    title: Zitadel server
    description: >-
      Where the test Zitadel answers, and the admin machine user's personal access token, which
      authenticates the management API for provisioning a project, an application and machine users.
    class_uri: rp:ZitadelServer
    slots:
      - url
      - admin_pat
    slot_usage:
      url:
        required: true
      admin_pat:
        required: true

  MachineUser:
    title: Machine user
    description: >-
      A service account provisioned in the test Zitadel, with the private key it signs its
      JWT-profile assertions with.
    class_uri: rp:MachineUser
    slots:
      - name
      - user_id
      - key_id
      - private_key
    slot_usage:
      name:
        required: true
      user_id:
        required: true
      key_id:
        required: true
      private_key:
        required: true
  ZitadelProject:
    title: Zitadel project
    description: >-
      The project provisioned in the test Zitadel: the organisation and project ids, the machine
      users of the test principals, and the server that holds them.
    class_uri: rp:ZitadelProject
    slots:
      - server
      - organisation_id
      - project_id
      - machine_users
    slot_usage:
      server:
        required: true
      organisation_id:
        required: true
      project_id:
        required: true

slots:
  relative_path:
    title: Relative path
    description: >-
      A POSIX path below the folder of the `pyproject.toml`: not absolute, with no drive letter, no
      backslash, no empty segment and no `.` or `..` segment, so it cannot leave the project.
    slot_uri: rp:relativePath
    abstract: true
    pattern: '^(?:[^/:\\.\x00-\x1f\x7f][^/:\\\x00-\x1f\x7f]*|\.[^/:\\.\x00-\x1f\x7f][^/:\\\x00-\x1f\x7f]*|\.\.[^/:\\\x00-\x1f\x7f]+)(?:/(?:[^/:\\.\x00-\x1f\x7f][^/:\\\x00-\x1f\x7f]*|\.[^/:\\.\x00-\x1f\x7f][^/:\\\x00-\x1f\x7f]*|\.\.[^/:\\\x00-\x1f\x7f]+))*$'
  schema_file:
    is_a: relative_path
    title: Schema file
    description: >-
      The root LinkML schema file; the TOML key and the flag are `schema`, which the field name avoids
      because it would shadow a pydantic method.
    slot_uri: rp:schemaFile
    annotations:
      cli_flag: --schema
  package:
    title: Package
    description: The Python import path of the generated package, a dotted identifier.
    slot_uri: rp:package
    annotations:
      cli_flag: --package
    pattern: '^[A-Za-z_][A-Za-z0-9_]*(?:\.[A-Za-z_][A-Za-z0-9_]*)*$'
  python:
    is_a: relative_path
    title: Python folder
    description: >-
      The folder that receives the classes, shapes, context, frames and the schema copy; the folder of
      `package` when absent.
    slot_uri: rp:pythonFolder
    annotations:
      cli_flag: --python-out
  typescript:
    is_a: relative_path
    title: TypeScript folder
    description: The folder that receives the TypeScript types; none are written when absent.
    slot_uri: rp:typescriptFolder
    annotations:
      cli_flag: --typescript-out
  diagrams:
    is_a: relative_path
    title: Diagrams folder
    description: The folder that receives one Mermaid file per module; none are written when absent.
    slot_uri: rp:diagramsFolder
    annotations:
      cli_flag: --diagrams-out
  path:
    is_a: relative_path
    title: Path
    description: A file path, POSIX, relative to the folder of the `pyproject.toml`.
    slot_uri: rp:path
  sha256:
    title: SHA-256
    description: The SHA-256 of a file's bytes, in lowercase hexadecimal.
    slot_uri: rp:sha256
    pattern: '^[0-9a-f]{64}$'
  linkml:
    title: LinkML version
    description: The version of the `linkml` package that ran the generation.
    slot_uri: rp:linkmlVersion
  inputs:
    title: Inputs
    description: The files a generation run read, sorted by path.
    slot_uri: rp:manifestInputs
    range: ManifestEntry
    multivalued: true
    inlined_as_list: true
  outputs:
    title: Outputs
    description: The files a generation run wrote, sorted by path; not the manifest itself.
    slot_uri: rp:manifestOutputs
    range: ManifestEntry
    multivalued: true
    inlined_as_list: true
  kind:
    title: Constraint kind
    description: The kind of constraint a case exercises.
    slot_uri: rp:constraintKind
    range: ConstraintKind
  class_name:
    title: Class name
    description: The name of a class of the schema.
    slot_uri: rp:className
  valid:
    title: Valid instances
    description: Paths of instance files, beside the cases file, that the class and the shape must accept.
    slot_uri: rp:validInstances
    multivalued: true
  invalid:
    title: Invalid instances
    description: Paths of instance files, beside the cases file, that the class and the shape must refuse.
    slot_uri: rp:invalidInstances
    multivalued: true
  name:
    title: Name
    description: The name of the thing a record describes (a slot, a file, a class, a rule).
    slot_uri: rp:slotName
  required:
    title: Required
    description: Whether a value is required.
    slot_uri: rp:required
    range: boolean
  multivalued:
    title: Multivalued
    description: Whether the slot takes several values.
    slot_uri: rp:multivalued
    range: boolean
  range:
    title: Range
    description: The name of the type, enum or class the slot's values belong to.
    slot_uri: rp:range
  alias:
    title: Alias
    description: The name the slot's field carries in code and JSON when it differs from the slot's name; absent otherwise.
    slot_uri: rp:alias
  slots:
    title: Slots
    description: The shapes of a class's slots, in schema order.
    slot_uri: rp:slotShapes
    range: SlotShape
    multivalued: true
    inlined_as_list: true

  text:
    title: Text
    description: The text of a file.
    slot_uri: rp:text
  rule:
    title: Rule
    description: The id of the rule a problem breaks, a `HardRule` or `BoundaryRule` value or a lint rule name.
    slot_uri: rp:rule
  element:
    title: Element
    description: The element of the schema, or the file, a problem is about.
    slot_uri: rp:element
  message:
    title: Message
    description: What is wrong, in a line.
    slot_uri: rp:message
  step:
    title: Step
    description: The name of the pipeline step that found a problem.
    slot_uri: rp:step
  option:
    title: Option
    description: The command-line option, with its leading dashes.
    slot_uri: rp:option
  field:
    title: Field
    description: The name of the GenerationTarget field the option overrides.
    slot_uri: rp:targetField
  need:
    title: Need
    description: What a rule needs of its alternatives, in words.
    slot_uri: rp:need
  refused:
    title: Refused
    description: The Python condition under which a rule's validator refuses.
    slot_uri: rp:refused
  label:
    title: Label
    description: A readable label.
    slot_uri: rp:label
  holds:
    title: Holds
    description: The Python expression that tells an alternative holds.
    slot_uri: rp:holds
  slot_iri:
    title: Slot IRI
    description: The expanded IRI of a slot.
    slot_uri: rp:slotIri
  key_name:
    title: Key name
    description: The name of a unique key.
    slot_uri: rp:keyName
  description:
    title: Description
    description: A description in words.
    slot_uri: rp:descriptionText
  key_iris:
    title: Key IRIs
    description: The expanded IRIs of the slots that make up a unique key.
    slot_uri: rp:keyIris
    multivalued: true
  type_terms:
    title: Type terms
    description: The context terms of the types a frame selects.
    slot_uri: rp:typeTerms
    multivalued: true
  references:
    title: References
    description: The slots of a frame that hold references, left as IRIs.
    slot_uri: rp:frameReferences
    multivalued: true
  parts:
    title: Parts
    description: The frames of the owned parts nested in a frame, one per owned slot.
    slot_uri: rp:frameParts
    range: FramePart
    multivalued: true
    inlined_as_list: true
  frame:
    title: Frame
    description: The frame of the parts held by a slot.
    slot_uri: rp:partFrame
    range: Frame
  type:
    title: Type
    description: The type of a value, as the target language names it.
    slot_uri: rp:typeName
  optional:
    title: Optional
    description: Whether a field may be left out.
    slot_uri: rp:optional
    range: boolean
  doc:
    title: Doc
    description: A one-line doc comment, empty when there is none.
    slot_uri: rp:doc
  fields:
    title: Fields
    description: The fields of an interface.
    slot_uri: rp:tsFields
    range: TsField
    multivalued: true
    inlined_as_list: true
  literal:
    title: Literal
    description: A string literal, quoted.
    slot_uri: rp:literal
  values:
    title: Values
    description: The values of a union type.
    slot_uri: rp:tsValues
    range: TsEnumValue
    multivalued: true
    inlined_as_list: true
  module:
    title: Module
    description: The name of a schema module.
    slot_uri: rp:moduleName
  names:
    title: Names
    description: The names imported from a module.
    slot_uri: rp:importedNames
    multivalued: true
  enums:
    title: Enums
    description: The enums a TypeScript module declares.
    slot_uri: rp:tsEnums
    range: TsEnum
    multivalued: true
    inlined_as_list: true
  interfaces:
    title: Interfaces
    description: The interfaces a TypeScript module declares.
    slot_uri: rp:tsInterfaces
    range: TsInterface
    multivalued: true
    inlined_as_list: true
  imports:
    title: Imports
    description: The imports of a TypeScript module.
    slot_uri: rp:tsImports
    range: TsImport
    multivalued: true
    inlined_as_list: true
  stereotype:
    title: Stereotype
    description: The stereotype of a class box, `root` or `owned`, absent for a plain class.
    slot_uri: rp:stereotype
  attributes:
    title: Attributes
    description: The attribute lines of a class box.
    slot_uri: rp:mmdAttributes
    range: MmdAttribute
    multivalued: true
    inlined_as_list: true
  classes:
    title: Classes
    description: The class boxes of a diagram.
    slot_uri: rp:mmdClasses
    range: MmdClass
    multivalued: true
    inlined_as_list: true
  links:
    title: Links
    description: The relationship lines of a diagram.
    slot_uri: rp:mmdLinks
    multivalued: true
  externals:
    title: Externals
    description: The names of the classes a diagram draws as a name only.
    slot_uri: rp:mmdExternals
    multivalued: true
  marker:
    title: Marker
    description: The name of a pytest marker.
    slot_uri: rp:marker
  container:
    title: Container
    description: The name of a container the testkit starts.
    slot_uri: rp:container
  help:
    title: Help
    description: A line of help text.
    slot_uri: rp:help
  where:
    title: Where
    description: The place of a violation, a file and a line or a path.
    slot_uri: rp:where
  what:
    title: What
    description: What is wrong at that place.
    slot_uri: rp:what
  stdout:
    title: Standard output
    description: What the command wrote to its standard output.
    slot_uri: rp:stdout
  stderr:
    title: Standard error
    description: What the command wrote to its standard error.
    slot_uri: rp:stderr
  url:
    title: URL
    description: The base URL a server answers on.
    slot_uri: rp:url
  user:
    title: User
    description: The user name the server admits.
    slot_uri: rp:user
  password:
    title: Password
    description: The password of the user.
    slot_uri: rp:password
    annotations:
      secret: 'true'
  endpoint:
    title: Endpoint
    description: The URL of the S3 endpoint.
    slot_uri: rp:endpoint
  key_id:
    title: Key id
    description: The id of the access key.
    slot_uri: rp:keyId
  secret:
    title: Secret
    description: The secret of the access key.
    slot_uri: rp:secret
    annotations:
      secret: 'true'
  region:
    title: Region
    description: The region name the S3 client signs for.
    slot_uri: rp:region
  admin_pat:
    title: Admin PAT
    description: The personal access token of the admin machine user.
    slot_uri: rp:adminPat
    annotations:
      secret: 'true'
  exit_code:
    title: Exit code
    description: The exit code the command ended with.
    slot_uri: rp:exitCode
    range: integer
  user_id:
    title: User id
    description: The id of a user in the identity provider.
    slot_uri: rp:userId
  private_key:
    title: Private key
    description: The PEM private key of a machine user's key pair.
    slot_uri: rp:privateKey
    annotations:
      secret: 'true'
  server:
    title: Server
    description: The test server a provisioned resource lives on.
    slot_uri: rp:server
    range: ZitadelServer
  organisation_id:
    title: Organisation id
    description: The id of the organisation that owns the provisioned resources.
    slot_uri: rp:organisationId
  project_id:
    title: Project id
    description: The id of the provisioned project, whose audience scope puts it in a token.
    slot_uri: rp:projectId
  machine_users:
    title: Machine users
    description: The service accounts of the test principals.
    slot_uri: rp:machineUsers
    range: MachineUser
    multivalued: true
    inlined_as_list: true

enums:
  HardRule:
    title: Hard rule
    description: The rules of the hard check; a problem line starts with its rule.
    permissible_values:
      iri:
        title: Iri
        description: An element needs an IRI, explicit or from a declared default prefix.
        meaning: rp:HardRuleIri
      title:
        title: Title
        description: An element needs a title.
        meaning: rp:HardRuleTitle
      description:
        title: Description
        description: An element needs a description.
        meaning: rp:HardRuleDescription
      meaning:
        title: Meaning
        description: A permissible value needs a meaning, an IRI.
        meaning: rp:HardRuleMeaning
      rp_path:
        title: Rp path
        description: An aggregate root needs the rp_path annotation.
        meaning: rp:HardRulePath
      described:
        title: Described
        description: A root or an owned class includes Described.
        meaning: rp:HardRuleDescribed
      annotation:
        title: Annotation
        description: >-
          An annotation value is one of its allowed values; the `rp_path` value is a URL segment.
        meaning: rp:HardRuleAnnotation
      unique_key:
        title: Unique key
        description: A unique key is named by an identifier, since generated code carries the name.
        meaning: rp:HardRuleUniqueKey
  BoundaryRule:
    title: Boundary rule
    description: The rules of the boundary check; a problem line starts with its rule.
    permissible_values:
      ownership:
        title: Ownership
        description: A class is an aggregate root or is owned by a root.
        meaning: rp:BoundaryRuleOwnership
      reference:
        title: Reference
        description: A slot that is not owned points to a root or to a reference class.
        meaning: rp:BoundaryRuleReference
      module_kind:
        title: Module kind
        description: A domain module does not import a technical or an access module.
        meaning: rp:BoundaryRuleModuleKind
  ConstraintKind:
    title: Constraint kind
    description: The constraint kinds of v1 that the generated classes and shapes must agree on.
    permissible_values:
      required:
        title: Required
        description: A required slot refuses a missing value.
        meaning: rp:ConstraintKindRequired
      cardinality:
        title: Cardinality
        description: A slot's minimum and maximum cardinality bound the number of values.
        meaning: rp:ConstraintKindCardinality
      range_type:
        title: Range type
        description: A slot's range type refuses a value of another type.
        meaning: rp:ConstraintKindRangeType
      range_enum:
        title: Range enum
        description: An enum range refuses a value outside its permissible values.
        meaning: rp:ConstraintKindRangeEnum
      pattern:
        title: Pattern
        description: A pattern refuses a value that does not match.
        meaning: rp:ConstraintKindPattern
      value_bounds:
        title: Value bounds
        description: A minimum or maximum value refuses a value outside the bounds.
        meaning: rp:ConstraintKindValueBounds
      identifier:
        title: Identifier
        description: An identifier slot takes one IRI that names the instance.
        meaning: rp:ConstraintKindIdentifier
      closed:
        title: Closed
        description: A class refuses an unknown field or predicate.
        meaning: rp:ConstraintKindClosed
      exactly_one_of:
        title: Exactly one of
        description: Exactly one of several alternatives is present.
        meaning: rp:ConstraintKindExactlyOneOf
      any_of:
        title: Any of
        description: At least one of several alternatives is present.
        meaning: rp:ConstraintKindAnyOf
      unique_keys:
        title: Unique keys
        description: No two items of a multivalued slot have equal key values.
        meaning: rp:ConstraintKindUniqueKeys
  GenerationAnnotation:
    title: Generation annotation
    description: The annotations this module's schema carries for the toolchain itself.
    permissible_values:
      cli_flag:
        title: Cli flag
        description: On a GenerationTarget slot, the command-line flag that overrides it.
        meaning: rp:GenerationAnnotationCliFlag
      secret:
        title: Secret
        description: On a slot, `true` when its value must stay out of the repr of the generated class.
        meaning: rp:GenerationAnnotationSecret
      allows_extra:
        title: Allows extra
        description: >-
          On a class, `true` when it accepts fields it does not declare and keeps them in `model_extra`,
          as the answer of a foreign API needs. Every other class refuses them.
        meaning: rp:GenerationAnnotationAllowsExtra
      strict:
        title: Strict
        description: >-
          On a slot, `true` when its value must already be of its type: a string is not read as a number,
          and a boolean is not read as one either.
        meaning: rp:GenerationAnnotationStrict
