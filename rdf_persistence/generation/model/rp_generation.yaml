id: https://meaningfy.ws/ns/rdf-persistence/generation
name: rp_generation
title: RDF persistence generation module
description: >-
  The data of the generation toolchain: the configuration of one `rp-generate` run. Later tasks add
  the manifest and the conformance cases to this module.
prefixes:
  rp: https://meaningfy.ws/ns/rdf-persistence#
  linkml: https://w3id.org/linkml/
default_prefix: rp
default_range: string
imports:
  - linkml:types
annotations:
  module_kind: technical

classes:
  GenerationTarget:
    title: Generation target
    description: >-
      One entry of the `[tool.rp-generate]` table of a `pyproject.toml`: a schema and the folders its
      generated artefacts are written to. Paths are relative to the folder of the `pyproject.toml`.
    class_uri: rp:GenerationTarget
    slots:
      - schema_file
      - package
      - python
      - typescript
      - diagrams
    slot_usage:
      schema_file:
        required: true
      package:
        required: true

slots:
  schema_file:
    title: Schema file
    description: >-
      The root LinkML schema file; the TOML key and the flag are `schema`, which the field name avoids
      because it would shadow a pydantic method.
    slot_uri: rp:schemaFile
  package:
    title: Package
    description: The Python import path of the generated package.
    slot_uri: rp:package
  python:
    title: Python folder
    description: >-
      The folder that receives the classes, shapes, context, frames and the schema copy; the folder of
      `package` when absent.
    slot_uri: rp:pythonFolder
  typescript:
    title: TypeScript folder
    description: The folder that receives the TypeScript types; none are written when absent.
    slot_uri: rp:typescriptFolder
  diagrams:
    title: Diagrams folder
    description: The folder that receives one Mermaid file per module; none are written when absent.
    slot_uri: rp:diagramsFolder

enums:
  HardRule:
    title: Hard rule
    description: The rules of the hard check; a problem line starts with its rule.
    permissible_values:
      iri:
        title: Iri
        description: An element needs an IRI, explicit or from a declared default prefix.
        meaning: rp:HardRuleIri
      title:
        title: Title
        description: An element needs a title.
        meaning: rp:HardRuleTitle
      description:
        title: Description
        description: An element needs a description.
        meaning: rp:HardRuleDescription
      meaning:
        title: Meaning
        description: A permissible value needs a meaning, an IRI.
        meaning: rp:HardRuleMeaning
      rp_path:
        title: Rp path
        description: An aggregate root needs the rp_path annotation.
        meaning: rp:HardRulePath
      described:
        title: Described
        description: A root or an owned class includes Described.
        meaning: rp:HardRuleDescribed
      annotation:
        title: Annotation
        description: An annotation value is one of its allowed values.
        meaning: rp:HardRuleAnnotation
  BoundaryRule:
    title: Boundary rule
    description: The rules of the boundary check; a problem line starts with its rule.
    permissible_values:
      ownership:
        title: Ownership
        description: A class is an aggregate root or is owned by a root.
        meaning: rp:BoundaryRuleOwnership
      reference:
        title: Reference
        description: A slot that is not owned points to a root or to a reference class.
        meaning: rp:BoundaryRuleReference
      module_kind:
        title: Module kind
        description: A domain module does not import a technical or an access module.
        meaning: rp:BoundaryRuleModuleKind
