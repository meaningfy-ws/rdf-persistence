id: https://meaningfy.ws/ns/rdf-persistence/provenance
name: rp_provenance
title: RDF persistence provenance module
description: >-
  The provenance mixin of the metamodel, on PROV-O: where an entity came from. The application writes
  it, about the entity.
prefixes:
  rp: https://meaningfy.ws/ns/rdf-persistence#
  linkml: https://w3id.org/linkml/
  prov: http://www.w3.org/ns/prov#
default_prefix: rp
default_range: string
imports:
  - linkml:types
  - rp_core

classes:
  Provenanced:
    title: Provenanced
    description: A mixin for entities whose derivation, generating activity and attribution are recorded.
    class_uri: rp:Provenanced
    mixin: true
    slots:
      - was_derived_from
      - was_generated_by
      - was_attributed_to
      - generated_at_time
  Activity:
    title: Activity
    description: Something that happened and generated or changed entities, carried out by principals.
    class_uri: prov:Activity
    slots:
      - id
      - was_associated_with

slots:
  was_derived_from:
    title: Was derived from
    description: The IRI of an entity this one was derived from.
    slot_uri: prov:wasDerivedFrom
    range: uri
    multivalued: true
  was_generated_by:
    title: Was generated by
    description: The activity that generated this entity.
    slot_uri: prov:wasGeneratedBy
    range: Activity
  was_attributed_to:
    title: Was attributed to
    description: The principal this entity is attributed to.
    slot_uri: prov:wasAttributedTo
    range: Principal
  generated_at_time:
    title: Generated at time
    description: The time this entity was generated.
    slot_uri: prov:generatedAtTime
    range: datetime
  was_associated_with:
    title: Was associated with
    description: A principal that carried out the activity.
    slot_uri: prov:wasAssociatedWith
    range: Principal
    multivalued: true
