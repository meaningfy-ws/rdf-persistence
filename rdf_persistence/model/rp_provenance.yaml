id: https://meaningfy.ws/ns/rdf-persistence/provenance
name: rp_provenance
title: RDF persistence provenance module
description: >-
  The provenance mixin of the metamodel, on PROV-O: where an entity came from. The application writes
  it, about the entity; the toolkit also writes an activity record on every commit.
prefixes:
  rp: https://meaningfy.ws/ns/rdf-persistence#
  linkml: https://w3id.org/linkml/
  prov: http://www.w3.org/ns/prov#
default_prefix: rp
default_range: string
imports:
  - linkml:types
  - rp_core
annotations:
  python_package: rdf_persistence.core.domain.generated

classes:
  Provenanced:
    title: Provenanced
    description: A mixin for entities whose derivation, generating activity and attribution are recorded.
    class_uri: rp:Provenanced
    mixin: true
    slots:
      - was_derived_from
      - was_generated_by
      - was_attributed_to
      - generated_at_time
  Activity:
    title: Activity
    description: Something that happened and generated or changed entities, carried out by principals.
    class_uri: prov:Activity
    slots:
      - id
      - was_associated_with
      - started_at_time
      - ended_at_time
      - generations
      - invalidations
  Generation:
    title: Generation
    description: The generation of one version of an entity by an activity.
    class_uri: prov:Generation
    slots: &part_slots
      - activity
      - at_time
      - entity
      - entity_class
      - entity_version
    slot_usage: &part_usage
      activity:
        required: true
      at_time:
        required: true
      entity:
        required: true
      entity_version:
        required: true
  Invalidation:
    title: Invalidation
    description: The invalidation of one version of an entity by an activity.
    class_uri: prov:Invalidation
    slots: *part_slots
    slot_usage: *part_usage
  Add:
    title: Add
    description: An activity that added an aggregate.
    class_uri: rp:Add
    is_a: Activity
  Replace:
    title: Replace
    description: An activity that replaced an aggregate with a new version.
    class_uri: rp:Replace
    is_a: Activity
  Remove:
    title: Remove
    description: An activity that removed an aggregate.
    class_uri: rp:Remove
    is_a: Activity

slots:
  was_derived_from:
    title: Was derived from
    description: The IRI of an entity this one was derived from.
    slot_uri: prov:wasDerivedFrom
    range: uri
    multivalued: true
  was_generated_by:
    title: Was generated by
    description: The activity that generated this entity.
    slot_uri: prov:wasGeneratedBy
    range: Activity
  was_attributed_to:
    title: Was attributed to
    description: The principal this entity is attributed to.
    slot_uri: prov:wasAttributedTo
    range: Principal
  generated_at_time:
    title: Generated at time
    description: The time this entity was generated.
    slot_uri: prov:generatedAtTime
    range: datetime
  was_associated_with:
    title: Was associated with
    description: A principal that carried out the activity.
    slot_uri: prov:wasAssociatedWith
    range: Principal
    multivalued: true
    annotations:
      toolkit_filled: true
  started_at_time:
    title: Started at time
    description: The time the activity started.
    slot_uri: prov:startedAtTime
    range: datetime
    annotations:
      toolkit_filled: true
  ended_at_time:
    title: Ended at time
    description: The time the activity ended.
    slot_uri: prov:endedAtTime
    range: datetime
    annotations:
      toolkit_filled: true
  used_resource:
    title: Used resource
    description: The IRI of the aggregate the activity used.
    slot_uri: prov:used
    range: uri
  generations:
    title: Generations
    description: The versions of entities the activity generated.
    slot_uri: rp:generation
    range: Generation
    multivalued: true
    inlined_as_list: true
    annotations:
      owned: true
      toolkit_filled: true
  invalidations:
    title: Invalidations
    description: The versions of entities the activity invalidated.
    slot_uri: rp:invalidation
    range: Invalidation
    multivalued: true
    inlined_as_list: true
    annotations:
      owned: true
      toolkit_filled: true
  activity:
    title: Activity
    description: The IRI of the activity this generation or invalidation belongs to.
    slot_uri: prov:activity
    range: uri
  at_time:
    title: At time
    description: The time of the generation or invalidation, the end of its activity.
    slot_uri: prov:atTime
    range: datetime
  entity:
    title: Entity
    description: The IRI of the entity whose version was generated or invalidated.
    slot_uri: rp:entity
    range: uri
  entity_class:
    title: Entity class
    description: The IRI of the entity's class, when it had one.
    slot_uri: rp:entityClass
    range: uri
  entity_version:
    title: Entity version
    description: The version token of the entity that was generated or invalidated.
    slot_uri: rp:entityVersion
    range: string
