id: https://meaningfy.ws/ns/rdf-persistence/workflow
name: rp_workflow
title: RDF persistence workflow module
description: >-
  The workflow of the metamodel: the definition an application keeps in a file (a set of states and the
  transitions between them), the mixin that gives an aggregate its current state, and the record the
  toolkit writes for every transition, on PROV-O.
prefixes:
  rp: https://meaningfy.ws/ns/rdf-persistence#
  linkml: https://w3id.org/linkml/
  ADMS: http://www.w3.org/ns/adms#
  prov: http://www.w3.org/ns/prov#
default_prefix: rp
default_range: string
imports:
  - linkml:types
  - rp_core
  - rp_provenance
  - rp_discussion
annotations:
  python_package: rdf_persistence.collaboration.domain.generated

classes:
  Workflow:
    title: Workflow
    description: >-
      The definition of a workflow, read from a file when the service starts and never stored: its name,
      its states, the state an aggregate starts in and the transitions between states. Its identifier is
      the IRI of the scheme whose concepts are the states, and it must stay stable once aggregates have
      states.
    class_uri: rp:Workflow
    slots:
      - id
      - workflow_name
      - workflow_states
      - initial_state
      - workflow_transitions
      - assignable
    slot_usage:
      id:
        required: true
      workflow_name:
        required: true
      workflow_states:
        required: true
      initial_state:
        required: true
  WorkflowTransition:
    title: Workflow transition
    description: >-
      One transition of a workflow, from one state to another, with the roles that may make it. The
      states are named, not given as IRIs.
    class_uri: rp:WorkflowTransition
    slots:
      - from_state
      - to_state
      - transition_roles
      - comment_required
      - clears_assignees
    slot_usage:
      from_state:
        required: true
      to_state:
        required: true
      transition_roles:
        required: true
  UnderWorkflow:
    title: Under workflow
    description: >-
      A mixin for an aggregate root that follows a workflow, which its class names with the workflow
      annotation. It gives the root its current state, which only a transition changes, and, under
      an assignable workflow, its assignees, which only an assignment or a clearing transition
      changes.
    class_uri: rp:UnderWorkflow
    mixin: true
    slots:
      - workflow_status
      - assigned_to
  Transition:
    title: Transition
    description: >-
      One transition of an aggregate, as an activity: which aggregate it used, from which state to which,
      when, by whom and with which comment. The toolkit stores it as the activity of the commit that
      moves the aggregate, in the provenance graph, and keeps it when the aggregate is deleted. The
      payload slots belong to the command only: the stored record has none of them.
    class_uri: rp:Transition
    is_a: Activity
    slots:
      - used_resource
      - from_state_iri
      - to_state_iri
      - transition_comment
      - released_principals
      - to_state
      - expected_version
      - body_value
    slot_usage:
      used_resource:
        required: true
      to_state:
        annotations:
          payload: true
      expected_version:
        annotations:
          payload: true
      body_value:
        annotations:
          payload: true
  Assignment:
    title: Assignment
    description: >-
      One change of the assignees of an aggregate, as an activity: which aggregate it used, which
      principals it added and which it removed, when and by whom. The toolkit stores it as the activity
      of the commit that changes the assignees, in the provenance graph, and keeps it when the aggregate
      is deleted. The payload slots belong to the command only: the stored record has none of them.
    class_uri: rp:Assignment
    is_a: Activity
    slots:
      - used_resource
      - assigned_principals
      - released_principals
      - assigned_to
      - expected_version
    slot_usage:
      used_resource:
        required: true
      assigned_to:
        annotations:
          payload: true
      expected_version:
        annotations:
          payload: true

slots:
  workflow_name:
    title: Workflow name
    description: The name the workflow goes by, which the workflow annotation of a class refers to.
    slot_uri: rp:workflowName
    is_a: url_segment
  workflow_states:
    title: Workflow states
    description: >-
      The names of the states, lower case, starting with a letter, with digits, hyphens and underscores.
      The IRI of a state is the workflow's identifier, a slash and its name.
    slot_uri: rp:workflowState
    range: string
    multivalued: true
    pattern: "^[a-z][a-z0-9_-]*$"
  initial_state:
    title: Initial state
    description: The name of the state a new aggregate starts in, one of the states.
    slot_uri: rp:initialState
    range: string
  workflow_transitions:
    title: Workflow transitions
    description: The transitions of the workflow; they are part of its definition.
    slot_uri: rp:workflowTransition
    range: WorkflowTransition
    multivalued: true
    inlined_as_list: true
    annotations:
      owned: true
  from_state:
    title: From state
    description: The name of the state a transition leaves. A stored record gives an IRI in from_state_iri.
    slot_uri: rp:fromStateName
    range: string
  to_state:
    title: To state
    description: The name of the state a transition enters. A stored record gives an IRI in to_state_iri.
    slot_uri: rp:toStateName
    range: string
  transition_roles:
    title: Transition roles
    description: The names of the roles of which one is needed to make the transition.
    slot_uri: rp:transitionRole
    range: string
    multivalued: true
  comment_required:
    title: Comment required
    description: Whether the transition needs a comment; no by default.
    slot_uri: rp:commentRequired
    range: boolean
    ifabsent: "false"
  assignable:
    title: Assignable
    description: Whether the aggregates under the workflow may have assignees; no by default.
    slot_uri: rp:assignable
    range: boolean
    ifabsent: "false"
  clears_assignees:
    title: Clears assignees
    description: >-
      Whether the transition removes every assignee of the aggregate as it moves it; no by default.
      Only an edge of an assignable workflow may say yes.
    slot_uri: rp:clearsAssignees
    range: boolean
    ifabsent: "false"
  assigned_to:
    title: Assigned to
    description: >-
      The principals the aggregate is assigned to, each one who may read it. The toolkit owns the
      slot: only an assignment or a clearing transition changes it.
    slot_uri: rp:assignedTo
    range: Principal
    multivalued: true
  assigned_principals:
    title: Assigned principals
    description: The principals an assignment added to the aggregate's assignees.
    slot_uri: rp:assignedPrincipal
    range: Principal
    multivalued: true
    annotations:
      toolkit_filled: true
  released_principals:
    title: Released principals
    description: The principals an assignment or a clearing transition removed from the aggregate's assignees.
    slot_uri: rp:releasedPrincipal
    range: Principal
    multivalued: true
    annotations:
      toolkit_filled: true
  workflow_status:
    title: Workflow status
    description: The current state of the aggregate, the IRI of a state of its workflow.
    slot_uri: ADMS:status
    range: uri
  transition_comment:
    title: Transition comment
    description: The IRI of the comment the transition posted, when it had one.
    slot_uri: rp:transitionComment
    range: uri
    annotations:
      toolkit_filled: true
  expected_version:
    title: Expected version
    description: The version of the aggregate the caller read; the move is made only if it still holds.
    slot_uri: rp:expectedVersion
    range: string
