id: https://meaningfy.ws/ns/rdf-persistence
name: rp
title: RDF persistence metamodel
version: "3"
description: The whole RDF persistence metamodel. An application imports this schema, or only the modules it uses.
prefixes:
  rp: https://meaningfy.ws/ns/rdf-persistence#
  linkml: https://w3id.org/linkml/
default_prefix: rp
default_range: string
imports:
  - linkml:types
  - rp_core
  - rp_annotations
  - rp_provenance
  - rp_access
  - rp_tenancy
  - rp_files
  - rp_collections
  - rp_discussion
  - rp_workflow
annotations:
  python_package: rdf_persistence.core.domain.generated
  public_package: rdf_persistence
