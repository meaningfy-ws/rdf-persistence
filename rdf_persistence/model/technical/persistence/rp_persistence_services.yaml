id: https://meaningfy.ws/ns/rdf-persistence/persistence-services
name: rp_persistence_services
title: RDF persistence persistence services module
description: >-
  The served technical models of the `persistence` theme: the listing of aggregates, its request, its
  plan and its page, and the head of a stored aggregate. The HTTP service serves them, so the toolkit's
  OpenAPI document and TypeScript types describe them; they are generated into their own package, so
  an application's models do not carry them (technical-models DEC-3, DEC-7; thematic-structure PD-2).
  The limits the store's operations are held to are settings, not served; they are in
  `rp_persistence_settings`, in the `settings` package beside this one. `Any` is declared here, the
  lowest theme that uses it, and the schemas of the higher themes import it.
prefixes:
  rp: https://meaningfy.ws/ns/rdf-persistence#
  linkml: https://w3id.org/linkml/
default_prefix: rp
default_range: string
imports:
  - linkml:types
annotations:
  module_kind: technical
  python_package: rdf_persistence.persistence.services.generated

classes:
  Any:
    title: Any
    description: Any value; the slots that range over it hold data the toolkit does not model.
    class_uri: linkml:Any
  Page:
    title: Page
    description: One page of a listing, with the position of the page in the whole listing.
    class_uri: rp:Page
    slots:
      - items
      - total
      - limit
      - offset
    slot_usage:
      items:
        required: true
      total:
        required: true
      limit:
        required: true
      offset:
        required: true
  Filter:
    title: Filter
    description: >-
      One filter of a listing, the name of a slot of the listed type and the value it must have, or
      whose text it must contain, as the text the caller sent.
    class_uri: rp:Filter
    slots:
      - filter_slot
      - filter_value
      - filter_contains
    slot_usage:
      filter_slot:
        required: true
      filter_value:
        required: true
      filter_contains:
        ifabsent: "false"
  Contains:
    title: Contains
    description: >-
      A value of `Session.find` that asks for a case-insensitive substring of a string slot rather
      than its value.
    class_uri: rp:Contains
    slots:
      - contains_text
    slot_usage:
      contains_text:
        required: true
  ListRequest:
    title: List request
    description: >-
      The query of a listing, as the caller sent it: the filters, the position and size of
      the page and the key to sort by.
    class_uri: rp:ListRequest
    slots:
      - limit
      - offset
      - sort
      - filters
    slot_usage:
      limit:
        ifabsent: int(50)
      offset:
        ifabsent: int(0)
  Condition:
    title: Condition
    description: >-
      A filter of a listing resolved against the slots of the listed type: the aggregate has this
      statement, or a statement whose text contains the value. The value is an IRI when it is a
      reference, else a literal of the datatype.
    class_uri: rp:Condition
    slots:
      - condition_predicate
      - condition_value
      - condition_datatype
      - condition_reference
      - filter_contains
    slot_usage:
      condition_predicate:
        required: true
      condition_value:
        required: true
      condition_reference:
        ifabsent: "false"
      filter_contains:
        ifabsent: "false"
  ListPlan:
    title: List plan
    description: >-
      A listing resolved against the slots of the listed type: the class, the typed conditions, the
      predicate to order by (none orders by IRI), the page, and the graphs of the aggregates the
      caller may not read.
    class_uri: rp:ListPlan
    slots:
      - plan_class
      - conditions
      - plan_sort
      - descending
      - limit
      - offset
      - hidden_graphs
    slot_usage:
      plan_class:
        required: true
      descending:
        ifabsent: "false"
      limit:
        required: true
      offset:
        required: true
  AggregateHead:
    title: Aggregate head
    description: The IRI, the types and the version token of one stored aggregate, without its content.
    class_uri: rp:AggregateHead
    slots:
      - head_iri
      - head_types
      - head_version

slots:
  items:
    title: Items
    description: The objects of the page; framed aggregates, or tenant summaries.
    slot_uri: rp:items
    range: Any
    multivalued: true
  total:
    title: Total
    description: The number of objects in the whole listing.
    slot_uri: rp:total
    range: integer
    minimum_value: 0
  limit:
    title: Limit
    description: The most objects the page can hold.
    slot_uri: rp:limit
    range: integer
    minimum_value: 1
    maximum_value: 200
  offset:
    title: Offset
    description: The position of the page's first object in the whole listing.
    slot_uri: rp:offset
    range: integer
    minimum_value: 0
    maximum_value: 9007199254740991
  sort:
    title: Sort
    description: >-
      The slot a listing is ordered by, ascending, or descending when its name starts with a minus
      sign; absent, the listing is ordered by IRI.
    slot_uri: rp:sort
    range: string
  filters:
    title: Filters
    description: The filters of a listing; all of them must hold.
    slot_uri: rp:filter
    range: Filter
    multivalued: true
    inlined_as_list: true
  filter_contains:
    title: Filter contains
    description: Whether the filter matches a substring of the slot's text, ignoring case, rather than the value.
    slot_uri: rp:filterContains
    alias: contains
    range: boolean
  contains_text:
    title: Contains text
    description: The text a string slot must hold, in any case.
    slot_uri: rp:containsText
    alias: text
    range: string
  condition_predicate:
    title: Condition predicate
    description: The IRI of the predicate the aggregate must have a statement with.
    slot_uri: rp:conditionPredicate
    alias: predicate
    range: uri
  condition_value:
    title: Condition value
    description: The value of the statement, an IRI or the lexical form of a literal.
    slot_uri: rp:conditionValue
    alias: value
    range: string
  condition_datatype:
    title: Condition datatype
    description: The IRI of the datatype of a literal value; absent for a plain string.
    slot_uri: rp:conditionDatatype
    alias: datatype
    range: uri
  condition_reference:
    title: Condition reference
    description: Whether the value is an IRI rather than a literal.
    slot_uri: rp:conditionReference
    alias: reference
    range: boolean
  plan_class:
    title: Plan class
    description: The IRI of the class of the aggregates listed.
    slot_uri: rp:planClass
    alias: target
    range: uri
  conditions:
    title: Conditions
    description: The conditions of a listing; all of them must hold.
    slot_uri: rp:condition
    range: Condition
    multivalued: true
    inlined_as_list: true
  plan_sort:
    title: Plan sort
    description: The IRI of the predicate a listing is ordered by; absent, it is ordered by IRI.
    slot_uri: rp:planSort
    alias: sort_by
    range: uri
  descending:
    title: Descending
    description: Whether the order is reversed.
    slot_uri: rp:descending
    range: boolean
  hidden_graphs:
    title: Hidden graphs
    description: The IRIs of the graphs of the aggregates a listing leaves out.
    slot_uri: rp:hiddenGraph
    range: uri
    multivalued: true
  head_iri:
    title: Head IRI
    description: The IRI of the stored aggregate.
    slot_uri: rp:headIri
    range: uri
  head_types:
    title: Head types
    description: The class IRIs the stored aggregate is typed with.
    slot_uri: rp:headType
    range: uri
    multivalued: true
  head_version:
    title: Head version
    description: The version token of the stored aggregate's graph.
    slot_uri: rp:headVersion
    range: string
  filter_slot:
    title: Filter slot
    description: The name of the slot the filter is on.
    slot_uri: rp:filterSlot
    alias: slot
    range: string
  filter_value:
    title: Filter value
    description: The value the slot must have, as text.
    slot_uri: rp:filterValue
    alias: value
    range: string
