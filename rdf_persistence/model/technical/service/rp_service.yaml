id: https://meaningfy.ws/ns/rdf-persistence/service
name: rp_service
title: RDF persistence service module
description: >-
  The toolkit's own data types for the HTTP service: the caller a token verifier returns, and the
  request and response bodies of the tenant routes (the settings of `install_service` and the IRI policy
  are in the `iris` theme's schema, which this one imports). They are generated into their own package,
  so an application's models do not carry them.
prefixes:
  rp: https://meaningfy.ws/ns/rdf-persistence#
  linkml: https://w3id.org/linkml/
default_prefix: rp
default_range: string
imports:
  - linkml:types
  - rdf_persistence/model/rp_core
  - rdf_persistence/model/rp_access
  - rdf_persistence/model/rp_tenancy
  - ../iris/rp_iris_services
annotations:
  module_kind: technical
  python_package: rdf_persistence.services.generated.service

classes:
  Any:
    title: Any
    description: Any value; the slots that range over it hold data the toolkit does not model.
    class_uri: linkml:Any
  TenantDump:
    title: Tenant dump
    description: >-
      The manifest of a tenant dump archive, written by `dump_tenant` and read by `restore_tenant`:
      where and when the dump was taken, which schema and toolkit it came from, the tenant it holds
      and the IRI policy that minted its IRIs, so a restore can check that the dump was made under the
      same schema and policy.
    class_uri: rp:TenantDump
    slots:
      - format_version
      - dump_created_at
      - toolkit_version
      - schema_id
      - schema_version
      - source_tenant
      - source_tenant_id
      - label
      - iri_policy
    slot_usage:
      format_version:
        required: true
      dump_created_at:
        required: true
      toolkit_version:
        required: true
      schema_id:
        required: true
        description: The id of the LinkML schema whose data the dump holds; a restore checks it against its own.
      source_tenant:
        required: true
      source_tenant_id:
        required: true
      label:
        required: true
      iri_policy:
        required: true
        inlined: true
  VerifiedCaller:
    title: Verified caller
    description: >-
      What a token verifier returns for a valid token, the principal and its global roles.
    class_uri: rp:VerifiedCaller
    slots:
      - principal
      - global_roles
    slot_usage:
      principal:
        required: true
  TenantCreate:
    title: Tenant create
    description: The body that creates a tenant, its label and the slots of the tenant's root object.
    class_uri: rp:TenantCreate
    mixins:
      - TenantLabelled
    slots:
      - root
    slot_usage:
      root:
        required: true
  TenantSummary:
    title: Tenant summary
    description: What the service answers about one tenant, in a listing or after creating it.
    class_uri: rp:TenantSummary
    slots:
      - id
      - label
      - state
      - allowed_actions
    slot_usage:
      id:
        required: true
      label:
        required: true
      state:
        required: true
  LabelUpdate:
    title: Label update
    description: The body that replaces the label of a tenant.
    class_uri: rp:LabelUpdate
    mixins:
      - TenantLabelled
  GrantSet:
    title: Grant set
    description: >-
      The body that replaces the grants and prohibitions of a tenant; two grants with the same
      assignee, target and role or action are refused.
    class_uri: rp:GrantSet
    slots:
      - grants
      - prohibitions
  CallerAccess:
    title: Caller access
    description: >-
      What the access check needs to know about one caller in one tenant: the tenant's state, and the
      grants and prohibitions of the access record that name the caller.
    class_uri: rp:CallerAccess
    slots:
      - tenant
      - state
      - grants
      - prohibitions
    slot_usage:
      tenant:
        required: true
      state:
        required: true
  Authorised:
    title: Authorised
    description: >-
      What a route's access check settled: the caller's principal, its access to the tenant, and the
      IRI of the tenant or aggregate it was checked on, which the route then acts on, and the global
      roles the token granted the caller.
    class_uri: rp:Authorised
    slots:
      - principal
      - caller_access
      - checked_target
      - global_roles
    slot_usage:
      principal:
        required: true
      caller_access:
        required: true
      checked_target:
        required: true
  Page:
    title: Page
    description: One page of a listing, with the position of the page in the whole listing.
    class_uri: rp:Page
    slots:
      - items
      - total
      - limit
      - offset
    slot_usage:
      items:
        required: true
      total:
        required: true
      limit:
        required: true
      offset:
        required: true
  Filter:
    title: Filter
    description: >-
      One equality filter of a listing, the name of a slot of the listed type and the value it must
      have, as the text the caller sent.
    class_uri: rp:Filter
    slots:
      - filter_slot
      - filter_value
    slot_usage:
      filter_slot:
        required: true
      filter_value:
        required: true
  ListRequest:
    title: List request
    description: >-
      The query of a listing, as the caller sent it: the equality filters, the position and size of
      the page and the key to sort by.
    class_uri: rp:ListRequest
    slots:
      - limit
      - offset
      - sort
      - filters
    slot_usage:
      limit:
        ifabsent: int(50)
      offset:
        ifabsent: int(0)
  Condition:
    title: Condition
    description: >-
      An equality filter of a listing resolved against the slots of the listed type: the aggregate
      has this statement. The value is an IRI when it is a reference, else a literal of the datatype.
    class_uri: rp:Condition
    slots:
      - condition_predicate
      - condition_value
      - condition_datatype
      - condition_reference
    slot_usage:
      condition_predicate:
        required: true
      condition_value:
        required: true
      condition_reference:
        ifabsent: "false"
  ListPlan:
    title: List plan
    description: >-
      A listing resolved against the slots of the listed type: the class, the typed conditions, the
      predicate to order by (none orders by IRI), the page, and the graphs of the aggregates the
      caller may not read.
    class_uri: rp:ListPlan
    slots:
      - plan_class
      - conditions
      - plan_sort
      - descending
      - limit
      - offset
      - hidden_graphs
    slot_usage:
      plan_class:
        required: true
      descending:
        ifabsent: "false"
      limit:
        required: true
      offset:
        required: true
  Problem:
    title: Problem
    description: An RFC 9457 problem detail, the body of every error answer of the service.
    class_uri: rp:Problem
    slots:
      - problem_type
      - problem_title
      - problem_status
      - problem_detail
      - problem_instance
    slot_usage:
      problem_type:
        required: true
      problem_title:
        required: true
      problem_status:
        required: true

  ProblemKind:
    title: Problem kind
    description: >-
      A kind of problem the service answers with: the slug that ends its problem type IRI, its fixed
      title and the HTTP status it comes with.
    class_uri: rp:ProblemKind
    slots:
      - problem_slug
      - problem_title
      - problem_status
    slot_usage:
      problem_slug:
        required: true
      problem_title:
        required: true
      problem_status:
        required: true

  AccountSummary:
    title: Account summary
    description: >-
      What the identity port reports about one account of the identity provider: its id, its login
      name, its email (a service account has none), whether it may sign in, and its global roles.
    class_uri: rp:AccountSummary
    slots:
      - account_id
      - user_name
      - email
      - active
      - global_roles
    slot_usage:
      account_id:
        required: true
      user_name:
        required: true
      active:
        required: true
  Referrer:
    title: Referrer
    description: >-
      One aggregate that points at another: its IRI, its schema class and the slot that holds the
      reference.
    class_uri: rp:Referrer
    slots:
      - referrer
      - referrer_class
      - referrer_slot
    slot_usage:
      referrer:
        required: true
      referrer_class:
        required: true
      referrer_slot:
        required: true
  ReferrerList:
    title: Referrer list
    description: >-
      The aggregates that point at one resource and that the caller may read, and the number of
      referrers left out because the caller may not read them.
    class_uri: rp:ReferrerList
    slots:
      - referrers
      - hidden_count
    slot_usage:
      referrers:
        inlined_as_list: true
      hidden_count:
        required: true
  MemberList:
    title: Member list
    description: >-
      The members of a collection that the caller may read, and the number of members left out because
      the caller may not read them.
    class_uri: rp:MemberList
    slots:
      - member_iris
      - hidden_count
    slot_usage:
      hidden_count:
        required: true
  AggregateHead:
    title: Aggregate head
    description: The IRI, the types and the version token of one stored aggregate, without its content.
    class_uri: rp:AggregateHead
    slots:
      - head_iri
      - head_types
      - head_version

  MigrationStep:
    title: Migration step
    description: >-
      One step of a migration: three group graph patterns, as text, that the toolkit wraps into one
      update request over the graphs of a database. A step with `unresolved` is a draft and does not
      load.
    class_uri: rp:MigrationStep
    slots:
      - title
      - where_pattern
      - delete_pattern
      - insert_pattern
      - unresolved
    slot_usage:
      title:
        required: true

  Migration:
    title: Migration
    description: >-
      The reviewed file that moves the data of a database from one version of a schema to the next:
      the schema's id, the two versions and the steps, in order.
    class_uri: rp:Migration
    slots:
      - schema_id
      - from_version
      - to_version
      - description
      - steps
    slot_usage:
      schema_id:
        required: true
        description: The id of the schema whose data the migration moves.
      from_version:
        required: true
      to_version:
        required: true

  EventEnvelope:
    title: Event envelope
    description: >-
      What travels beside an activity on the event bus: the tenant it happened in, the deployment that
      published it, the class of its body and where to find the JSON-LD context that reads it.
    class_uri: rp:EventEnvelope
    slots:
      - tenant
      - origin
      - activity_class
      - context
    slot_usage:
      tenant:
        required: true
        description: The IRI of the tenant, or of the application, the activity happened in.
      origin:
        required: true
      activity_class:
        required: true
      context:
        required: true

slots:
  title:
    title: Title
    description: A short name for what a record describes.
    slot_uri: rp:title
    range: string
  where_pattern:
    title: Where pattern
    description: The group graph pattern, as text, that selects what a migration step changes.
    slot_uri: rp:wherePattern
    range: string
  delete_pattern:
    title: Delete pattern
    description: The group graph pattern, as text, of the triples a migration step removes.
    slot_uri: rp:deletePattern
    range: string
  insert_pattern:
    title: Insert pattern
    description: The group graph pattern, as text, of the triples a migration step adds.
    slot_uri: rp:insertPattern
    range: string
  unresolved:
    title: Unresolved
    description: Text saying what a draft step still needs from the developer; a step that has it does not load.
    slot_uri: rp:unresolved
    range: string
  from_version:
    title: From version
    description: The version of the schema that the data follows before the migration.
    slot_uri: rp:fromVersion
    range: string
  to_version:
    title: To version
    description: The version of the schema that the data follows after the migration.
    slot_uri: rp:toVersion
    range: string
  steps:
    title: Steps
    description: The steps of a migration, in the order they run.
    slot_uri: rp:migrationSteps
    range: MigrationStep
    multivalued: true
    inlined_as_list: true
  allowed_actions:
    title: Allowed actions
    description: >-
      The actions the caller who asked may take on the tenant, in the order read, modify, delete,
      administer. Only a listing fills it.
    slot_uri: rp:allowedActions
    range: Action
    multivalued: true
  origin:
    title: Origin
    description: The deployment that published the message, as its `deployment` setting names it.
    slot_uri: rp:origin
    range: string
  activity_class:
    title: Activity class
    description: The IRI of the class of the activity the message carries.
    slot_uri: rp:activityClass
    range: uri
  context:
    title: Context
    description: A link to the JSON-LD context that reads the message body.
    slot_uri: rp:contextLink
    range: string
  format_version:
    title: Format version
    description: The version of the dump archive layout; a restore refuses a version it does not know.
    slot_uri: rp:dumpFormatVersion
    range: integer
  dump_created_at:
    title: Dump created at
    description: When the dump was taken, so a person choosing among dumps can tell them apart.
    slot_uri: rp:dumpCreatedAt
    alias: created_at
    range: datetime
  toolkit_version:
    title: Toolkit version
    description: The version of the toolkit that wrote the dump.
    slot_uri: rp:toolkitVersion
    range: string
  schema_id:
    title: Schema id
    description: The id of the LinkML schema whose stored data a dump manifest or a migration is about.
    slot_uri: rp:schemaId
    range: uri
  schema_version:
    title: Schema version
    description: The version of that schema, when it declares one.
    slot_uri: rp:dumpSchemaVersion
    range: string
  source_tenant:
    title: Source tenant
    description: The IRI of the tenant the dump was taken from.
    slot_uri: rp:sourceTenant
    range: uri
  source_tenant_id:
    title: Source tenant id
    description: The id part of the source tenant's IRI, which a restore replaces by the new tenant's id.
    slot_uri: rp:sourceTenantId
    range: string
  caller_access:
    title: Caller access
    description: The caller's access to the tenant, as the access check loaded it.
    slot_uri: rp:callerAccess
    range: CallerAccess
  checked_target:
    title: Checked target
    description: The IRI of the tenant or aggregate the access check was made on, which the route acts on.
    slot_uri: rp:checkedTarget
    range: uri
  principal:
    title: Principal
    description: The user account the token identifies.
    slot_uri: rp:principal
    range: Principal
  global_roles:
    title: Global roles
    description: The system-level roles the token grants the principal.
    slot_uri: rp:globalRole
    range: string
    multivalued: true
  root:
    title: Root
    description: The slots of the tenant's root object, as the application's schema defines them.
    slot_uri: rp:root
    range: Any
  items:
    title: Items
    description: The objects of the page; framed aggregates, or tenant summaries.
    slot_uri: rp:items
    range: Any
    multivalued: true
  total:
    title: Total
    description: The number of objects in the whole listing.
    slot_uri: rp:total
    range: integer
    minimum_value: 0
  limit:
    title: Limit
    description: The most objects the page can hold.
    slot_uri: rp:limit
    range: integer
    minimum_value: 1
    maximum_value: 200
  offset:
    title: Offset
    description: The position of the page's first object in the whole listing.
    slot_uri: rp:offset
    range: integer
    minimum_value: 0
  sort:
    title: Sort
    description: >-
      The slot a listing is ordered by, ascending, or descending when its name starts with a minus
      sign; absent, the listing is ordered by IRI.
    slot_uri: rp:sort
    range: string
  filters:
    title: Filters
    description: The equality filters of a listing; all of them must hold.
    slot_uri: rp:filter
    range: Filter
    multivalued: true
    inlined_as_list: true
  condition_predicate:
    title: Condition predicate
    description: The IRI of the predicate the aggregate must have a statement with.
    slot_uri: rp:conditionPredicate
    alias: predicate
    range: uri
  condition_value:
    title: Condition value
    description: The value of the statement, an IRI or the lexical form of a literal.
    slot_uri: rp:conditionValue
    alias: value
    range: string
  condition_datatype:
    title: Condition datatype
    description: The IRI of the datatype of a literal value; absent for a plain string.
    slot_uri: rp:conditionDatatype
    alias: datatype
    range: uri
  condition_reference:
    title: Condition reference
    description: Whether the value is an IRI rather than a literal.
    slot_uri: rp:conditionReference
    alias: reference
    range: boolean
  plan_class:
    title: Plan class
    description: The IRI of the class of the aggregates listed.
    slot_uri: rp:planClass
    alias: target
    range: uri
  conditions:
    title: Conditions
    description: The equality conditions of a listing; all of them must hold.
    slot_uri: rp:condition
    range: Condition
    multivalued: true
    inlined_as_list: true
  plan_sort:
    title: Plan sort
    description: The IRI of the predicate a listing is ordered by; absent, it is ordered by IRI.
    slot_uri: rp:planSort
    alias: sort_by
    range: uri
  descending:
    title: Descending
    description: Whether the order is reversed.
    slot_uri: rp:descending
    range: boolean
  hidden_graphs:
    title: Hidden graphs
    description: The IRIs of the graphs of the aggregates a listing leaves out.
    slot_uri: rp:hiddenGraph
    range: uri
    multivalued: true
  referrer:
    title: Referrer
    description: The IRI of the aggregate that holds the reference.
    slot_uri: rp:referrer
    range: uri
  referrer_class:
    title: Referrer class
    description: >-
      The name of the schema class of the aggregate that holds the reference; its IRI when the
      schema does not know the class.
    slot_uri: rp:referrerClass
    range: string
  referrer_slot:
    title: Referrer slot
    description: >-
      The name of the slot that holds the reference; its IRI when the schema does not know the
      slot.
    slot_uri: rp:referrerSlot
    range: string
  referrers:
    title: Referrers
    description: The aggregates that point at the resource, ordered by IRI and slot.
    slot_uri: rp:referrers
    range: Referrer
    multivalued: true
  hidden_count:
    title: Hidden count
    description: The number of referrers or members the caller may not read, so are not listed.
    slot_uri: rp:hiddenCount
    range: integer
    minimum_value: 0
  member_iris:
    title: Member IRIs
    description: The IRIs of the members of a collection.
    slot_uri: rp:memberIri
    range: uri
    multivalued: true
  head_iri:
    title: Head IRI
    description: The IRI of the stored aggregate.
    slot_uri: rp:headIri
    range: uri
  head_types:
    title: Head types
    description: The class IRIs the stored aggregate is typed with.
    slot_uri: rp:headType
    range: uri
    multivalued: true
  head_version:
    title: Head version
    description: The version token of the stored aggregate's graph.
    slot_uri: rp:headVersion
    range: string
  filter_slot:
    title: Filter slot
    description: The name of the slot the filter is on.
    slot_uri: rp:filterSlot
    alias: slot
    range: string
  filter_value:
    title: Filter value
    description: The value the slot must have, as text.
    slot_uri: rp:filterValue
    alias: value
    range: string
  problem_type:
    title: Problem type
    description: The IRI that identifies the kind of problem.
    slot_uri: rp:problemType
    alias: type
    range: uri
  problem_slug:
    title: Problem slug
    description: The last segment of the problem type IRI, lower case words joined by hyphens.
    slot_uri: rp:problemSlug
    alias: slug
    range: string
    pattern: "^[a-z]+(?:-[a-z]+)*$"
  problem_title:
    title: Problem title
    description: A short, fixed summary of the kind of problem.
    slot_uri: rp:problemTitle
    alias: title
    range: string
  problem_status:
    title: Problem status
    description: The HTTP status code of the answer.
    slot_uri: rp:problemStatus
    alias: status
    range: integer
  problem_detail:
    title: Problem detail
    description: An explanation of this occurrence of the problem.
    slot_uri: rp:problemDetail
    alias: detail
    range: string
  problem_instance:
    title: Problem instance
    description: The IRI that identifies this occurrence of the problem.
    slot_uri: rp:problemInstance
    alias: instance
    range: uri
  account_id:
    title: Account id
    description: The identity provider's id of the account.
    slot_uri: rp:accountId
    range: string
    pattern: "^.+$"
  user_name:
    title: User name
    description: The name the account signs in with.
    slot_uri: rp:userName
    range: string
  email:
    title: Email
    description: The email address of a person's account.
    slot_uri: rp:email
    range: string
  active:
    title: Active
    description: Whether the account may sign in; a disabled account is refused new tokens.
    slot_uri: rp:accountActive
    range: boolean

enums:
  ProblemSlug:
    title: Problem slug
    description: >-
      The kinds of problem the toolkit answers with, by the last segment of their problem type IRI, with the underscores written as hyphens.
    permissible_values:
      invalid_token:
        title: Invalid token
        meaning: rp:invalidToken
        description: No bearer token, or one the service refuses.
      forbidden:
        title: Forbidden
        meaning: rp:forbidden
        description: The caller may see the thing but is not allowed the action.
      not_found:
        title: Not found
        meaning: rp:notFound
        description: There is no such thing, or the caller cannot see it.
      conflict:
        title: Version conflict
        meaning: rp:conflict
        description: The write lost a race, or the thing to create already exists.
      key_conflict:
        title: Key conflict
        meaning: rp:keyConflict
        description: The write would give an aggregate a key value that another aggregate of its class holds.
      precondition_required:
        title: Precondition required
        meaning: rp:preconditionRequired
        description: An update or a delete came without the version it expects.
      invalid_body:
        title: Invalid body
        meaning: rp:invalidBody
        description: The body is not a valid representation for its route.
      not_acceptable:
        title: Not acceptable
        meaning: rp:notAcceptable
        description: The service produces nothing the client accepts.
      unsupported_media_type:
        title: Unsupported media type
        meaning: rp:unsupportedMediaType
        description: The route does not take the media type of the body.
      bad_query:
        title: Bad query
        meaning: rp:badQuery
        description: The query string is not one the route takes.
      unavailable:
        title: Service unavailable
        meaning: rp:unavailable
        description: A store, the identity provider or the role definitions are not usable.
      tenant_behind:
        title: Tenant behind its schema
        meaning: rp:tenantBehind
        description: The tenant's data follows an older schema version than the service runs; it is not served until migrated.
      payload_too_large:
        title: Payload too large
        meaning: rp:payloadTooLarge
        description: The body is larger than the service takes.
      method_not_allowed:
        title: Method not allowed
        meaning: rp:methodNotAllowed
        description: The route has no such method.
      internal_error:
        title: Internal error
        meaning: rp:internalError
        description: The service failed; the answer says no more.
