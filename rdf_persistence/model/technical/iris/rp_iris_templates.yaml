id: https://meaningfy.ws/ns/rdf-persistence/iris-templates
name: rp_iris_templates
title: RDF persistence iris templates module
description: >-
  The plain-string records of the IRI policy's templates, in the `iris` theme: the template variables
  that every IRI template writes in as plain text, and the parts of an IRI a template matched. They are
  plain strings, not the IRI, slug and path segment that the settings' slots of the same names hold
  (`rp_iris_services`). Nothing here is served by the HTTP service, so the toolkit's OpenAPI document and
  TypeScript types do not carry them; that is why they are a schema of their own and not part of
  `rp_iris_services` (technical-models PD-5; thematic-structure PD-2, PD-10).
prefixes:
  rp: https://meaningfy.ws/ns/rdf-persistence#
  linkml: https://w3id.org/linkml/
default_prefix: rp
default_range: string
imports:
  - linkml:types
annotations:
  module_kind: technical
  python_package: rdf_persistence.iris.services.generated.templates

slots:
  base:
    title: Base
    description: The base IRI of the service, as the settings give it.
    range: string
    required: true
  deployment:
    title: Deployment
    description: The deployment segment of the IRIs; empty when the settings give none.
    range: string
    required: true
  tenant_segment:
    title: Tenant segment
    description: The path segment that holds the tenants, as the settings give it.
    range: string
    required: true
  tenant:
    title: Tenant
    description: The tenant IRI a pattern matched.
    range: string
  tenant_id:
    title: Tenant id
    description: The id of the tenant a pattern matched.
    range: string
  id:
    title: Object id
    description: The id of the aggregate or part a pattern matched.
    range: string
  type:
    title: Type
    description: The class type a pattern matched.
    range: string
  rp_path:
    title: Path segment
    description: The path segment of the aggregate's class a pattern matched.
    range: string
  root:
    title: Root
    description: The root IRI a pattern matched.
    range: string

classes:
  IriTemplateVariables:
    title: IRI template variables
    description: >-
      The settings' values that every IRI template writes in as plain text: the base, the deployment
      (empty when there is none) and the tenant segment. A mapping of them goes to `str.format` and to
      the pattern compiler, which take a mapping (technical-models PD-5).
    class_uri: rp:IriTemplateVariables
    slots:
      - base
      - deployment
      - tenant_segment
  IriParts:
    title: IRI parts
    description: >-
      The named groups of an IRI template's match. A group the model does not name is refused: it
      would be a pattern that the toolkit builds and no reader reads.
    class_uri: rp:IriParts
    slots:
      - tenant
      - tenant_id
      - id
      - type
      - rp_path
      - root
