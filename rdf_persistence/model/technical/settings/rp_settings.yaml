id: https://meaningfy.ws/ns/rdf-persistence/settings
name: rp_settings
title: RDF persistence settings module
description: >-
  The deployment and tuning values of the toolkit, grouped by area and held together by
  `ToolkitSettings`: HTTP timeouts and attempts, the JWKS cache, the directory page size, the event
  bus, the relay and the hub, server-sent events and the size limits. Every slot defaults to the value
  the toolkit used before it had settings, so a consumer that sets none gets the same behaviour. A
  consumer's composition root builds the groups (by hand or with `settings_from_env`) and hands each
  to the adapter or service that uses it. Nothing here is served by the HTTP service
  (technical-models PD-6, DEC-5).
prefixes:
  rp: https://meaningfy.ws/ns/rdf-persistence#
  linkml: https://w3id.org/linkml/
default_prefix: rp
default_range: string
imports:
  - linkml:types
  - ../core/rp_core_services
  - ../persistence/rp_persistence_settings
  - ../access/rp_access_settings
  - ../events/rp_events_settings
annotations:
  module_kind: technical
  python_package: rdf_persistence.services.generated.settings

classes:
  SseSettings:
    title: Server-sent events settings
    description: The lifetime, the access check, the keep-alive and the resume window of the events route.
    slots:
      - max_lifetime_seconds
      - access_ttl_seconds
      - keep_alive_seconds
      - resume_window_seconds
  ToolkitSettings:
    title: Toolkit settings
    description: >-
      Every group of settings; each group is a new instance of its class with its own defaults, never
      absent.
    slots:
      - http
      - jwks
      - directory
      - events
      - sse
      - limits

slots:
  max_lifetime_seconds:
    title: Maximum lifetime
    description: The seconds an events connection stays open before the client must reconnect.
    range: float
    required: true
    ifabsent: float(300.0)
    minimum_value: 0.001
    maximum_value: 31536000
  access_ttl_seconds:
    title: Access check lifetime
    description: The seconds the result of an access check is kept.
    range: float
    required: true
    ifabsent: float(1.0)
    minimum_value: 0.001
    maximum_value: 31536000
  keep_alive_seconds:
    title: Keep-alive interval
    description: The seconds of silence after which the events route sends a comment line.
    range: float
    required: true
    ifabsent: float(15.0)
    minimum_value: 0.001
    maximum_value: 31536000
  resume_window_seconds:
    title: Resume window
    description: The seconds back from now a client may resume from with its last event id.
    range: float
    required: true
    ifabsent: float(604800)
    minimum_value: 0.001
    maximum_value: 31536000
  http:
    title: HTTP
    description: The HTTP client settings.
    range: HttpSettings
    annotations:
      default_instance: 'true'
  jwks:
    title: JWKS
    description: The key cache and signature settings of the token verifier.
    range: JwksSettings
    annotations:
      default_instance: 'true'
  directory:
    title: Directory
    description: The user directory settings.
    range: DirectorySettings
    annotations:
      default_instance: 'true'
  events:
    title: Events
    description: The event bus, relay and hub settings.
    range: EventSettings
    annotations:
      default_instance: 'true'
  sse:
    title: Server-sent events
    description: The settings of the events route.
    range: SseSettings
    annotations:
      default_instance: 'true'
  limits:
    title: Limits
    description: The size and count limits.
    range: LimitSettings
    annotations:
      default_instance: 'true'
