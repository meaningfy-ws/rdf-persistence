id: https://meaningfy.ws/ns/rdf-persistence/service
name: rp_service
title: RDF persistence service module
description: >-
  The toolkit's own data types for the HTTP service: the settings of `install_service`, the caller a
  token verifier returns, and the request and response bodies of the tenant routes. They are generated
  into their own package, so an application's models do not carry them.
prefixes:
  rp: https://meaningfy.ws/ns/rdf-persistence#
  linkml: https://w3id.org/linkml/
default_prefix: rp
default_range: string
imports:
  - linkml:types
  - rdf_persistence/model/rp_core
  - rdf_persistence/model/rp_access
  - rdf_persistence/model/rp_tenancy
annotations:
  module_kind: technical

classes:
  Any:
    title: Any
    description: Any value; the slots that range over it hold data the toolkit does not model.
    class_uri: linkml:Any
  ServiceSettings:
    title: Service settings
    description: >-
      The settings of `install_service`: where the service is mounted, how it names tenants and which
      role its callers get on a tenant they create.
    class_uri: rp:ServiceSettings
    slots:
      - base
      - prefix
      - tenant_segment
      - creator_role
      - roles_claim
      - max_body_bytes
      - deployment
      - iri_policy
    slot_usage:
      max_body_bytes:
        ifabsent: int(1048576)
      base:
        required: true
      prefix:
        required: true
      tenant_segment:
        required: true
      creator_role:
        required: true
      roles_claim:
        required: true
  IdSpec:
    title: Id specification
    description: >-
      How the toolkit draws an id: a UUIDv4, or `length` characters drawn from `alphabet`. The length
      is required for `random` ids.
    class_uri: rp:IdSpec
    slots:
      - id_kind
      - id_length
      - id_alphabet
    slot_usage:
      id_kind:
        required: true
      id_alphabet:
        ifabsent: string(0123456789abcdefghijklmnopqrstuvwxyz)
  IriPolicy:
    title: IRI policy
    description: >-
      The templates the toolkit mints and accepts IRIs by, one per kind of IRI, and the id
      specifications of tenant and object ids. Every slot defaults to today's shape, so an empty
      policy is the default one. A template fills the variables allowed for its kind; the tenant,
      aggregate, part, loaded graph and principal templates end in their id variable, the access,
      meta and registry templates contain the tenant, and the aggregate, part and loaded graph
      templates name their tenant or, for the last two, their root.
    class_uri: rp:IriPolicy
    slots:
      - tenant_template
      - access_template
      - meta_template
      - registry_template
      - aggregate_template
      - part_template
      - loaded_graph_template
      - principal_template
      - tenant_id
      - object_id
    slot_usage:
      tenant_template:
        ifabsent: string({base}{tenant_segment}/{tenant_id})
      access_template:
        ifabsent: string({tenant}/access)
      meta_template:
        ifabsent: string({tenant}/meta)
      registry_template:
        ifabsent: string({tenant}/registry)
      aggregate_template:
        ifabsent: string({tenant}/{rp_path}/{id})
      part_template:
        ifabsent: string({root}/parts/{id})
      loaded_graph_template:
        ifabsent: string({root}/content/{id})
      principal_template:
        ifabsent: string({issuer}/users/{sub})
  VerifiedCaller:
    title: Verified caller
    description: >-
      What a token verifier returns for a valid token, the principal and its global roles.
    class_uri: rp:VerifiedCaller
    slots:
      - principal
      - global_roles
    slot_usage:
      principal:
        required: true
  TenantCreate:
    title: Tenant create
    description: The body that creates a tenant, its label and the slots of the tenant's root object.
    class_uri: rp:TenantCreate
    mixins:
      - TenantLabelled
    slots:
      - root
    slot_usage:
      root:
        required: true
  TenantSummary:
    title: Tenant summary
    description: What the service answers about one tenant, in a listing or after creating it.
    class_uri: rp:TenantSummary
    slots:
      - id
      - label
      - state
      - allowed_actions
    slot_usage:
      id:
        required: true
      label:
        required: true
      state:
        required: true
  LabelUpdate:
    title: Label update
    description: The body that replaces the label of a tenant.
    class_uri: rp:LabelUpdate
    mixins:
      - TenantLabelled
  GrantSet:
    title: Grant set
    description: >-
      The body that replaces the grants and prohibitions of a tenant; two grants with the same
      assignee, target and role or action are refused.
    class_uri: rp:GrantSet
    slots:
      - grants
      - prohibitions
  CallerAccess:
    title: Caller access
    description: >-
      What the access check needs to know about one caller in one tenant: the tenant's state, and the
      grants and prohibitions of the access record that name the caller.
    class_uri: rp:CallerAccess
    slots:
      - tenant
      - state
      - grants
      - prohibitions
    slot_usage:
      tenant:
        required: true
      state:
        required: true
  Authorised:
    title: Authorised
    description: >-
      What a route's access check settled: the caller's principal, its access to the tenant, and the
      IRI of the tenant or aggregate it was checked on, which the route then acts on.
    class_uri: rp:Authorised
    slots:
      - principal
      - caller_access
      - checked_target
    slot_usage:
      principal:
        required: true
      caller_access:
        required: true
      checked_target:
        required: true
  Page:
    title: Page
    description: One page of a listing, with the position of the page in the whole listing.
    class_uri: rp:Page
    slots:
      - items
      - total
      - limit
      - offset
    slot_usage:
      items:
        required: true
      total:
        required: true
      limit:
        required: true
      offset:
        required: true
  Filter:
    title: Filter
    description: >-
      One equality filter of a listing, the name of a slot of the listed type and the value it must
      have, as the text the caller sent.
    class_uri: rp:Filter
    slots:
      - filter_slot
      - filter_value
    slot_usage:
      filter_slot:
        required: true
      filter_value:
        required: true
  ListRequest:
    title: List request
    description: >-
      The query of a listing, as the caller sent it: the equality filters, the position and size of
      the page and the key to sort by.
    class_uri: rp:ListRequest
    slots:
      - limit
      - offset
      - sort
      - filters
    slot_usage:
      limit:
        ifabsent: int(50)
      offset:
        ifabsent: int(0)
  Condition:
    title: Condition
    description: >-
      An equality filter of a listing resolved against the slots of the listed type: the aggregate
      has this statement. The value is an IRI when it is a reference, else a literal of the datatype.
    class_uri: rp:Condition
    slots:
      - condition_predicate
      - condition_value
      - condition_datatype
      - condition_reference
    slot_usage:
      condition_predicate:
        required: true
      condition_value:
        required: true
      condition_reference:
        ifabsent: "false"
  ListPlan:
    title: List plan
    description: >-
      A listing resolved against the slots of the listed type: the class, the typed conditions, the
      predicate to order by (none orders by IRI), the page, and the graphs of the aggregates the
      caller may not read.
    class_uri: rp:ListPlan
    slots:
      - plan_class
      - conditions
      - plan_sort
      - descending
      - limit
      - offset
      - hidden_graphs
    slot_usage:
      plan_class:
        required: true
      descending:
        ifabsent: "false"
      limit:
        required: true
      offset:
        required: true
  Problem:
    title: Problem
    description: An RFC 9457 problem detail, the body of every error answer of the service.
    class_uri: rp:Problem
    slots:
      - problem_type
      - problem_title
      - problem_status
      - problem_detail
      - problem_instance
    slot_usage:
      problem_type:
        required: true
      problem_title:
        required: true
      problem_status:
        required: true

  ProblemKind:
    title: Problem kind
    description: >-
      A kind of problem the service answers with: the slug that ends its problem type IRI, its fixed
      title and the HTTP status it comes with.
    class_uri: rp:ProblemKind
    slots:
      - problem_slug
      - problem_title
      - problem_status
    slot_usage:
      problem_slug:
        required: true
      problem_title:
        required: true
      problem_status:
        required: true

  AccountSummary:
    title: Account summary
    description: >-
      What the identity port reports about one account of the identity provider: its id, its login
      name, its email (a service account has none), whether it may sign in, and its global roles.
    class_uri: rp:AccountSummary
    slots:
      - account_id
      - user_name
      - email
      - active
      - global_roles
    slot_usage:
      account_id:
        required: true
      user_name:
        required: true
      active:
        required: true

slots:
  base:
    title: Base
    description: The IRI under which the service mints identifiers and problem types, ending in a slash.
    slot_uri: rp:base
    range: uri
    pattern: "^https?://.+/$"
  prefix:
    title: Prefix
    description: >-
      The prefix of the database names of the service's tenants; lower case, at most 20 characters.
    slot_uri: rp:prefix
    range: string
    pattern: "^[a-z][a-z0-9]{0,19}$"
  tenant_segment:
    is_a: url_segment
    title: Tenant segment
    description: The path segment that names the tenant collection in the service's routes.
    slot_uri: rp:tenantSegment
    range: string
  creator_role:
    title: Creator role
    description: The role a caller is given on the tenant it creates.
    slot_uri: rp:creatorRole
    range: string
    pattern: "^.+$"
  roles_claim:
    title: Roles claim
    description: >-
      The claim of the token that holds the caller's global roles, an object keyed by role name; for
      Zitadel, urn:zitadel:iam:org:project:{project_id}:roles of the consumer's project.
    slot_uri: rp:rolesClaim
    range: string
    pattern: "^.+$"
  tenant:
    title: Tenant
    description: The IRI of the tenant.
    slot_uri: rp:tenant
    range: uri
  max_body_bytes:
    title: Maximum body size
    description: >-
      The most bytes a request body may hold; a larger one is refused with 413 before it is read
      whole.
    slot_uri: rp:maxBodyBytes
    range: integer
    minimum_value: 1
  tenant_template:
    title: Tenant template
    description: The template of a tenant IRI; ends in `{tenant_id}`.
    slot_uri: rp:tenantTemplate
    range: string
    pattern: '^(?:[a-z0-9/:.-]|\{(?:base|deployment|tenant_segment|tenant_id)\})*\{tenant_id\}$'
  access_template:
    title: Access template
    description: The template of the IRI of a tenant's access record; contains `{tenant}` or `{tenant_id}`.
    slot_uri: rp:accessTemplate
    range: string
    pattern: '^(?:[a-z0-9/:.-]|\{(?:base|deployment|tenant|tenant_id)\})*\{tenant(?:_id)?\}(?:[a-z0-9/:.-]|\{(?:base|deployment|tenant|tenant_id)\})*$'
  meta_template:
    title: Meta template
    description: The template of the IRI of a tenant's meta graph; contains `{tenant}` or `{tenant_id}`.
    slot_uri: rp:metaTemplate
    range: string
    pattern: '^(?:[a-z0-9/:.-]|\{(?:base|deployment|tenant|tenant_id)\})*\{tenant(?:_id)?\}(?:[a-z0-9/:.-]|\{(?:base|deployment|tenant|tenant_id)\})*$'
  registry_template:
    title: Registry template
    description: The template of the IRI of a tenant's registry graph; contains `{tenant}` or `{tenant_id}`.
    slot_uri: rp:registryTemplate
    range: string
    pattern: '^(?:[a-z0-9/:.-]|\{(?:base|deployment|tenant|tenant_id)\})*\{tenant(?:_id)?\}(?:[a-z0-9/:.-]|\{(?:base|deployment|tenant|tenant_id)\})*$'
  aggregate_template:
    title: Aggregate template
    description: The template of an aggregate root IRI; contains `{tenant}` or `{tenant_id}` and ends in `{id}`.
    slot_uri: rp:aggregateTemplate
    range: string
    pattern: '^(?:[a-z0-9/:.-]|\{(?:base|deployment|tenant|tenant_id|type|rp_path|id)\})*\{tenant(?:_id)?\}(?:[a-z0-9/:.-]|\{(?:base|deployment|tenant|tenant_id|type|rp_path|id)\})*\{id\}$'
  part_template:
    title: Part template
    description: The template of the IRI of an owned part; contains `{tenant}`, `{tenant_id}` or `{root}` and ends in `{id}`.
    slot_uri: rp:partTemplate
    range: string
    pattern: '^(?:[a-z0-9/:.-]|\{(?:base|deployment|tenant|tenant_id|root|type|id)\})*\{(?:tenant|tenant_id|root)\}(?:[a-z0-9/:.-]|\{(?:base|deployment|tenant|tenant_id|root|type|id)\})*\{id\}$'
  loaded_graph_template:
    title: Loaded graph template
    description: The template of the IRI of a loaded graph; contains `{tenant}`, `{tenant_id}` or `{root}` and ends in `{id}`.
    slot_uri: rp:loadedGraphTemplate
    range: string
    pattern: '^(?:[a-z0-9/:.-]|\{(?:base|deployment|tenant|tenant_id|root|type|id)\})*\{(?:tenant|tenant_id|root)\}(?:[a-z0-9/:.-]|\{(?:base|deployment|tenant|tenant_id|root|type|id)\})*\{id\}$'
  principal_template:
    title: Principal template
    description: The template of the IRI of a principal; ends in `{sub}`.
    slot_uri: rp:principalTemplate
    range: string
    pattern: '^(?:[a-z0-9/:.-]|\{(?:base|deployment|issuer|sub)\})*\{sub\}$'
  tenant_id:
    title: Tenant id
    description: How the id of a new tenant is drawn; absent, a UUIDv4.
    slot_uri: rp:tenantId
    range: IdSpec
  object_id:
    title: Object id
    description: How the id of a new aggregate root, part or loaded graph is drawn; absent, a UUIDv4.
    slot_uri: rp:objectId
    range: IdSpec
  id_kind:
    title: Id kind
    description: Whether ids are UUIDv4 or random characters of an alphabet.
    slot_uri: rp:idKind
    alias: kind
    range: IdKind
  id_length:
    title: Id length
    description: The number of characters of a random id, 4 to 32.
    slot_uri: rp:idLength
    alias: length
    range: integer
    minimum_value: 4
    maximum_value: 32
  id_alphabet:
    title: Id alphabet
    description: The characters a random id is drawn from, each a lower case letter or a digit.
    slot_uri: rp:idAlphabet
    alias: alphabet
    range: string
    pattern: "^[a-z0-9]+$"
  allowed_actions:
    title: Allowed actions
    description: >-
      The actions the caller who asked may take on the tenant, in the order read, modify, delete,
      administer. Only a listing fills it.
    slot_uri: rp:allowedActions
    range: Action
    multivalued: true
  deployment:
    title: Deployment
    description: >-
      A slug that names this deployment, for templates that use `{deployment}`; lower case letters and
      digits, at most 32.
    slot_uri: rp:deployment
    range: string
    pattern: "^[a-z0-9]{1,32}$"
  iri_policy:
    title: IRI policy
    description: The IRI policy of the service; absent, the default policy applies.
    slot_uri: rp:iriPolicy
    range: IriPolicy
  caller_access:
    title: Caller access
    description: The caller's access to the tenant, as the access check loaded it.
    slot_uri: rp:callerAccess
    range: CallerAccess
  checked_target:
    title: Checked target
    description: The IRI of the tenant or aggregate the access check was made on, which the route acts on.
    slot_uri: rp:checkedTarget
    range: uri
  principal:
    title: Principal
    description: The user account the token identifies.
    slot_uri: rp:principal
    range: Principal
  global_roles:
    title: Global roles
    description: The system-level roles the token grants the principal.
    slot_uri: rp:globalRole
    range: string
    multivalued: true
  root:
    title: Root
    description: The slots of the tenant's root object, as the application's schema defines them.
    slot_uri: rp:root
    range: Any
  items:
    title: Items
    description: The objects of the page; framed aggregates, or tenant summaries.
    slot_uri: rp:items
    range: Any
    multivalued: true
  total:
    title: Total
    description: The number of objects in the whole listing.
    slot_uri: rp:total
    range: integer
    minimum_value: 0
  limit:
    title: Limit
    description: The most objects the page can hold.
    slot_uri: rp:limit
    range: integer
    minimum_value: 1
    maximum_value: 200
  offset:
    title: Offset
    description: The position of the page's first object in the whole listing.
    slot_uri: rp:offset
    range: integer
    minimum_value: 0
  sort:
    title: Sort
    description: >-
      The slot a listing is ordered by, ascending, or descending when its name starts with a minus
      sign; absent, the listing is ordered by IRI.
    slot_uri: rp:sort
    range: string
  filters:
    title: Filters
    description: The equality filters of a listing; all of them must hold.
    slot_uri: rp:filter
    range: Filter
    multivalued: true
    inlined_as_list: true
  condition_predicate:
    title: Condition predicate
    description: The IRI of the predicate the aggregate must have a statement with.
    slot_uri: rp:conditionPredicate
    alias: predicate
    range: uri
  condition_value:
    title: Condition value
    description: The value of the statement, an IRI or the lexical form of a literal.
    slot_uri: rp:conditionValue
    alias: value
    range: string
  condition_datatype:
    title: Condition datatype
    description: The IRI of the datatype of a literal value; absent for a plain string.
    slot_uri: rp:conditionDatatype
    alias: datatype
    range: uri
  condition_reference:
    title: Condition reference
    description: Whether the value is an IRI rather than a literal.
    slot_uri: rp:conditionReference
    alias: reference
    range: boolean
  plan_class:
    title: Plan class
    description: The IRI of the class of the aggregates listed.
    slot_uri: rp:planClass
    alias: target
    range: uri
  conditions:
    title: Conditions
    description: The equality conditions of a listing; all of them must hold.
    slot_uri: rp:condition
    range: Condition
    multivalued: true
    inlined_as_list: true
  plan_sort:
    title: Plan sort
    description: The IRI of the predicate a listing is ordered by; absent, it is ordered by IRI.
    slot_uri: rp:planSort
    alias: sort_by
    range: uri
  descending:
    title: Descending
    description: Whether the order is reversed.
    slot_uri: rp:descending
    range: boolean
  hidden_graphs:
    title: Hidden graphs
    description: The IRIs of the graphs of the aggregates a listing leaves out.
    slot_uri: rp:hiddenGraph
    range: uri
    multivalued: true
  filter_slot:
    title: Filter slot
    description: The name of the slot the filter is on.
    slot_uri: rp:filterSlot
    alias: slot
    range: string
  filter_value:
    title: Filter value
    description: The value the slot must have, as text.
    slot_uri: rp:filterValue
    alias: value
    range: string
  problem_type:
    title: Problem type
    description: The IRI that identifies the kind of problem.
    slot_uri: rp:problemType
    alias: type
    range: uri
  problem_slug:
    title: Problem slug
    description: The last segment of the problem type IRI, lower case words joined by hyphens.
    slot_uri: rp:problemSlug
    alias: slug
    range: string
    pattern: "^[a-z]+(?:-[a-z]+)*$"
  problem_title:
    title: Problem title
    description: A short, fixed summary of the kind of problem.
    slot_uri: rp:problemTitle
    alias: title
    range: string
  problem_status:
    title: Problem status
    description: The HTTP status code of the answer.
    slot_uri: rp:problemStatus
    alias: status
    range: integer
  problem_detail:
    title: Problem detail
    description: An explanation of this occurrence of the problem.
    slot_uri: rp:problemDetail
    alias: detail
    range: string
  problem_instance:
    title: Problem instance
    description: The IRI that identifies this occurrence of the problem.
    slot_uri: rp:problemInstance
    alias: instance
    range: uri
  account_id:
    title: Account id
    description: The identity provider's id of the account.
    slot_uri: rp:accountId
    range: string
    pattern: "^.+$"
  user_name:
    title: User name
    description: The name the account signs in with.
    slot_uri: rp:userName
    range: string
  email:
    title: Email
    description: The email address of a person's account.
    slot_uri: rp:email
    range: string
  active:
    title: Active
    description: Whether the account may sign in; a disabled account is refused new tokens.
    slot_uri: rp:accountActive
    range: boolean

enums:
  IdKind:
    title: Id kind
    description: The ways an id is drawn.
    permissible_values:
      uuid4:
        title: UUIDv4
        meaning: rp:IdUuid4
        description: A random UUID, in its canonical form.
      random:
        title: Random
        meaning: rp:IdRandom
        description: Characters drawn at random from an alphabet.
  ProblemSlug:
    title: Problem slug
    description: >-
      The kinds of problem the toolkit answers with, by the last segment of their problem type IRI, with the underscores written as hyphens.
    permissible_values:
      invalid_token:
        title: Invalid token
        meaning: rp:invalidToken
        description: No bearer token, or one the service refuses.
      forbidden:
        title: Forbidden
        meaning: rp:forbidden
        description: The caller may see the thing but is not allowed the action.
      not_found:
        title: Not found
        meaning: rp:notFound
        description: There is no such thing, or the caller cannot see it.
      conflict:
        title: Version conflict
        meaning: rp:conflict
        description: The write lost a race, or the thing to create already exists.
      precondition_required:
        title: Precondition required
        meaning: rp:preconditionRequired
        description: An update or a delete came without the version it expects.
      invalid_body:
        title: Invalid body
        meaning: rp:invalidBody
        description: The body is not a valid representation for its route.
      not_acceptable:
        title: Not acceptable
        meaning: rp:notAcceptable
        description: The service produces nothing the client accepts.
      unsupported_media_type:
        title: Unsupported media type
        meaning: rp:unsupportedMediaType
        description: The route does not take the media type of the body.
      bad_query:
        title: Bad query
        meaning: rp:badQuery
        description: The query string is not one the route takes.
      unavailable:
        title: Service unavailable
        meaning: rp:unavailable
        description: A store, the identity provider or the role definitions are not usable.
      payload_too_large:
        title: Payload too large
        meaning: rp:payloadTooLarge
        description: The body is larger than the service takes.
      method_not_allowed:
        title: Method not allowed
        meaning: rp:methodNotAllowed
        description: The route has no such method.
      internal_error:
        title: Internal error
        meaning: rp:internalError
        description: The service failed; the answer says no more.
