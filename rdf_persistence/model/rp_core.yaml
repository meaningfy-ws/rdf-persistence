id: https://meaningfy.ws/ns/rdf-persistence/core
name: rp_core
title: RDF persistence core module
description: >-
  The core of the RDF persistence metamodel: the aggregate root mixin, the principal, the version and
  loaded-graph slots, and the registry entry. Every other module of the metamodel builds on it.
prefixes:
  rp: https://meaningfy.ws/ns/rdf-persistence#
  linkml: https://w3id.org/linkml/
  dcterms: http://purl.org/dc/terms/
  prov: http://www.w3.org/ns/prov#
  ODRL: http://www.w3.org/ns/odrl/2/
default_prefix: rp
default_range: string
imports:
  - linkml:types

classes:
  AggregateRoot:
    title: Aggregate root
    description: >-
      A mixin for classes whose instances are aggregate roots. Each instance is one named graph, whose
      IRI is derived from the root's IRI; it is versioned, loaded and saved as a whole.
    class_uri: rp:AggregateRoot
    mixin: true
    broad_mappings:
      - prov:Entity
  Principal:
    title: Principal
    description: A reference to a user account in the identity provider, by IRI only.
    class_uri: prov:Agent
    exact_mappings:
      - ODRL:Party
    slots:
      - id
  RegistryEntry:
    title: Registry entry
    description: >-
      An entry of a tenant's registry graph, naming a graph that belongs to an aggregate. It is written
      by the session, never by the application.
    class_uri: rp:RegistryEntry
    slots:
      - graph
      - kind
      - owned_by
    slot_usage:
      graph:
        required: true
      kind:
        required: true
      owned_by:
        required: true
  PendingLoad:
    title: Pending load
    description: >-
      The registry marker of a load not yet committed: one triple saying when the graph was put. It
      names no registry entry, so deleting it never deletes an entry.
    class_uri: rp:PendingLoad
    slots:
      - id
      - loaded_at
    slot_usage:
      id:
        description: The IRI of the graph the load put; the marker's subject, so no rp:graph triple.
      loaded_at:
        required: true
  CommitMarker:
    title: Commit marker
    description: >-
      The registry marker of one transaction's commit: a fresh IRI per transaction, written first in
      the single request, so the writes that follow apply only if it was written.
    class_uri: rp:CommitMarker
    slots:
      - id
      - started_at
    slot_usage:
      id:
        description: A fresh urn:uuid IRI, never shared by two transactions.
      started_at:
        required: true
  AggregateKey:
    title: Aggregate key
    description: >-
      A key across aggregates, as the runtime reads it from the schema: no two aggregate roots of one
      class in a tenant's database hold the same values for its predicates.
    class_uri: rp:AggregateKey
    slots:
      - key_name
      - root_class
      - key_predicates
    slot_usage:
      key_name:
        required: true
      root_class:
        required: true
        description: The IRI of the class of the aggregate roots the key governs; a root of a subclass is its own scope.
      key_predicates:
        required: true
        description: The predicates of the key's slots, in the order of the key.
  KeyDuplicate:
    title: Key duplicate
    description: >-
      A set of aggregate roots of one class that hold the same values for a key across aggregates, found
      in a tenant's database by the duplicates report.
    class_uri: rp:KeyDuplicate
    slots:
      - key_name
      - root_class
      - key_values
      - key_roots
    slot_usage:
      key_name:
        required: true
      root_class:
        required: true
        description: The IRI of the class of the roots.
      key_values:
        required: true
        description: The lexical forms of the shared values, in the order of the key.
      key_roots:
        required: true
        description: The IRIs of the roots that hold the values, sorted.

slots:
  url_segment:
    title: URL segment
    description: >-
      A path segment of the service's routes: lower case, starting with a letter, with digits and
      hyphens. The `rp_path` annotation and the tenant segment of the service settings share it.
    slot_uri: rp:urlSegment
    abstract: true
    range: string
    pattern: "^[a-z][a-z0-9-]*$"
  id:
    title: Identifier
    description: The IRI that identifies the object.
    slot_uri: dcterms:identifier
    range: uri
    identifier: true
  version:
    title: Version
    description: >-
      The version token of an aggregate, stated about its graph IRI. The session writes it; no domain
      class carries it.
    slot_uri: rp:version
    range: string
    annotations:
      bookkeeping: true
  loaded_graph:
    title: Loaded graph
    description: A graph whose lifecycle belongs to the aggregate, such as the triples of a loaded RDF file.
    slot_uri: rp:loadedGraph
    range: uri
  graph:
    title: Graph
    description: The IRI of a named graph.
    slot_uri: rp:graph
    range: uri
  loaded_at:
    title: Loaded at
    description: The time a graph was put to the store by a load.
    slot_uri: rp:loadedAt
    range: datetime
  started_at:
    title: Started at
    description: The time a transaction started.
    slot_uri: rp:startedAt
    range: datetime
  kind:
    title: Kind
    description: The kind of graph a registry entry names.
    slot_uri: rp:kind
    range: RegistryKind
  listed_in:
    title: Listed in
    description: >-
      The graph a listing found a subject in. The listing query states it about each subject, and the
      toolkit drops it before answering.
    slot_uri: rp:listedIn
    range: uri
  owned_by:
    title: Owned by
    description: The IRI of the aggregate root that owns the graph.
    slot_uri: rp:ownedBy
    range: uri
  key_name:
    title: Key name
    description: The name of a key across aggregates, as declared in `unique_keys`.
    slot_uri: rp:keyName
    range: string
  root_class:
    title: Root class
    description: The IRI of the class of the aggregate roots a key governs.
    slot_uri: rp:rootClass
    range: uri
  key_predicates:
    title: Key predicates
    description: The predicates of the slots of a key.
    slot_uri: rp:keyPredicates
    range: uri
    multivalued: true
  key_values:
    title: Key values
    description: The values that a set of roots share for a key.
    slot_uri: rp:keyValues
    range: string
    multivalued: true
  key_roots:
    title: Key roots
    description: The IRIs of aggregate roots.
    slot_uri: rp:keyRoots
    range: uri
    multivalued: true

enums:
  RegistryKind:
    title: Registry kind
    description: The kinds of graph a registry entry can name.
    permissible_values:
      aggregate:
        title: Aggregate
        description: The graph of an aggregate root.
        meaning: rp:Aggregate
      loaded_graph:
        title: Loaded graph
        description: A graph loaded for an aggregate, whose lifecycle belongs to it.
        meaning: rp:LoadedGraph

  RpAnnotation:
    title: Annotation tag
    description: >-
      The annotations the toolkit reads from a schema, one entry per tag; any other tag is left alone.
      Each description says which element carries the tag and which values it accepts.
    permissible_values:
      owned:
        title: Owned
        description: >-
          Slot annotation, `true` when the slot's values are part of the aggregate and live in its
          graph; any other slot ranging over a class refers to another aggregate root, by IRI.
        meaning: rp:AnnotationOwned
      internal:
        title: Internal
        description: >-
          Slot annotation, `true` when the slot never appears in the API contract; the toolkit writes it.
        meaning: rp:AnnotationInternal
      graph:
        title: Graph
        description: >-
          Class annotation, `meta` (see GraphKind) for the tenant root object, which lives in the
          tenant's meta graph instead of a graph of its own.
        meaning: rp:AnnotationGraph
      database:
        title: Database
        description: >-
          Class annotation, `tenant` (the default), `system` or `application` (see DatabaseKind): the
          database an aggregate lives in.
        meaning: rp:AnnotationDatabase
      module_kind:
        title: Module kind
        description: >-
          Schema annotation, `domain`, `technical` or `access` (see ModuleKind): the kind of the module;
          a domain module may not import a technical or an access one.
        meaning: rp:AnnotationModuleKind
      rp_path:
        title: Path
        description: >-
          Class annotation, required on every aggregate root: its path segment in the API. It follows the
          pattern of the url_segment slot.
        meaning: rp:AnnotationPath
      rp_iri_type:
        title: IRI type
        description: >-
          Class annotation, the `{type}` segment of the IRIs of the class's instances; default, the class
          name in kebab case. It follows the pattern of the url_segment slot and is unique in a schema.
        meaning: rp:AnnotationIriType
      rp_unlabelled:
        title: Unlabelled
        description: >-
          Class annotation, `true` on an owned value class whose instances need no label of their own.
        meaning: rp:AnnotationUnlabelled
      rp_writes:
        title: Writes
        description: >-
          Class annotation (see WritesKind). `service` marks an aggregate root whose generic create,
          replace and delete are not served; the consumer writes it through a session. A root that
          mixes in StoredFile is service-written without it. `toolkit` marks a root the toolkit
          writes and reads itself, which no route serves.
        meaning: rp:AnnotationWrites
      bookkeeping:
        title: Bookkeeping
        description: >-
          Slot annotation, `true` when the session writes the slot about a graph (its version, who
          created or contributed to it, when); closed shapes ignore the statement.
        meaning: rp:AnnotationBookkeeping
      rp_unique_scope:
        title: Unique scope
        description: >-
          Annotation of a `unique_keys` entry on an aggregate root (or an ancestor of roots), `tenant`
          (see UniqueScope): the key holds across the aggregates of a tenant, not inside one aggregate.
          A key without it keeps its in-aggregate meaning.
        meaning: rp:AnnotationUniqueScope
  ModuleKind:
    title: Module kind
    description: The kinds of schema module, the values of the module_kind annotation.
    permissible_values:
      domain:
        title: Domain
        description: A module of the application's domain; it imports no technical or access module.
        meaning: rp:ModuleDomain
      technical:
        title: Technical
        description: A module of technical concerns, such as files or provenance.
        meaning: rp:ModuleTechnical
      access:
        title: Access
        description: A module of access control, such as grants and tenancy.
        meaning: rp:ModuleAccess
  DatabaseKind:
    title: Database kind
    description: The databases an aggregate can live in, the values of the database annotation.
    permissible_values:
      tenant:
        title: Tenant
        description: The tenant's own database, the default.
        meaning: rp:DatabaseTenant
      system:
        title: System
        description: The system database, shared by all tenants.
        meaning: rp:DatabaseSystem
      application:
        title: Application
        description: The application database, one per deployment, outside every tenant.
        meaning: rp:DatabaseApplication
  WritesKind:
    title: Writes kind
    description: How an aggregate root is written, the values of the rp_writes annotation.
    permissible_values:
      service:
        title: Service
        description: The consumer writes the root through a session; the API serves no generic create, replace or delete.
        meaning: rp:WritesService
      toolkit:
        title: Toolkit
        description: >-
          The toolkit writes and reads the root itself; no route serves it, and the consumer does not
          write it.
        meaning: rp:WritesToolkit
  GraphKind:
    title: Graph kind
    description: The special graphs a class can live in, the values of the graph annotation.
    permissible_values:
      meta:
        title: Meta
        description: The tenant's meta graph, which holds the tenant root object.
        meaning: rp:GraphMeta
  UniqueScope:
    title: Unique scope
    description: The scopes of a key across aggregates, the values of the rp_unique_scope annotation.
    permissible_values:
      tenant:
        title: Tenant
        description: The key holds across all the aggregate roots of one class in a tenant's database.
        meaning: rp:UniqueScopeTenant
