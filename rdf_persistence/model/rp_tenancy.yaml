id: https://meaningfy.ws/ns/rdf-persistence/tenancy
name: rp_tenancy
title: RDF persistence tenancy module
description: >-
  The tenancy record of the metamodel, the access record of a tenant, kept in the system database.
prefixes:
  rp: https://meaningfy.ws/ns/rdf-persistence#
  linkml: https://w3id.org/linkml/
default_prefix: rp
default_range: string
imports:
  - linkml:types
  - rp_core
  - rp_annotations
  - rp_access
annotations:
  module_kind: access

classes:
  TenantLabelled:
    title: Tenant labelled
    description: >-
      A mixin for what carries a tenant's label, one line of 1 to 200 characters that neither starts
      nor ends in a space; the access record and the service's request bodies share it, so the
      label is checked the same everywhere.
    class_uri: rp:TenantLabelled
    mixin: true
    slots:
      - label
    slot_usage:
      label:
        required: true
        pattern: "^\\S(?:.{0,198}\\S)?$"
  TenantAccess:
    title: Tenant access
    description: >-
      The access record of a tenant: its label, state and database name, with the grants and
      prohibitions that say who may do what in it.
    class_uri: rp:TenantAccess
    is_a: Policy
    mixins:
      - AggregateRoot
      - Described
      - TenantLabelled
    slots:
      - state
      - database_name
      - grants
      - prohibitions
    slot_usage:
      state:
        required: true
      database_name:
        required: true
    annotations:
      rp_path: access
      database: system
  TenantSweepReport:
    title: Tenant sweep report
    description: >-
      The outcome of a sweep of one live tenant: the loaded graphs and bucket objects found orphaned
      past the grace period, and whether each list was removed.
    class_uri: rp:TenantSweepReport
    slots:
      - tenant
      - older_than_seconds
      - loaded_graphs
      - blobs
      - removed_loaded_graphs
      - removed_blobs
      - skipped_blobs

slots:
  tenant:
    title: Tenant
    description: The IRI of the tenant.
    slot_uri: rp:tenant
    range: uri
  older_than_seconds:
    title: Older than seconds
    description: The grace period in seconds; only what is older is reported.
    slot_uri: rp:olderThanSeconds
    range: integer
  loaded_graphs:
    title: Loaded graphs
    description: The IRIs of the orphaned loaded graphs found, sorted.
    slot_uri: rp:sweptLoadedGraph
    range: uri
    multivalued: true
  blobs:
    title: Blobs
    description: The keys of the orphaned bucket objects found, sorted.
    slot_uri: rp:sweptBlob
    range: string
    multivalued: true
  removed_loaded_graphs:
    title: Removed loaded graphs
    description: Whether the orphaned loaded graphs were removed.
    slot_uri: rp:removedLoadedGraphs
    range: boolean
  removed_blobs:
    title: Removed blobs
    description: Whether the orphaned bucket objects were removed.
    slot_uri: rp:removedBlobs
    range: boolean
  skipped_blobs:
    title: Skipped blobs
    description: The keys of orphaned objects the object store would not delete.
    slot_uri: rp:skippedBlob
    range: string
    multivalued: true
  state:
    title: State
    description: Where the tenant is in its life.
    slot_uri: rp:state
    range: TenantState
  database_name:
    title: Database name
    description: >-
      The name of the tenant's database, the prefix, "-t-" and the tenant id (hyphens left out); the prefix is
      lower case, at most 20 characters, the tenant id 4 to 32 lower case letters and digits.
    slot_uri: rp:databaseName
    range: string
    pattern: "^[a-z][a-z0-9]{0,19}-t-[a-z0-9]{4,32}$"
    annotations:
      internal: true
  grants:
    title: Grants
    description: The permissions given in the tenant, by role or as direct actions; they live in the access record's graph.
    slot_uri: rp:grant
    range: Grant
    multivalued: true
    inlined_as_list: true
    annotations:
      owned: true
  prohibitions:
    title: Prohibitions
    description: The actions forbidden in the tenant; they live in the access record's graph.
    slot_uri: rp:prohibition
    range: Prohibition
    multivalued: true
    inlined_as_list: true
    annotations:
      owned: true

enums:
  TenantState:
    title: Tenant state
    description: The states of a tenant.
    permissible_values:
      active:
        title: Active
        description: The tenant is in use.
        meaning: rp:Active
      deleting:
        title: Deleting
        description: The tenant is being deleted and answers as if it did not exist.
        meaning: rp:Deleting
