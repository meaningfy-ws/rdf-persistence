# Test containers (PD-16): Fuseki, Garage and Zitadel with Postgres.
#
# The pytest fixtures (rdf_persistence.testkit.containers.fixtures) start only the services a test
# needs, with free host ports passed in the RP_*_PORT variables. The defaults let you start the
# stack by hand: `docker compose -f compose.yaml up -d --build`. Test-only credentials throughout.
#
# Fuseki: Apache publishes the Dockerfile, not an image, so fuseki/ vendors the unmodified
# jena-fuseki-docker 5.6.0 (Apache-2.0; LICENSE and NOTICE alongside), built at Jena 5.6.0.
# Garage and Zitadel are pinned by digest; the tags in the comments are what the digests were
# taken from.

services:
  fuseki:
    build:
      context: ./fuseki
      args:
        JENA_VERSION: "5.6.0"
    environment:
      # The jar reads $FUSEKI_BASE/shiro.ini and needs the base writable. Of the directories the
      # unmodified image creates for the fuseki user, /fuseki/databases is the one to use.
      FUSEKI_BASE: /fuseki/databases
      JAVA_OPTIONS: "-Xmx512m -Xms256m"
    volumes:
      - ./fuseki/shiro.ini:/fuseki/databases/shiro.ini:ro
    ports:
      - "${RP_FUSEKI_PORT:-3030}:3030"

  garage:
    # dxflrs/garage:v2.5.0
    image: dxflrs/garage@sha256:677e5b758e4425a325b811c425c026bf35a4bf42f7ddbaa773de3f4fd779a5a5
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
    ports:
      - "${RP_GARAGE_PORT:-3900}:3900"

  postgres:
    # postgres:17-alpine
    image: postgres@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zitadel
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d zitadel -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

  zitadel:
    # ghcr.io/zitadel/zitadel:v4.20.1
    image: ghcr.io/zitadel/zitadel@sha256:4817dbd8896306867f28bba63e7dc3526b2d2646ac7111db9524eb3ab6e82301
    command: start-from-init --masterkeyFromEnv --tlsMode disabled
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ZITADEL_MASTERKEY: "MasterkeyNeedsToHave32Characters"
      ZITADEL_DATABASE_POSTGRES_HOST: postgres
      ZITADEL_DATABASE_POSTGRES_PORT: "5432"
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      # Zitadel listens on the port it is published on, so its issuer URL and its own
      # `zitadel ready` health check agree with the address the tests use.
      ZITADEL_PORT: "${RP_ZITADEL_PORT:-8085}"
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_EXTERNALPORT: "${RP_ZITADEL_PORT:-8085}"
      # An admin machine user, with a personal access token written to the mounted file.
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: rp-admin
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: rp-admin
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"
      ZITADEL_FIRSTINSTANCE_PATPATH: /bootstrap/admin.pat
    volumes:
      - "${RP_ZITADEL_BOOTSTRAP_DIR:-./zitadel-bootstrap}:/bootstrap"
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 10s
    ports:
      - "${RP_ZITADEL_PORT:-8085}:${RP_ZITADEL_PORT:-8085}"
