# Apache Shiro configuration for the test Fuseki: exactly one user, admitted on every endpoint,
# the admin endpoints (/$/**) included, because tests create and drop datasets.
# Test-only credentials (PD-16); never use this file outside tests.

[main]
# Fuseki Main has no servlet session manager; authenticate each request instead of keeping a session.
securityManager.subjectDAO.sessionStorageEvaluator.sessionStorageEnabled = false

[users]
rp-test = rp-test

[urls]
/**=authcBasic,user[rp-test]
