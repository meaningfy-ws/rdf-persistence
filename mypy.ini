[mypy]
# Strict-ish static typing. Config in this dedicated root file (decision D2).
python_version = 3.12
mypy_path = .
warn_unused_configs = True
warn_unused_ignores = True
warn_return_any = True
warn_unreachable = True
implicit_reexport = False
check_untyped_defs = True
no_implicit_optional = True
pretty = True

# Generated code is reproduced by the generators, not edited (PD-19).
exclude = (^|/)generated/

# No-src layout: the package sits at the repo root, so namespace discovery is flat.
explicit_package_bases = True
namespace_packages = True

# Prefer per-module overrides (below) for individual missing stubs. Flip this to
# True only if a hard dependency ships no py.typed and has no stubs at all.
# ignore_missing_imports = True

# Tests may use loosely-typed fixtures and parametrisation. `make typecheck` scopes
# mypy to the package only, so this override is an example — uncomment it (and add
# `tests` to the typecheck target) if you decide to type-check tests too.
# [mypy-tests.*]
# disallow_untyped_defs = False

# ---------------------------------------------------------------------------
# Per-module suppressions for third-party typing limitations.
# Add narrowly-scoped overrides here instead of a blanket ignore.
# ---------------------------------------------------------------------------
# Example: a third-party client whose async methods return `Awaitable[T] | T`
# unions that mypy cannot narrow through `await`.
# [mypy-rdf_persistence.adapters.some_client]
# disable_error_code = misc, no-any-return

# testcontainers ships no type information (testkit extra, PD-16).
[mypy-testcontainers.*]
ignore_missing_imports = True

# linkml-runtime ships no py.typed marker (generation/schema.py).
[mypy-linkml_runtime.*]
ignore_missing_imports = True

# linkml (the generate extra) ships no py.typed marker, and neither does PyYAML's stub-less install.
[mypy-linkml.*]
ignore_missing_imports = True

[mypy-yaml]
ignore_missing_imports = True

# pyld ships no type information (the conformance suite and the round-trip tests).
[mypy-pyld.*]
ignore_missing_imports = True

# boto3 and botocore ship no type information (the S3 file store).
[mypy-boto3.*,botocore.*]
ignore_missing_imports = True
