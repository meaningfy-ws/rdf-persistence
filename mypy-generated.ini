# Type check of the generated code only (PD-19, PD-27 item 7). The main mypy.ini excludes it.
# A failure is fixed in the generator templates or extensions, then `make generate`: never in the output.
[mypy]
python_version = 3.12
plugins = pydantic.mypy
check_untyped_defs = True
ignore_missing_imports = True
warn_unused_ignores = False
disallow_untyped_defs = False
mypy_path = .
explicit_package_bases = True
namespace_packages = True
