# bootstrap.py also holds the one library function that touches the environment: `environment()`
# sets variables for a block and restores them (TID251).
"rdf_persistence/testkit/bootstrap.py" = ["PLR0913", "TID251"]
"rdf_persistence/testkit/fakes.py" = ["PLR0913"]
"rdf_persistence/testkit/tokens.py" = ["PLR0913"]
"rdf_persistence/testkit/zitadel.py" = ["PLR0913"]

[format]
quote-style = "double"
indent-style = "space"
