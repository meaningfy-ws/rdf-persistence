# Ruff — formatter + linter, replaces black + isort + flake8 + pylint (decision D4).
# Config lives in this dedicated root file; pyproject.toml stays minimal.

line-length = 100
# Matches the project's Python version (rendered from --python at scaffold time).
target-version = "py312"

# Generated code is reproduced by the generators, not edited (PD-19).
extend-exclude = ["**/generated/**"]

[lint]
# Selection set from decision D4.
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # import sorting (isort)
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "C90",    # mccabe complexity
    "N",      # pep8-naming conventions
    "RUF100", # unused noqa directives
    "S113",   # request without a timeout (hygiene; httpx has a default, requests.Session is a known gap)
    "DTZ",    # naive datetime: constructor, utcnow(), now(), strptime() without %z (hygiene)
    "BLE001", # blind except: Exception or BaseException (hygiene; a bare except is E722)
    "TID251", # banned API: env reads outside the config class (cosmic-python:PR-CONFIG-DECOUPLED)
    "PLR2004", # magic value in a comparison (cosmic-python:BP-CONSTANTS-ENUMS, AP-FREESTR-ANYLAYER)
    "PLR0912", # too many branches, default 12 (clean code: small functions)
    "PLR0913", # too many arguments, default 5 (clean code: small functions)
    "PLR0915", # too many statements, default 50 (clean code: small functions)
    "PT018",  # composite assertion `assert a and b` (testing checklist item 11)
]
ignore = [
    "E501",   # line length is enforced by the formatter; avoid double-flagging
]

[lint.mccabe]
max-complexity = 10

[lint.pylint]
allow-magic-value-types = ["bytes"]

[lint.flake8-tidy-imports.banned-api]
"os.getenv".msg = "Read configuration through the typed config class (cosmic-python:PR-CONFIG-DECOUPLED)."
"os.environ".msg = "Read configuration through the typed config class (cosmic-python:PR-CONFIG-DECOUPLED)."
"opentelemetry.sdk".msg = "The package depends on the API only; the SDK is the application's (otel-observability PD-11)."

[lint.per-file-ignores]
"tests/**/*.py" = [
    "PLR2004", # literal expected values are the point of a test
    "PLR0913", # pytest fixtures arrive as arguments
    "TID251",  # tests set, restore and read the environment to exercise configuration and tooling
]

# PLR0913 debt: parameter objects, tracked in the issue the lead opens; drop a file once clean
"rdf_persistence/adapters/jwks.py" = ["PLR0913"]
"rdf_persistence/entrypoints/kit.py" = ["PLR0913"]
"rdf_persistence/entrypoints/openapi.py" = ["PLR0913"]
"rdf_persistence/entrypoints/responses.py" = ["PLR0913"]
"rdf_persistence/entrypoints/service.py" = ["PLR0913"]
"rdf_persistence/entrypoints/sse.py" = ["PLR0913"]
"rdf_persistence/generation/extensions/shacl_constraints.py" = ["PLR0913"]
"rdf_persistence/services/aggregates.py" = ["PLR0913"]
"rdf_persistence/services/collaboration.py" = ["PLR0913"]
"rdf_persistence/services/discussion.py" = ["PLR0913"]
"rdf_persistence/services/documents.py" = ["PLR0913"]
"rdf_persistence/services/event_stream.py" = ["PLR0913"]
"rdf_persistence/services/file_removal.py" = ["PLR0913"]
"rdf_persistence/services/migration_runner.py" = ["PLR0913"]
"rdf_persistence/services/reference_collections.py" = ["PLR0913"]
"rdf_persistence/services/relay.py" = ["PLR0913"]
"rdf_persistence/services/session.py" = ["PLR0913"]
"rdf_persistence/services/tenancy.py" = ["PLR0913"]
"rdf_persistence/services/tenant_dump.py" = ["PLR0913"]
"rdf_persistence/services/tenant_sweep.py" = ["PLR0913"]
