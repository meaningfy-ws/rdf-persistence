# mutmut 3.8.1 reads its configuration only from this file (PD-9); every other tool has its own
# root file. `make mutation` mutates the domain layer; to audit another layer, edit only
# `only_mutate` and `pytest_add_cli_args_test_selection`.
[mutmut]
source_paths = rdf_persistence
do_not_mutate =
    rdf_persistence/*/generated/*
    rdf_persistence/domain/generated/*
also_copy =
    docs
    openspec
    .claude/hooks
    pytest.ini
    .coveragerc
    VERSION
    AGENTS.md
    CLAUDE.md
    README.md
    Makefile
only_mutate = rdf_persistence/domain/*
pytest_add_cli_args_test_selection = tests/unit/domain
pytest_add_cli_args = -p no:cacheprovider -q
