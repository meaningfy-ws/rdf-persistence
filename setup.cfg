# mutmut 3.8.1 reads its configuration only from this file (PD-9); every other tool has its own
# root file. `make mutation` mutates the domain layer; to audit another layer, edit only
# `only_mutate` and `pytest_add_cli_args_test_selection`.
[mutmut]
source_paths = rdf_persistence
do_not_mutate =
    rdf_persistence/*/generated/*
also_copy =
    docs
    openspec
    .claude/hooks
    pytest.ini
    .coveragerc
    VERSION
    AGENTS.md
    CLAUDE.md
    README.md
    Makefile
only_mutate =
    rdf_persistence/domain/*
    rdf_persistence/*/domain/*
    rdf_persistence/iris/services/iris.py
    rdf_persistence/services/tenant_move.py
# The domain of every theme (`generated` is left out by `do_not_mutate`) and the IRI policy are mutated;
# the domain tests of the themes (the moved ones included), the iris tests and the tenant-move module
# (technical-models DEC-3) are selected here beside the old domain tests.
pytest_add_cli_args_test_selection =
    tests/unit/domain
    tests/unit/core/test_domain_base_shim.py
    tests/unit/core/test_exceptions.py
    tests/unit/core/test_rp_model.py
    tests/unit/core/test_sparql.py
    tests/unit/core/test_sparql_parsing.py
    tests/unit/files/test_blob_keys.py
    tests/unit/iris
    tests/unit/services/test_tenant_move.py
pytest_add_cli_args = -p no:cacheprovider -q
