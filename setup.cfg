# mutmut 3.8.1 reads its configuration only from this file (PD-9); every other tool has its own
# root file. `make mutation` mutates the domain layer; to audit another layer, edit only
# `only_mutate` and `pytest_add_cli_args_test_selection`.
[mutmut]
source_paths = rdf_persistence
do_not_mutate =
    rdf_persistence/*/generated/*
also_copy =
    docs
    openspec
    .claude/hooks
    pytest.ini
    .coveragerc
    VERSION
    AGENTS.md
    CLAUDE.md
    README.md
    Makefile
only_mutate =
    rdf_persistence/domain/*
    rdf_persistence/services/iris.py
    rdf_persistence/services/tenant_move.py
# The iris and tenant-move modules live in services (technical-models DEC-3), with their tests,
# which are selected here beside the domain tests.
pytest_add_cli_args_test_selection =
    tests/unit/domain
    tests/unit/services/test_iris.py
    tests/unit/services/test_iris_application.py
    tests/unit/services/test_iris_application_adversarial.py
    tests/unit/services/test_iris_follow_schema.py
    tests/unit/services/test_iris_policy.py
    tests/unit/services/test_iri_policy_effective.py
    tests/unit/services/test_iri_policy_model.py
    tests/unit/services/test_iri_policy_model_adversarial.py
    tests/unit/services/test_tenant_move.py
pytest_add_cli_args = -p no:cacheprovider -q
