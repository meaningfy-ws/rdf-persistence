# mutmut 3.8.1 reads its configuration only from this file (PD-9); every other tool has its own
# root file. `make mutation` mutates the domain layer; to audit another layer, edit only
# `only_mutate` and `pytest_add_cli_args_test_selection`.
[mutmut]
source_paths = rdf_persistence
do_not_mutate =
    rdf_persistence/*/generated/*
also_copy =
    rdf_persistence_generation
    docs
    openspec
    .claude/hooks
    pytest.ini
    .coveragerc
    VERSION
    AGENTS.md
    CLAUDE.md
    README.md
    Makefile
only_mutate =
    rdf_persistence/*/domain/*
    rdf_persistence/iris/services/iris.py
    rdf_persistence/tenancy/services/tenant_move.py
# The domain layer of every theme (`generated` is left out by `do_not_mutate`), the iris policy and the
# tenant-move module (technical-models DEC-3) are selected here, each with the tests of its theme.
pytest_add_cli_args_test_selection =
    tests/unit/core
    tests/unit/files
    tests/unit/iris
    tests/unit/tenancy/test_tenant_move.py
pytest_add_cli_args = -p no:cacheprovider -q
