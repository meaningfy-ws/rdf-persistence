# Docs workflow for RDF Persistence
# ============================================================================
# The main CI workflow ignores docs/**, so changes there are checked here
# (PD-20): the consumer-term and nav check, then the Antora build. Thin
# workflow: every step calls a `make` target.

name: Docs

on:
  push:
    branches: [develop]
    paths:
      - "docs/**"
  pull_request:
    branches: [develop]
    paths:
      - "docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs:
    name: Check and build the docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12, uv and the dependencies
        uses: ./.github/actions/setup  # check-docs imports the package to check the generated reference

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"  # the mermaid CLI of check-diagrams needs 22.13 or later

      - name: Check the docs
        run: make check-docs

      - name: Render every diagram with the site's mermaid
        run: make check-diagrams

      - name: Install Antora
        run: make install-antora

      - name: Build the docs
        run: make build-docs
