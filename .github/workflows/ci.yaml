# CI workflow for RDF Persistence
# ============================================================================
# Thin workflow (decision D12): every step calls a `make` target — never an
# inline tool command. The gates here mirror `make check-all` + `make
# clean-code` (i.e. `make ci-full`) so "green locally" means "green in CI".
#
# Runs on push to develop and on PRs targeting develop; the container tests on PRs only.
#
# SonarCloud on the free plan (developer, 2026-11-05). The free plan analyses
# public projects, but only the SonarCloud main branch and PRs that target it.
# So the SonarCloud project's main branch must be named `develop`. The scan runs
# only when the repo variable SONAR_ENABLED is 'true' and SONAR_TOKEN is set;
# until an org admin has created the public project and renamed its main branch
# to `develop`, CI stays green without it.

name: CI

on:
  push:
    branches: [develop]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "LICENSE"
      - ".claude/**"
      - ".mcp.json"
  pull_request:
    branches: [develop]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "LICENSE"
      - ".claude/**"
      - ".mcp.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, Typecheck, Architecture & Test
    runs-on: ubuntu-latest

    # ------------------------------------------------------------------------
    # Service containers — not used: the integration and e2e tests start their own
    # containers (testkit, PD-16) in the `containers` job below.
    # ------------------------------------------------------------------------
    # services:
    #   postgres:
    #     image: postgres:16-alpine
    #     env:
    #       POSTGRES_USER: ci_user
    #       POSTGRES_PASSWORD: ci_password
    #       POSTGRES_DB: ci_db
    #     ports:
    #       - 5432:5432
    #     options: >-
    #       --health-cmd "pg_isready -U ci_user"
    #       --health-interval 10s
    #       --health-timeout 5s
    #       --health-retries 5
    #   redis:
    #     image: redis:7-alpine
    #     ports:
    #       - 6379:6379
    #     options: >-
    #       --health-cmd "redis-cli ping"
    #       --health-interval 10s
    #       --health-timeout 5s
    #       --health-retries 5

    # env:
    #   DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/ci_db
    #   REDIS_URL: redis://localhost:6379/0

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: make install

      - name: Quality gate (lint, types, architecture, spec, docs)
        run: make check-quality

      - name: Set up Node 20 (TypeScript check)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Type-check the generated TypeScript (tsc --noEmit --strict)
        run: make typecheck-ts

      - name: Check the generated code is fresh
        run: make check-generated

      - name: Run tests with coverage
        run: make test

      - name: Clean-code thresholds (Xenon)
        run: make clean-code

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          retention-days: 14
          path: |
            coverage.xml
            test-results.xml

      - name: SonarCloud scan
        if: always() && vars.SONAR_ENABLED == 'true'
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  containers:
    name: Container tests (Fuseki, Garage, Zitadel)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Pull requests only: the merge to develop would re-run what its PR already ran.
    if: github.event_name == 'pull_request'

    # Docker is available on GitHub-hosted ubuntu runners; the fixtures start the containers a
    # test's markers need (PD-16). Coverage is reported without a floor. A PR that changes only
    # openspec/, docs/ or top-level Markdown skips the steps (and the image downloads) and passes.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Does the PR change code?
        id: changes
        run: echo "code=$(make -s changes-code BASE=origin/${{ github.base_ref }})" >> "$GITHUB_OUTPUT"

      - name: Set up Python 3.12
        if: steps.changes.outputs.code == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        if: steps.changes.outputs.code == 'true'
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        if: steps.changes.outputs.code == 'true'
        run: make install

      - name: Load or build the Fuseki image
        if: steps.changes.outputs.code == 'true'
        uses: ./.github/actions/fuseki-image

      - name: Run container tests
        if: steps.changes.outputs.code == 'true'
        run: make test-containers

      - name: Upload container test results
        if: always() && steps.changes.outputs.code == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: container-test-results
          retention-days: 14
          path: |
            coverage-containers.xml
            test-results-containers.xml

  # A PR reads only its own caches and its base branch's. This job fills develop's cache on each
  # push, so a new PR starts with a hit (design PD-1).
  fuseki-image:
    name: Warm the Fuseki image cache
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load or build the Fuseki image
        uses: ./.github/actions/fuseki-image
