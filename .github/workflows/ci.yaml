# CI workflow for RDF Persistence: the PR gate
# ============================================================================
# Thin workflow (decision D12): every step calls a `make` target — never an
# inline tool command. Each job runs one make group, and the jobs run in
# parallel: the static checks, the generated code and the feature tests (the
# spec scenarios), a few minutes in all (ci-minimal-gate DEC-2). The unit lane,
# the generator's tests and SonarCloud run in nightly.yaml and, slow tests
# included, in the local `make check-all` before every PR: green locally means
# green here, not the reverse (ci-minimal-gate DEC-4).
#
# No container, e2e or Fuseki work runs here (developer, 2026-11-08,
# delivery-friction PD-1b): `make test-containers` is run locally.
#
# Runs on PRs targeting develop only: the merge commit carries the tree the PR
# already passed, and the nightly run covers develop (ci-minimal-gate DEC-1).

name: CI

on:
  pull_request:
    branches: [develop]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "LICENSE"
      - ".claude/**"
      - ".mcp.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  style:
    name: Style (format, lint, complexity)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: make check-style

  types:
    name: Types (mypy, generated code, TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: make check-types

  architecture:
    name: Architecture (import-linter)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: make check-architecture

  spec-docs-generation:
    name: Spec, docs and generated code
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: make check-spec-docs
      - run: make check-generation

  feature:
    name: Feature tests (BDD)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: make test-feature
