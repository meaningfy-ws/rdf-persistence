# CI workflow for RDF Persistence
# ============================================================================
# Thin workflow (decision D12): every step calls a `make` target — never an
# inline tool command. Each job runs one make group, and the jobs run in
# parallel; together they cover `make check-all` + `make check-generated`, so
# "green locally" means "green in CI".
#
# No container, e2e or Fuseki work runs here (developer, 2026-11-08,
# delivery-friction PD-1b): `make test-containers` is run locally.
#
# Runs on push to develop and on PRs targeting develop.
#
# SonarCloud on the free plan (developer, 2026-11-05). The free plan analyses
# public projects, but only the SonarCloud main branch and PRs that target it.
# So the SonarCloud project's main branch must be named `develop`. The scan runs
# only when the repo variable SONAR_ENABLED is 'true' and SONAR_TOKEN is set;
# until an org admin has created the public project and renamed its main branch
# to `develop`, CI stays green without it.

name: CI

on:
  push:
    branches: [develop]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "LICENSE"
      - ".claude/**"
      - ".mcp.json"
  pull_request:
    branches: [develop]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "LICENSE"
      - ".claude/**"
      - ".mcp.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  style:
    name: Style (format, lint, complexity)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: make check-style

  types:
    name: Types (mypy, generated code, TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: make check-types

  architecture:
    name: Architecture (import-linter)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: make check-architecture

  spec-docs-generation:
    name: Spec, docs and generated code
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: make check-spec-docs
      - run: make check-generation

  # The fast unit lane in SPLITS duration-balanced shards (Makefile); slow tests run locally only
  # (make test-unit, check-all). One shard is ~1/8 of the ~14 min the lane takes on one runner.
  unit-shard:
    name: Unit tests ${{ matrix.group }}/8
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: make test-unit-ci GROUP=${{ matrix.group }}

      - name: Upload the shard's coverage data and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-shard-${{ matrix.group }}
          retention-days: 1
          include-hidden-files: true
          path: |
            .coverage.${{ matrix.group }}
            test-results-${{ matrix.group }}.xml

  # The floor and SonarCloud read the shards' union, so they run once, after every shard.
  unit:
    name: Unit tests (coverage floor)
    needs: [unit-shard, test-generator]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # SonarCloud reads the history
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          pattern: unit-shard-*
          merge-multiple: true
      - run: make coverage-combine

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          retention-days: 14
          path: |
            coverage.xml
            coverage-generator.xml
            test-results-*.xml

      - name: SonarCloud scan
        if: always() && vars.SONAR_ENABLED == 'true'
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  feature:
    name: Feature tests (BDD)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: make test-feature

  # The generator's own pyramid (tests/generator), measured against rdf_persistence_generation
  # alone. Node is for the tests that run tsc on the generated TypeScript.
  test-generator:
    name: Generator tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: make test-generator

      # Named like the unit shards, so the scan job's `unit-shard-*` download picks it up. Only the
      # XML reports go: the shards' `.coverage.*` data is what `make coverage-combine` merges.
      - name: Upload the generator's coverage report and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-shard-generator
          retention-days: 1
          path: |
            coverage-generator.xml
            test-results-generator.xml
