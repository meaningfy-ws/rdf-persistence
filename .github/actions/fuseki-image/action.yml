name: Fuseki image
description: Restore the Fuseki test image from the Actions cache, load it (building it on a miss), and save the cache on a miss, even when a later step fails.

runs:
  using: composite
  steps:
    - name: Restore the Fuseki image tar
      id: cache
      uses: actions/cache/restore@v4
      with:
        path: temp/fuseki-image.tar
        key: fuseki-${{ hashFiles('rdf_persistence/testkit/containers/fuseki/**', 'rdf_persistence/testkit/containers/compose.yaml') }}

    # The cache keeps the tar's old mtime, which would be older than this checkout's files and make
    # `make` rebuild. The key is a hash of those files, so a hit is always up to date.
    - name: Mark the restored tar as current
      if: steps.cache.outputs.cache-hit == 'true'
      shell: bash
      run: touch temp/fuseki-image.tar

    - name: Load or build the Fuseki image
      shell: bash
      run: make fuseki-image

    - name: Save the Fuseki image tar
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: temp/fuseki-image.tar
        key: ${{ steps.cache.outputs.cache-primary-key }}
