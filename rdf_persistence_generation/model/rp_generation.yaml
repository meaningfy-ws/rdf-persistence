enums:
  HardRule:
    title: Hard rule
    description: The rules of the hard check; a problem line starts with its rule.
    permissible_values:
      iri:
        title: Iri
        description: An element needs an IRI, explicit or from a declared default prefix.
        meaning: rp:HardRuleIri
      title:
        title: Title
        description: An element needs a title.
        meaning: rp:HardRuleTitle
      description:
        title: Description
        description: An element needs a description.
        meaning: rp:HardRuleDescription
      meaning:
        title: Meaning
        description: A permissible value needs a meaning, an IRI.
        meaning: rp:HardRuleMeaning
      rp_path:
        title: Rp path
        description: An aggregate root needs the rp_path annotation.
        meaning: rp:HardRulePath
      described:
        title: Described
        description: A root or an owned class includes Described.
        meaning: rp:HardRuleDescribed
      annotation:
        title: Annotation
        description: >-
          An annotation value is one of its allowed values; the `rp_path` value is a URL segment.
        meaning: rp:HardRuleAnnotation
      unique_key:
        title: Unique key
        description: A unique key is named by an identifier, since generated code carries the name.
        meaning: rp:HardRuleUniqueKey
      iri_type:
        title: IRI type
        description: >-
          The `rp_iri_type` of a root or an owned class, or its kebab-case name when it has none, is
          unique among them and is not a reserved word of the IRI layout.
        meaning: rp:HardRuleIriType
      reserved_segment:
        title: Reserved segment
        description: >-
          The `rp_path` and `rp_iri_type` of an application class do not start with `rp-`, the prefix
          of the toolkit's own roots.
        meaning: rp:HardRuleReservedSegment
      workflow:
        title: Workflow
        description: >-
          The `workflow` annotation is on an aggregate root that is not the tenant root and includes
          `UnderWorkflow`, and every concrete root that includes `UnderWorkflow` has the annotation,
          its own or inherited.
        meaning: rp:HardRuleWorkflow
      migrations_folder:
        title: Migrations folder
        description: >-
          A target whose own modules define a root class that the toolkit stores sets `migrations`,
          the folder of the schema lock and of its migration files, in its `[tool.rp-generate]` entry.
        meaning: rp:HardRuleMigrationsFolder
      quoted_version:
        title: Quoted version
        description: >-
          The root schema of a target that sets `migrations` has a `version`, written as a quoted
          string in the YAML source, since an unquoted `1.10` is read as the number 1.1.
        meaning: rp:HardRuleQuotedVersion
      toolkit_filled:
        title: Toolkit filled
        description: >-
          A class of the application does not give `slot_usage`, `ifabsent` or an attribute of its own
          to a slot annotated `toolkit_filled`, gives no slot of its own the `slot_uri` of one, and has
          no slot that is both `payload` and required.
        meaning: rp:HardRuleToolkitFilled
      default_instance:
        title: Default instance
        description: >-
          A slot annotated `default_instance` ranges over a class, and every required slot of that
          class has an `ifabsent`, so the class can be built with no argument.
        meaning: rp:HardRuleDefaultInstance
      python_package:
        title: Python package
        description: >-
          A schema module of the toolkit's own targets carries the `python_package` annotation.
        meaning: rp:HardRulePythonPackage
      python_package_mismatch:
        title: Python package mismatch
        description: >-
          The `python_package` of a schema module of the toolkit's own targets equals the `package` of
          the `[[tool.rp-generate]]` entry that generates it.
        meaning: rp:HardRulePythonPackageMismatch
  LockRule:
    title: Lock rule
    description: How a change between two locks is treated.
    permissible_values:
      safe:
        title: Safe
        description: Nothing stored is lost or left invalid; the lock is rewritten.
        meaning: rp:LockRuleSafe
      destructive:
        title: Destructive
        description: Stored data would be deleted; needs a new version and a drop step.
        meaning: rp:LockRuleDestructive
      needs_step:
        title: Needs a step
        description: Stored data may no longer fit; needs a new version and a step the developer writes.
        meaning: rp:LockRuleNeedsStep
      not_migratable:
        title: Not migratable
        description: An IRI would change or data would move between graphs; no step can do it.
        meaning: rp:LockRuleNotMigratable
  BoundaryRule:
    title: Boundary rule
    description: The rules of the boundary check; a problem line starts with its rule.
    permissible_values:
      ownership:
        title: Ownership
        description: A class is an aggregate root or is owned by a root.
        meaning: rp:BoundaryRuleOwnership
      reference:
        title: Reference
        description: A slot that is not owned points to a root or to a reference class.
        meaning: rp:BoundaryRuleReference
      module_kind:
        title: Module kind
        description: A domain module does not import a technical or an access module.
        meaning: rp:BoundaryRuleModuleKind
      activity_direction:
        title: Activity direction
        description: >-
          A slot of a class that is not an activity does not range over an application activity class
          that is not an aggregate root: the stored model never refers to a use case.
        meaning: rp:BoundaryRuleActivityDirection
      target_kind:
        title: Target kind
        description: >-
          A target's modules are of one kind, derived from them, and its package sits in a folder that
          kind allows.
        meaning: rp:BoundaryRuleTargetKind
  TargetKind:
    title: Target kind
    description: The kind of a generation target, derived from the modules it generates.
    permissible_values:
      domain:
        title: Domain
        description: >-
          Not every module the target generates is `module_kind: technical`.
        meaning: rp:TargetKindDomain
      technical:
        title: Technical
        description: >-
          Every module the target generates is `module_kind: technical`.
        meaning: rp:TargetKindTechnical
  ConstraintKind:
    title: Constraint kind
    description: The constraint kinds of v1 that the generated classes and shapes must agree on.
    permissible_values:
      required:
        title: Required
        description: A required slot refuses a missing value.
        meaning: rp:ConstraintKindRequired
      cardinality:
        title: Cardinality
        description: A slot's minimum and maximum cardinality bound the number of values.
        meaning: rp:ConstraintKindCardinality
      range_type:
        title: Range type
        description: A slot's range type refuses a value of another type.
        meaning: rp:ConstraintKindRangeType
      range_enum:
        title: Range enum
        description: An enum range refuses a value outside its permissible values.
        meaning: rp:ConstraintKindRangeEnum
      pattern:
        title: Pattern
        description: A pattern refuses a value that does not match.
        meaning: rp:ConstraintKindPattern
      value_bounds:
        title: Value bounds
        description: A minimum or maximum value refuses a value outside the bounds.
        meaning: rp:ConstraintKindValueBounds
      identifier:
        title: Identifier
        description: An identifier slot takes one IRI that names the instance.
        meaning: rp:ConstraintKindIdentifier
      closed:
        title: Closed
        description: A class refuses an unknown field or predicate.
        meaning: rp:ConstraintKindClosed
      exactly_one_of:
        title: Exactly one of
        description: Exactly one of several alternatives is present.
        meaning: rp:ConstraintKindExactlyOneOf
      any_of:
        title: Any of
        description: At least one of several alternatives is present.
        meaning: rp:ConstraintKindAnyOf
      unique_keys:
        title: Unique keys
        description: No two items of a multivalued slot have equal key values.
        meaning: rp:ConstraintKindUniqueKeys
  GenerationAnnotation:
    title: Generation annotation
    description: The annotations this module's schema carries for the toolchain itself.
    permissible_values:
      cli_flag:
        title: Cli flag
        description: On a GenerationTarget slot, the command-line flag that overrides it.
        meaning: rp:GenerationAnnotationCliFlag
      secret:
        title: Secret
        description: On a slot, `true` when its value must stay out of the repr of the generated class.
        meaning: rp:GenerationAnnotationSecret
      allows_extra:
        title: Allows extra
        description: >-
          On a class, `true` when it accepts fields it does not declare and keeps them in `model_extra`,
          as the answer of a foreign API needs. Every other class refuses them.
        meaning: rp:GenerationAnnotationAllowsExtra
      strict:
        title: Strict
        description: >-
          On a slot, `true` when its value must already be of its type: a string is not read as a number,
          and a boolean is not read as one either.
        meaning: rp:GenerationAnnotationStrict
      python_import:
        title: Python import
        description: >-
          On a type, the Python module its `repr` class is imported from: the generated module then
          reads `from <module> import <repr>`.
        meaning: rp:GenerationAnnotationPythonImport
      default_instance:
        title: Default instance
        description: >-
          On a slot whose range is a class, `true` when the slot's default is a new instance of that
          class (`Field(default_factory=<Range>)`), so it is never absent. The hard check refuses it on
          a slot whose range is not a class, or whose range class has a required slot with no `ifabsent`.
        meaning: rp:GenerationAnnotationDefaultInstance
      field_name:
        title: Field name
        description: >-
          On a slot with an `alias`, `slot` when the generated field is named after the slot and keeps
          the alias as its pydantic alias. Without it the field is named after the alias when that is a
          Python identifier (the stock behaviour, which the wire and service schemas rely on).
        meaning: rp:GenerationAnnotationFieldName
      python_package:
        title: Python package
        description: >-
          On a schema module of the toolkit, the Python package its classes are generated into: a
          toolkit run imports them from `<python_package>.<module name>`. It equals the `package` of the
          `[[tool.rp-generate]]` entry that generates the module, which the hard check compares.
        meaning: rp:GenerationAnnotationPythonPackage
      public_package:
        title: Public package
        description: >-
          On the root schema of the metamodel (`rp.yaml`), the package an application's generated code
          imports the metamodel's classes from, which re-exports them.
        meaning: rp:GenerationAnnotationPublicPackage
  UmlLinkKind:
    title: UML link kind
    description: The kinds of connector the UML reader keeps.
    permissible_values:
      association:
        title: Association
        description: A connector between two classes, with roles and cardinalities.
        meaning: rp:UmlLinkKindAssociation
      dependency:
        title: Dependency
        description: A connector from a class to the enumeration it is typed by.
        meaning: rp:UmlLinkKindDependency
      generalisation:
        title: Generalisation
        description: A connector from a class to its parent.
        meaning: rp:UmlLinkKindGeneralisation
  ReportKind:
    title: Report kind
    description: >-
      The kinds of line the conversion report holds; the report prints them with `-` where the
      schema has `_`.
    permissible_values:
      not_generated:
        title: Not generated
        description: A class left out because its stereotype is listed as not generated.
        meaning: rp:ReportKindNotGenerated
      excluded_link:
        title: Excluded link
        description: A link left out because it reaches an excluded package.
        meaning: rp:ReportKindExcludedLink
      outside_link:
        title: Outside link
        description: A link that reaches a class that is not generated, kept as a reference by IRI.
        meaning: rp:ReportKindOutsideLink
      no_note:
        title: No note
        description: A class or an attribute with no note, so no description to carry.
        meaning: rp:ReportKindNoNote
      implicit_meaning:
        title: Implicit meaning
        description: A value of an enumeration written without a prefix, so with no `meaning`.
        meaning: rp:ReportKindImplicitMeaning
      toolkit_filled:
        title: Toolkit filled
        description: An element the converter took from the toolkit's classes, not from the drawing.
        meaning: rp:ReportKindToolkitFilled
      toolkit_slot_kept:
        title: Toolkit slot kept
        description: An attribute that stood for a toolkit slot and was replaced by it.
        meaning: rp:ReportKindToolkitSlotKept
      ignored_tag:
        title: Ignored tag
        description: A tagged value no rule uses.
        meaning: rp:ReportKindIgnoredTag
      ignored_stereotype:
        title: Ignored stereotype
        description: A stereotype no rule uses.
        meaning: rp:ReportKindIgnoredStereotype
      merged_cycle:
        title: Merged cycle
        description: Packages that import each other, merged into one module.
        meaning: rp:ReportKindMergedCycle
      stale_file:
        title: Stale file
        description: A file of an earlier run left in the output folder, which this run did not write.
        meaning: rp:ReportKindStaleFile
      external_list:
        title: External list
        description: An enumeration with no literals, a list kept outside the model, so its slots range over a URI.
        meaning: rp:ReportKindExternalList
      unspecified_multiplicity:
        title: Unspecified multiplicity
        description: A connector end with no multiplicity, read as zero or more.
        meaning: rp:ReportKindUnspecifiedMultiplicity
  UmlRule:
    title: UML rule
    description: >-
      The rules of the UML conversion, one value for each rule of the design's rule table that is in
      force; a problem names the one it breaks. `no_rule` stands for an element no rule maps.
    permissible_values:
      no_rule:
        title: No rule
        description: An element of the model that no rule maps; the run fails.
        meaning: rp:UmlRuleNoRule
      package_module:
        title: Package module
        description: R-1, a package becomes a module of the root schema.
        meaning: rp:UmlRulePackageModule
      class_iri:
        title: Class IRI
        description: R-2, a class `pfx:Name` becomes a class `Name` with that IRI.
        meaning: rp:UmlRuleClassIri
      abstract_class:
        title: Abstract class
        description: R-3, an abstract class becomes an abstract class.
        meaning: rp:UmlRuleAbstractClass
      generalisation:
        title: Generalisation
        description: R-4, a generalisation becomes `is_a` for the first parent and mixins for the others.
        meaning: rp:UmlRuleGeneralisation
      attribute_slot:
        title: Attribute slot
        description: R-5, an attribute becomes a slot with its IRI, range, required and multivalued.
        meaning: rp:UmlRuleAttributeSlot
      association_slot:
        title: Association slot
        description: R-6, an association becomes a slot on its source whose range is its destination.
        meaning: rp:UmlRuleAssociationSlot
      enumeration:
        title: Enumeration
        description: R-7, an enumeration becomes an enum, its literals permissible values.
        meaning: rp:UmlRuleEnumeration
      dependency_enum_slot:
        title: Dependency enum slot
        description: R-8, a dependency on an enumeration becomes a slot ranged by that enum.
        meaning: rp:UmlRuleDependencyEnumSlot
      notes_description:
        title: Notes description
        description: R-9, the notes of a class, an attribute or a connector become descriptions.
        meaning: rp:UmlRuleNotesDescription
      root_class:
        title: Root class
        description: R-10, a root class gets the aggregate-root mixin and a path.
        meaning: rp:UmlRuleRootClass
      boundary_owned:
        title: Boundary owned
        description: R-11, the classes of a boundary or a composite association are owned by the root.
        meaning: rp:UmlRuleBoundaryOwned
      not_generated:
        title: Not generated
        description: R-12, a stereotype listed as not generated makes no class and is reported.
        meaning: rp:UmlRuleNotGenerated
      shared_slot:
        title: Shared slot
        description: R-13, one slot name and IRI on several classes make one shared slot.
        meaning: rp:UmlRuleSharedSlot
      toolkit_slot:
        title: Toolkit slot
        description: R-15 and R-22, an attribute whose IRI a toolkit slot has is that slot; a `dct:identifier` is the new identifier slot.
        meaning: rp:UmlRuleToolkitSlot
      tenant_root:
        title: Tenant root
        description: R-18, a tenant root is stored in the meta graph and is no aggregate root.
        meaning: rp:UmlRuleTenantRoot
      title:
        title: Title
        description: R-19, a class or a slot with no title gets its name split into words.
        meaning: rp:UmlRuleTitle
      class_annotation:
        title: Class annotation
        description: R-20, a tagged value named like a toolkit class annotation becomes that annotation.
        meaning: rp:UmlRuleClassAnnotation
      unique_key:
        title: Unique key
        description: R-21, a `unique_key` tagged value becomes a unique key of the class.
        meaning: rp:UmlRuleUniqueKey
      abstract_root:
        title: Abstract root
        description: R-23, an abstract class of roots that is a slot's range is an aggregate root with no path.
        meaning: rp:UmlRuleAbstractRoot
      shared_slot_across_packages:
        title: Shared slot across packages
        description: R-24, a slot on classes of several packages is defined once in the module the others import.
        meaning: rp:UmlRuleSharedSlotAcrossPackages
      toolkit_mixins:
        title: Toolkit mixins
        description: R-25 to R-28, the default mixins, `rp_mixins`, `workflow` and a drawn toolkit parent.
        meaning: rp:UmlRuleToolkitMixins
      left_out_link:
        title: Left-out link
        description: R-29, a link to a class that is not generated, or to an excluded package, is left out and reported.
        meaning: rp:UmlRuleLeftOutLink
      activity_root:
        title: Activity root
        description: A root class that is an activity, which the toolkit's rules do not allow.
        meaning: rp:UmlRuleActivityRoot
