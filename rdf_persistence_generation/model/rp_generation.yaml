id: https://meaningfy.ws/ns/rdf-persistence/generation
name: rp_generation
title: RDF persistence generation module
description: >-
  The data of the generation toolchain: the configuration of one `rp-generate` run, the manifest it
  writes, the files and problems it produces, the view-models its templates render and the
  conformance cases.
prefixes:
  rp: https://meaningfy.ws/ns/rdf-persistence#
  linkml: https://w3id.org/linkml/
default_prefix: rp
default_range: string
imports:
  - linkml:types
annotations:
  module_kind: technical
  python_package: rdf_persistence_generation.generated

classes:
  GenerationTarget:
    title: Generation target
    description: >-
      One entry of the `[tool.rp-generate]` table of a `pyproject.toml`: a schema and the folders its
      generated artefacts are written to. Paths are relative to the folder of the `pyproject.toml`.
    class_uri: rp:GenerationTarget
    slots:
      - schema_file
      - package
      - python
      - typescript
      - toolkit_typescript
      - diagrams
      - openapi
      - regenerate_command
      - migrations
    slot_usage:
      schema_file:
        required: true
      package:
        required: true

  SchemaLock:
    title: Schema lock
    description: >-
      The RDF-facing summary of what a target stores, at one schema version: its stored classes and
      the enums they use. Committed as `schema.lock.json` in the target's migrations folder, so a
      change to what is stored is compared with it.
    class_uri: rp:SchemaLock
    slots:
      - schema_id
      - schema_version
      - locked_classes
      - locked_enums
    slot_usage:
      schema_id:
        required: true
      schema_version:
        required: true

  LockedClass:
    title: Locked class
    description: A stored class as the lock records it, with its IRI, the type and path of a root, and its slots.
    class_uri: rp:LockedClass
    slots:
      - class_uri
      - iri_type
      - root_path
      - root_database
      - locked_slots
    slot_usage:
      class_uri:
        required: true

  LockedSlot:
    title: Locked slot
    description: A slot of a stored class as the lock records it, by its IRI.
    class_uri: rp:LockedSlot
    slots:
      - slot_uri
      - range
      - required
      - multivalued
      - inlined
    slot_usage:
      slot_uri:
        required: true
      range:
        required: true
        description: The IRI of the slot's range; the name of the enum when the range is an enum.

  LockedEnum:
    title: Locked enum
    description: An enum used as a range, with the `meaning` IRI of each value (its text when it has none).
    class_uri: rp:LockedEnum
    slots:
      - name
      - enum_values
    slot_usage:
      name:
        required: true

  LockChange:
    title: Lock change
    description: >-
      One difference between two locks: the rule that treats it, a sentence, and what it is about (a
      class and a slot, or an enum and a value).
    class_uri: rp:LockChange
    slots:
      - rule
      - what
      - class_uri
      - slot_uri
      - enum_name
      - enum_value
    slot_usage:
      rule:
        required: true
        range: LockRule
        description: How the change is treated, by the table of the schema lock.
      what:
        required: true
        description: What changed, as a sentence.

  ManifestEntry:
    title: Manifest entry
    description: A file and the SHA-256 of its bytes, as recorded by a generation run.
    class_uri: rp:ManifestEntry
    slots:
      - path
      - sha256
    slot_usage:
      path:
        required: true
      sha256:
        required: true
  GenerationManifest:
    title: Generation manifest
    description: >-
      What one generation run read and wrote: the installed `linkml` version, the files it read and
      the files it wrote. Written as `rp-manifest.json` in the target's Python folder.
    class_uri: rp:GenerationManifest
    slots:
      - linkml
      - inputs
      - outputs
    slot_usage:
      linkml:
        required: true
  ConstraintCase:
    title: Constraint case
    description: >-
      One row of the conformance table: a constraint kind, a class that declares it, and the instance
      files the generated class and shape must accept and refuse.
    class_uri: rp:ConstraintCase
    slots:
      - kind
      - class_name
      - valid
      - invalid
    slot_usage:
      kind:
        required: true
      class_name:
        required: true
  CliFlag:
    title: Command-line flag
    description: A command-line flag of `rp-generate` and the GenerationTarget field it overrides.
    class_uri: rp:CliFlag
    slots:
      - option
      - field
    slot_usage:
      option:
        required: true
      field:
        required: true
  GeneratedFile:
    title: Generated file
    description: One file a generator renders, its name inside the target folder and its text.
    class_uri: rp:GeneratedFile
    slots:
      - name
      - text
    slot_usage:
      name:
        required: true
      text:
        required: true
  CheckProblem:
    title: Check problem
    description: >-
      One problem a check, a pipeline step or the freshness comparison found, with where and by which
      rule. Only the command line formats it for the developer.
    class_uri: rp:CheckProblem
    slots:
      - rule
      - element
      - message
      - schema_file
      - step
    slot_usage:
      message:
        required: true
  UmlModel:
    title: UML model
    description: >-
      What the UML reader takes from a model file: the packages, the classes and enumerations with
      their attributes, the connectors, the tagged values and the boundaries. The converter reads
      nothing else.
    class_uri: rp:UmlModel
    slots:
      - uml_packages
      - uml_outside_packages
      - uml_classes
      - uml_outside_classes
      - uml_links
      - uml_tagged_values
      - uml_boundaries
      - uml_compositions
      - uml_diagrams
      - uml_objects
      - uml_state_nodes
      - uml_state_flows
      - uml_statecharts
  UmlPackage:
    title: UML package
    description: >-
      A package of the UML model, with its parent, so the package tree can be rebuilt, and the object
      that draws it, which owns its tagged values.
    class_uri: rp:UmlPackage
    slots:
      - package_id
      - name
      - parent_id
      - note
      - object_id
    slot_usage:
      package_id:
        required: true
      name:
        required: true
  UmlClass:
    title: UML class
    description: >-
      A class or an enumeration of the UML model. For an enumeration the attributes are its literals.
    class_uri: rp:UmlClass
    slots:
      - object_id
      - name
      - object_type
      - uml_alias
      - note
      - package_id
      - uml_stereotype
      - multiple_stereotypes
      - is_abstract
      - ea_guid
      - uml_attributes
    slot_usage:
      object_id:
        required: true
      name:
        required: true
      object_type:
        required: true
      package_id:
        required: true
  UmlAttribute:
    title: UML attribute
    description: An attribute of a UML class, or a literal of a UML enumeration.
    class_uri: rp:UmlAttribute
    slots:
      - attribute_id
      - owner_id
      - name
      - note
      - declared_type
      - classifier_id
      - lower_bound
      - upper_bound
      - position
      - uml_stereotype
    slot_usage:
      attribute_id:
        required: true
      owner_id:
        required: true
      name:
        required: true
  UmlLink:
    title: UML link
    description: >-
      A connector of the UML model: an association, a dependency or a generalisation, from its source
      class to its target class. Roles and cardinalities are those of each end; an end is the whole
      of an aggregation when its aggregate flag is set.
    class_uri: rp:UmlLink
    slots:
      - connector_id
      - link_kind
      - sub_type
      - uml_stereotype
      - note
      - source_id
      - target_id
      - source_role
      - source_card
      - source_aggregate
      - target_role
      - target_card
      - target_aggregate
      - association_class
      - direction
    slot_usage:
      connector_id:
        required: true
      link_kind:
        required: true
      source_id:
        required: true
      target_id:
        required: true
  UmlTaggedValue:
    title: UML tagged value
    description: A named value attached to a class of the UML model, its text resolved from the memo when it is one.
    class_uri: rp:UmlTaggedValue
    slots:
      - owner_id
      - name
      - tag_value
    slot_usage:
      owner_id:
        required: true
      name:
        required: true
  UmlBoundary:
    title: UML boundary
    description: >-
      A boundary drawn on a diagram, with the classes and enumerations whose rectangles lie wholly
      inside it.
    class_uri: rp:UmlBoundary
    slots:
      - object_id
      - name
      - diagram_id
      - member_ids
    slot_usage:
      object_id:
        required: true
      name:
        required: true
      diagram_id:
        required: true
  UmlComposition:
    title: UML composition
    description: >-
      A composition of the UML model, read once from the end columns of an Aggregation connector
      (PD-1): the class that is the whole and the class that is the part, whatever way it was drawn,
      with the stereotype and the role written on it.
    class_uri: rp:UmlComposition
    slots:
      - composition_id
      - whole_id
      - part_id
      - own_graph
      - uml_stereotype
      - role
    slot_usage:
      composition_id:
        required: true
      whole_id:
        required: true
      part_id:
        required: true
  UmlDiagram:
    title: UML diagram
    description: >-
      A class diagram of the UML model, read by membership only (PD-12): the package it sits in, the
      elements it shows and the connectors it hides. No geometry.
    class_uri: rp:UmlDiagram
    slots:
      - diagram_id
      - name
      - package_id
      - diagram_type
      - element_ids
      - hidden_connector_ids
    slot_usage:
      diagram_id:
        required: true
      name:
        required: true
  UmlPartOf:
    title: UML part of
    description: >-
      One row of the aggregate tree (PD-19): a class that is a part, the class that is its whole, the
      composition that says so and whether that composition is an own graph. A part with two wholes
      has two rows.
    class_uri: rp:UmlPartOf
    slots:
      - part_id
      - whole_id
      - own_graph
      - composition_id
    slot_usage:
      part_id:
        required: true
      whole_id:
        required: true
      composition_id:
        required: true
  UmlReach:
    title: UML reach
    description: >-
      The tops of the aggregates that reach one part class (PD-4): a part class may be reached from
      several tops.
    class_uri: rp:UmlReach
    slots:
      - part_id
      - top_ids
    slot_usage:
      part_id:
        required: true
  UmlOwnedEnd:
    title: UML owned end
    description: >-
      A connector end that gives an owned slot (PD-5): the connector and the class that holds the slot.
    class_uri: rp:UmlOwnedEnd
    slots:
      - link_id
      - holder_id
    slot_usage:
      link_id:
        required: true
      holder_id:
        required: true
  UmlAggregates:
    title: UML aggregates
    description: >-
      What the aggregate pass returns (PD-19): the derived roots, the tenant root, the tree as rows of
      parts and wholes, the tops that reach each part, the owned ends, the classes left inside an own
      graph, and the findings, which the converter merges into its own.
    class_uri: rp:UmlAggregates
    slots:
      - root_ids
      - tenant_root_id
      - part_of
      - reached_from
      - owned_ends
      - left_inside_ids
      - problems
      - report_lines
  UmlObject:
    title: UML object
    description: >-
      An object of the UML model, an instance of a drawn class, with the class that types it, the
      package it sits in and the values its run state sets, as the model file writes them.
    class_uri: rp:UmlObject
    slots:
      - object_id
      - uml_name
      - classifier_id
      - realised_ids
      - package_path
      - run_values
      - run_state_rest
    slot_usage:
      object_id:
        required: true
      uml_name:
        required: true
  UmlStateNode:
    title: UML state node
    description: >-
      A state or a state node of the UML model, with the kind the reader recognises (a state, or the
      initial node) and the type the file gives a state node, so the workflow rule can refuse any other.
    class_uri: rp:UmlStateNode
    slots:
      - object_id
      - uml_name
      - node_kind
      - node_type
      - note
    slot_usage:
      object_id:
        required: true
      uml_name:
        required: true
  UmlStateFlow:
    title: UML state flow
    description: >-
      A transition of the UML model between two state nodes of the converted packages, with its tags
      as the model file writes them.
    class_uri: rp:UmlStateFlow
    slots:
      - connector_id
      - source_id
      - target_id
      - uml_tagged_values
    slot_usage:
      connector_id:
        required: true
      source_id:
        required: true
      target_id:
        required: true
  UmlStatechart:
    title: UML statechart
    description: >-
      A Statechart diagram of the UML model, with the package it sits in and the state nodes placed
      on it.
    class_uri: rp:UmlStatechart
    slots:
      - diagram_id
      - uml_name
      - package_path
      - node_ids
    slot_usage:
      diagram_id:
        required: true
      uml_name:
        required: true
  UmlRunValue:
    title: UML run value
    description: >-
      One variable a UML object's run state sets: its name, its value and its operator, as written.
    class_uri: rp:UmlRunValue
    slots:
      - variable
      - value
      - operator
  UmlPrefix:
    title: UML prefix
    description: One prefix of the prefixes file and the namespace it stands for.
    class_uri: rp:UmlPrefix
    slots:
      - prefix_name
      - namespace
    slot_usage:
      prefix_name:
        required: true
      namespace:
        required: true
  UmlName:
    title: UML name
    description: >-
      A written name resolved (PD-6): its local name and, when it was prefixed, the IRI it expands to and
      the CURIE written to the output.
    class_uri: rp:UmlName
    slots:
      - name
      - iri
      - curie
    slot_usage:
      name:
        required: true
  UmlSettings:
    title: UML settings
    description: >-
      What one run of the UML converter is told: the keys of the prefixes file and the command line
      values the conversion depends on.
    class_uri: rp:UmlSettings
    slots:
      - schema_base
      - default_prefix
      - schema_version
      - prefixes
      - subtree_package
      - root_name
      - exclude_packages
      - default_mixins
      - not_generated_stereotypes
    slot_usage:
      schema_base:
        required: true
      default_prefix:
        required: true
      schema_version:
        required: true
      subtree_package:
        required: true
      root_name:
        required: true
  UmlElement:
    title: UML element
    description: >-
      A class or an enumeration the conversion generates: the UML class it was read from, its resolved
      name, where its package sits and what the conversion has classified it as (PD-17, R-18, R-23).
    class_uri: rp:UmlElement
    slots:
      - uml_class
      - resolved_name
      - label
      - module_path
      - is_enum
      - is_drawn_root
      - is_root
      - is_abstract
      - is_tenant_root
      - is_abstract_root
    slot_usage:
      uml_class:
        required: true
      resolved_name:
        required: true
      label:
        required: true
      is_abstract:
        ifabsent: "false"
  UmlPackagePath:
    title: UML package path
    description: >-
      Where a package sits: its names below the subtree package, whether an exclusion covers it, and
      its note.
    class_uri: rp:UmlPackagePath
    slots:
      - below
      - is_excluded
      - note
  UmlLinkEnd:
    title: UML link end
    description: >-
      One end of a connector that may become a slot: the class that holds it, the one it points at, and
      the role and cardinality written at that end.
    class_uri: rp:UmlLinkEnd
    slots:
      - holder_id
      - other_id
      - end_role
      - end_card
      - owned_by_composite
    slot_usage:
      holder_id:
        required: true
      other_id:
        required: true
  ReportLine:
    title: Report line
    description: One line of the report a conversion writes beside its output, saying what was left out or changed.
    class_uri: rp:ReportLine
    slots:
      - report_kind
      - element
      - message
    slot_usage:
      report_kind:
        required: true
      element:
        required: true
      message:
        required: true
  ModuleCycle:
    title: Module cycle
    description: A group of two or more generated modules that import each other.
    class_uri: rp:ModuleCycle
    slots:
      - modules
    slot_usage:
      modules:
        required: true
  ModuleDeferral:
    title: Module deferral
    description: >-
      The names a module of a cycle imports from another module of its cycle without needing them
      while it loads, so the import can wait for the type checker.
    class_uri: rp:ModuleDeferral
    slots:
      - module
      - source_module
      - names
    slot_usage:
      module:
        required: true
      source_module:
        required: true
      names:
        required: true
  CycleAnalysis:
    title: Cycle analysis
    description: >-
      What the modules of a target need in order to load: the groups that import each other, and per
      module of a group the names it defers.
    class_uri: rp:CycleAnalysis
    slots:
      - cycles
      - deferrals
  PresenceRule:
    title: Presence rule
    description: A class-level rule over alternatives, and when its validator refuses.
    class_uri: rp:PresenceRule
    slots:
      - name
      - need
      - refused
    slot_usage:
      name:
        required: true
      need:
        required: true
      refused:
        required: true
  RuleAlternative:
    title: Rule alternative
    description: One alternative of a rule, its readable label and the Python expression that tells it holds.
    class_uri: rp:RuleAlternative
    slots:
      - label
      - holds
    slot_usage:
      label:
        required: true
      holds:
        required: true
  UniqueKeyOn:
    title: Unique key on a slot
    description: >-
      A unique key that a class's multivalued slot is subject to, with the IRIs the constraint query
      needs.
    class_uri: rp:UniqueKeyOn
    slots:
      - name
      - slot_iri
      - key_name
      - description
      - key_iris
    slot_usage:
      name:
        required: true
      slot_iri:
        required: true
      key_name:
        required: true
      key_iris:
        required: true
  Frame:
    title: Frame
    description: A JSON-LD frame, the types it selects, its references and the frames of its owned parts.
    class_uri: rp:Frame
    slots:
      - type_terms
      - references
      - parts
    slot_usage:
      type_terms:
        required: true
      references:
        required: true
      parts:
        required: true
  FramePart:
    title: Frame part
    description: The frame of the parts nested in one owned slot of a frame.
    class_uri: rp:FramePart
    slots:
      - name
      - frame
    slot_usage:
      name:
        required: true
      frame:
        required: true
  TsField:
    title: TypeScript field
    description: A field of a TypeScript interface.
    class_uri: rp:TsField
    slots:
      - name
      - type
      - optional
      - doc
    slot_usage:
      name:
        required: true
      type:
        required: true
      optional:
        required: true
      doc:
        required: true
  TsInterface:
    title: TypeScript interface
    description: A TypeScript interface and its fields.
    class_uri: rp:TsInterface
    slots:
      - name
      - doc
      - fields
    slot_usage:
      name:
        required: true
      doc:
        required: true
      fields:
        required: true
  TsEnumValue:
    title: TypeScript enum value
    description: A string literal of a TypeScript union type.
    class_uri: rp:TsEnumValue
    slots:
      - literal
      - doc
    slot_usage:
      literal:
        required: true
      doc:
        required: true
  TsEnum:
    title: TypeScript enum
    description: A union of string literals that stands for an enum of the schema.
    class_uri: rp:TsEnum
    slots:
      - name
      - doc
      - values
    slot_usage:
      name:
        required: true
      doc:
        required: true
      values:
        required: true
  TsImport:
    title: TypeScript import
    description: The names a TypeScript module imports from another module.
    class_uri: rp:TsImport
    slots:
      - module
      - names
    slot_usage:
      module:
        required: true
        description: >-
          The name of the module to import, or, for a module another target writes as TypeScript,
          its path relative to the importing file's folder (it starts with a dot).
      names:
        required: true
  TsModule:
    title: TypeScript module
    description: One TypeScript file, for one module of the schema.
    class_uri: rp:TsModule
    slots:
      - name
      - enums
      - interfaces
      - imports
    slot_usage:
      name:
        required: true
      enums:
        required: true
      interfaces:
        required: true
      imports:
        required: true
  MmdAttribute:
    title: Mermaid attribute
    description: An attribute line of a Mermaid class box.
    class_uri: rp:MmdAttribute
    slots:
      - type
      - name
    slot_usage:
      type:
        required: true
      name:
        required: true
  MmdClass:
    title: Mermaid class
    description: One class box of a Mermaid diagram.
    class_uri: rp:MmdClass
    slots:
      - name
      - stereotype
      - attributes
    slot_usage:
      name:
        required: true
      attributes:
        required: true
  MmdModule:
    title: Mermaid module
    description: One Mermaid class diagram, for one module of the schema.
    class_uri: rp:MmdModule
    slots:
      - classes
      - links
      - externals
    slot_usage:
      classes:
        required: true
      links:
        required: true
      externals:
        required: true

slots:
  relative_path:
    title: Relative path
    description: >-
      A POSIX path below the folder of the `pyproject.toml`: not absolute, with no drive letter, no
      backslash, no empty segment and no `.` or `..` segment, so it cannot leave the project.
    slot_uri: rp:relativePath
    abstract: true
    pattern: '^(?:[^/:\\.\x00-\x1f\x7f][^/:\\\x00-\x1f\x7f]*|\.[^/:\\.\x00-\x1f\x7f][^/:\\\x00-\x1f\x7f]*|\.\.[^/:\\\x00-\x1f\x7f]+)(?:/(?:[^/:\\.\x00-\x1f\x7f][^/:\\\x00-\x1f\x7f]*|\.[^/:\\.\x00-\x1f\x7f][^/:\\\x00-\x1f\x7f]*|\.\.[^/:\\\x00-\x1f\x7f]+))*$'
  schema_file:
    is_a: relative_path
    title: Schema file
    description: >-
      The root LinkML schema file; the TOML key and the flag are `schema`, its alias: the field keeps
      the slot's name, which does not shadow a pydantic method.
    slot_uri: rp:schemaFile
    alias: schema
    annotations:
      cli_flag: --schema
      field_name: slot
  package:
    title: Package
    description: The Python import path of the generated package, a dotted identifier.
    slot_uri: rp:package
    annotations:
      cli_flag: --package
    pattern: '^[A-Za-z_][A-Za-z0-9_]*(?:\.[A-Za-z_][A-Za-z0-9_]*)*$'
  python:
    is_a: relative_path
    title: Python folder
    description: >-
      The folder that receives the classes, shapes, context, frames and the schema copy; the folder of
      `package` when absent.
    slot_uri: rp:pythonFolder
    annotations:
      cli_flag: --python-out
  typescript:
    is_a: relative_path
    title: TypeScript folder
    description: The folder that receives the TypeScript types; none are written when absent.
    slot_uri: rp:typescriptFolder
    annotations:
      cli_flag: --typescript-out
  toolkit_typescript:
    title: Toolkit TypeScript owner
    description: >-
