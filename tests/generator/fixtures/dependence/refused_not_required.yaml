id: https://example.org/ns/dependence/refused_not_required
name: refused_not_required
title: Refused, the pointer is not required
description: The pointer slot of the dependent class is optional.
prefixes:
  dep: https://example.org/ns/dependence#
  linkml: https://w3id.org/linkml/
default_prefix: dep
default_range: string
imports:
  - linkml:types
  - rdf_persistence/model/rp_core
  - rdf_persistence/model/rp_annotations
annotations:
  module_kind: domain

classes:
  Run:
    description: The whole, a served root.
    mixins: [AggregateRoot]
    annotations:
      rp_path: runs
  Result:
    description: The part.
    mixins: [AggregateRoot]
    slots: [run]
    annotations:
      rp_path: results
      rp_dependent_on: run

slots:
  run:
    description: The run the result belongs to; wrongly optional.
    range: Run
