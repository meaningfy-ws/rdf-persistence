id: https://example.org/ns/dependence/refused_on_non_root
name: refused_on_non_root
title: Refused, the annotation is on a class that is no root
description: The annotation sits on a class owned by a root, which is stored inside that root's graph.
prefixes:
  dep: https://example.org/ns/dependence#
  linkml: https://w3id.org/linkml/
default_prefix: dep
default_range: string
imports:
  - linkml:types
  - rdf_persistence/model/rp_core
  - rdf_persistence/model/rp_annotations
annotations:
  module_kind: domain

classes:
  Run:
    description: The whole, a served root that owns its notes.
    mixins: [AggregateRoot]
    slots: [notes]
    annotations:
      rp_path: runs
  Note:
    description: An owned class, wrongly annotated as dependent.
    slots: [run]
    annotations:
      rp_dependent_on: run

slots:
  notes:
    description: The notes the run owns.
    range: Note
    multivalued: true
    inlined_as_list: true
    annotations:
      owned: true
  run:
    description: A slot over a run.
    range: Run
    required: true
