id: https://example.org/ns/dependence/refused_relaxed_by_slot_usage
name: refused_relaxed_by_slot_usage
title: Refused, a concrete subclass relaxes required
description: The abstract base requires the pointer, and a concrete subclass makes it optional by slot_usage.
prefixes:
  dep: https://example.org/ns/dependence#
  linkml: https://w3id.org/linkml/
default_prefix: dep
default_range: string
imports:
  - linkml:types
  - rdf_persistence/model/rp_core
  - rdf_persistence/model/rp_annotations
annotations:
  module_kind: domain

classes:
  Run:
    description: The whole, a served root.
    mixins: [AggregateRoot]
    annotations:
      rp_path: runs
  Output:
    description: An abstract dependent base.
    abstract: true
    mixins: [AggregateRoot]
    slots: [run]
    annotations:
      rp_dependent_on: run
  Metric:
    description: A kind of output that keeps the pointer required.
    is_a: Output
    annotations:
      rp_path: metrics
  Artefact:
    description: A kind of output that relaxes the pointer.
    is_a: Output
    slot_usage:
      run:
        required: false
    annotations:
      rp_path: artefacts

slots:
  run:
    description: The run the output belongs to.
    range: Run
    required: true
