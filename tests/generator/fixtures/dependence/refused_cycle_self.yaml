id: https://example.org/ns/dependence/refused_cycle_self
name: refused_cycle_self
title: Refused, A depends on A
description: A root whose pointer ranges over its own class.
prefixes:
  dep: https://example.org/ns/dependence#
  linkml: https://w3id.org/linkml/
default_prefix: dep
default_range: string
imports:
  - linkml:types
  - rdf_persistence/model/rp_core
  - rdf_persistence/model/rp_annotations
annotations:
  module_kind: domain

classes:
  Node:
    description: Depends on a node.
    mixins: [AggregateRoot]
    slots: [parent]
    annotations:
      rp_path: nodes
      rp_dependent_on: parent

slots:
  parent:
    description: The node this node belongs to.
    range: Node
    required: true
