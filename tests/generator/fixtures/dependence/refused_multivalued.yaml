id: https://example.org/ns/dependence/refused_multivalued
name: refused_multivalued
title: Refused, the pointer is multivalued
description: The pointer slot of the dependent class holds several values.
prefixes:
  dep: https://example.org/ns/dependence#
  linkml: https://w3id.org/linkml/
default_prefix: dep
default_range: string
imports:
  - linkml:types
  - rdf_persistence/model/rp_core
  - rdf_persistence/model/rp_annotations
annotations:
  module_kind: domain

classes:
  Run:
    description: The whole, a served root.
    mixins: [AggregateRoot]
    annotations:
      rp_path: runs
  Result:
    description: The part.
    mixins: [AggregateRoot]
    slots: [runs]
    annotations:
      rp_path: results
      rp_dependent_on: runs

slots:
  runs:
    description: The runs the result belongs to; wrongly several.
    range: Run
    required: true
    multivalued: true
