id: https://example.org/ns/dependence/ok_served_root
name: ok_served_root
title: Accepted, a pointer over a served root
description: A part whose required, single-valued pointer ranges over a served root.
prefixes:
  dep: https://example.org/ns/dependence#
  linkml: https://w3id.org/linkml/
default_prefix: dep
default_range: string
imports:
  - linkml:types
  - rdf_persistence/model/rp_core
  - rdf_persistence/model/rp_annotations
annotations:
  module_kind: domain

classes:
  Run:
    description: The whole, a served root.
    mixins: [AggregateRoot]
    annotations:
      rp_path: runs
  Result:
    description: The part, a served root that depends on a run.
    mixins: [AggregateRoot]
    slots: [run]
    annotations:
      rp_path: results
      rp_dependent_on: run

slots:
  run:
    description: The run the result belongs to.
    range: Run
    required: true
