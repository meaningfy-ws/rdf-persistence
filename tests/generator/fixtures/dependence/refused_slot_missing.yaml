id: https://example.org/ns/dependence/refused_slot_missing
name: refused_slot_missing
title: Refused, the named slot is not on the class
description: The annotation names a slot the class does not have.
prefixes:
  dep: https://example.org/ns/dependence#
  linkml: https://w3id.org/linkml/
default_prefix: dep
default_range: string
imports:
  - linkml:types
  - rdf_persistence/model/rp_core
  - rdf_persistence/model/rp_annotations
annotations:
  module_kind: domain

classes:
  Run:
    description: The whole, a served root.
    mixins: [AggregateRoot]
    annotations:
      rp_path: runs
  Result:
    description: The part, whose annotation names the slot owner, which it lacks.
    mixins: [AggregateRoot]
    slots: [run]
    annotations:
      rp_path: results
      rp_dependent_on: owner

slots:
  run:
    description: A slot over a run, not the one the annotation names.
    range: Run
    required: true
