id: https://example.org/ns/dependence/ok_abstract_range
name: ok_abstract_range
title: Accepted, a pointer over an abstract root
description: The pointer ranges over an abstract root whose concrete subclasses are all served roots.
prefixes:
  dep: https://example.org/ns/dependence#
  linkml: https://w3id.org/linkml/
default_prefix: dep
default_range: string
imports:
  - linkml:types
  - rdf_persistence/model/rp_core
  - rdf_persistence/model/rp_annotations
annotations:
  module_kind: domain

classes:
  Job:
    description: An abstract root, never served itself.
    abstract: true
    mixins: [AggregateRoot]
  BatchJob:
    description: A served kind of job.
    is_a: Job
    annotations:
      rp_path: batch-jobs
  StreamJob:
    description: Another served kind of job.
    is_a: Job
    annotations:
      rp_path: stream-jobs
  Result:
    description: The part, depending on any kind of job.
    mixins: [AggregateRoot]
    slots: [job]
    annotations:
      rp_path: results
      rp_dependent_on: job

slots:
  job:
    description: The job the result belongs to.
    range: Job
    required: true
