id: https://example.org/ns/dependence/refused_over_toolkit_written_root
name: refused_over_toolkit_written_root
title: Refused, the pointer ranges over a root the toolkit writes
description: The pointer ranges over a root annotated rp_writes toolkit, which no route serves.
prefixes:
  dep: https://example.org/ns/dependence#
  linkml: https://w3id.org/linkml/
default_prefix: dep
default_range: string
imports:
  - linkml:types
  - rdf_persistence/model/rp_core
  - rdf_persistence/model/rp_annotations
annotations:
  module_kind: domain

classes:
  Ledger:
    description: A root the toolkit writes itself.
    mixins: [AggregateRoot]
    annotations:
      rp_path: ledgers
      rp_writes: toolkit
  Result:
    description: The part.
    mixins: [AggregateRoot]
    slots: [ledger]
    annotations:
      rp_path: results
      rp_dependent_on: ledger

slots:
  ledger:
    description: The ledger the result belongs to; wrongly toolkit-written.
    range: Ledger
    required: true
