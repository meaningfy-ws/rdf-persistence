id: https://example.org/ns/dependence/refused_cycle_two
name: refused_cycle_two
title: Refused, A depends on B and B on A
description: Two roots depend on each other.
prefixes:
  dep: https://example.org/ns/dependence#
  linkml: https://w3id.org/linkml/
default_prefix: dep
default_range: string
imports:
  - linkml:types
  - rdf_persistence/model/rp_core
  - rdf_persistence/model/rp_annotations
annotations:
  module_kind: domain

classes:
  Alpha:
    description: Depends on Beta.
    mixins: [AggregateRoot]
    slots: [beta]
    annotations:
      rp_path: alphas
      rp_dependent_on: beta
  Beta:
    description: Depends on Alpha.
    mixins: [AggregateRoot]
    slots: [alpha]
    annotations:
      rp_path: betas
      rp_dependent_on: alpha

slots:
  alpha:
    description: The alpha the beta belongs to.
    range: Alpha
    required: true
  beta:
    description: The beta the alpha belongs to.
    range: Beta
    required: true
