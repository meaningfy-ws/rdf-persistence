id: https://example.org/ns/dependence/ignored_mixin_annotation
name: ignored_mixin_annotation
title: The annotation of a mixin is not inherited
description: A served root mixes in a class that carries the annotation; the root is not dependent, so it needs no pointer slot.
prefixes:
  dep: https://example.org/ns/dependence#
  linkml: https://w3id.org/linkml/
default_prefix: dep
default_range: string
imports:
  - linkml:types
  - rdf_persistence/model/rp_core
  - rdf_persistence/model/rp_annotations
annotations:
  module_kind: domain

classes:
  Run:
    description: The whole, a served root.
    mixins: [AggregateRoot]
    annotations:
      rp_path: runs
  Tagged:
    description: A mixin that carries the annotation, which only the check of its own placement reads.
    mixin: true
    annotations:
      rp_dependent_on: run
  Memo:
    description: A served root that mixes in Tagged and has no pointer slot of its own.
    mixins: [AggregateRoot, Tagged]
    annotations:
      rp_path: memos

slots:
  run:
    description: The run a tagged class belongs to.
    range: Run
    required: true
