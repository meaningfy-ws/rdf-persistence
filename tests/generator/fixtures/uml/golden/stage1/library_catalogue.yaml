name: library_catalogue
annotations:
  module_kind:
    tag: module_kind
    value: domain
description: What the library holds.
title: Catalogue
id: https://example.org/ns/library/library_catalogue
imports:
- linkml:types
- rdf_persistence/model/rp_annotations
- rdf_persistence/model/rp_core
- library_shelves
prefixes:
  dcterms:
    prefix_prefix: dcterms
    prefix_reference: http://purl.org/dc/terms/
  lib:
    prefix_prefix: lib
    prefix_reference: https://example.org/ns/library#
  linkml:
    prefix_prefix: linkml
    prefix_reference: https://w3id.org/linkml/
default_prefix: lib
default_range: string
enums:
  Genre:
    name: Genre
    description: The kinds of book.
    title: Genre
    permissible_values:
      fiction:
        text: fiction
        description: Invented stories.
        meaning: lib:fiction
        title: Fiction
      poetry:
        text: poetry
        meaning: lib:poetry
        title: Poetry
slots:
  authority:
    name: authority
    description: The authority that names it.
    title: Authority
    slot_uri: lib:authority
    range: uri
  genre:
    name: genre
    description: The kind of the book.
    title: Genre
    slot_uri: lib:genre
    range: Genre
    multivalued: true
  has_chapter:
    name: has_chapter
    annotations:
      owned:
        tag: owned
        value: 'true'
    description: The chapters of the book.
    title: Has chapter
    slot_uri: lib:hasChapter
    range: Chapter
    required: true
    multivalued: true
    inlined_as_list: true
  heading:
    name: heading
    description: The heading of the chapter.
    title: Heading
    slot_uri: lib:heading
    range: string
    required: true
  issn:
    name: issn
    description: Its ISSN.
    title: Issn
    slot_uri: lib:issn
    range: string
  issued:
    name: issued
    description: When it was issued.
    title: Issued
    slot_uri: lib:issued
    range: date
  language:
    name: language
    description: The languages it is in.
    title: Language
    slot_uri: lib:language
    range: uri
    multivalued: true
  pages:
    name: pages
    description: Its page count.
    title: Pages
    slot_uri: lib:pages
    range: integer
    minimum_value: 0
  related_work:
    name: related_work
    description: A work elsewhere it relates to.
    title: Related work
    slot_uri: lib:relatedWork
    range: uri
    multivalued: true
  shelved_on:
    name: shelved_on
    description: The shelf the book stands on.
    title: Shelved on
    slot_uri: lib:shelvedOn
    range: Shelf
  subtitle:
    name: subtitle
    description: Its subtitle.
    title: Subtitle
    slot_uri: lib:subtitle
    range: string
  title:
    name: title
    description: The title of the book.
    title: Title
    slot_uri: dcterms:title
    range: string
    required: true
classes:
  Book:
    name: Book
    annotations:
      rp_path:
        tag: rp_path
        value: books
    description: A book in the library.
    title: Book
    mixins:
    - AggregateRoot
    - Described
    - Tracked
    slots:
    - pages
    - subtitle
    - title
    - authority
    - genre
    - has_chapter
    - language
    - related_work
    - shelved_on
  Chapter:
    name: Chapter
    description: A chapter of a book.
    title: Chapter
    mixins:
    - Described
    - Tracked
    slots:
    - heading
  Periodical:
    name: Periodical
    annotations:
      rp_path:
        tag: rp_path
        value: periodicals
    description: A publication in issues.
    title: Periodical
    is_a: Publication
    mixins:
    - AggregateRoot
    - Described
    - Tracked
    slots:
    - issn
  Publication:
    name: Publication
    description: Anything published.
    title: Publication
    abstract: true
    slots:
    - issued
