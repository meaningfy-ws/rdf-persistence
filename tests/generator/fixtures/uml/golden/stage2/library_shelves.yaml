name: library_shelves
annotations:
  module_kind:
    tag: module_kind
    value: domain
description: Where the books stand.
title: Shelves
id: https://example.org/ns/library/library_shelves
imports:
- linkml:types
- rdf_persistence/model/rp_annotations
- rdf_persistence/model/rp_core
prefixes:
  lib:
    prefix_prefix: lib
    prefix_reference: https://example.org/ns/library#
  linkml:
    prefix_prefix: linkml
    prefix_reference: https://w3id.org/linkml/
default_prefix: lib
default_range: string
slots:
  city:
    name: city
    description: Its city.
    title: City
    slot_uri: lib:city
    range: string
  location:
    name: location
    description: Where it is.
    title: Location
    slot_uri: lib:location
    range: string
classes:
  Library:
    name: Library
    annotations:
      graph:
        tag: graph
        value: meta
    description: The library itself, the tenant.
    title: Library
    mixins:
    - Described
    - Tracked
    slots:
    - city
  Shelf:
    name: Shelf
    annotations:
      rp_path:
        tag: rp_path
        value: shelves
    description: A shelf of books.
    title: Shelf
    mixins:
    - AggregateRoot
    - Described
    - Tracked
    slots:
    - location
    slot_usage:
      location:
        name: location
        description: Where it stands.
        required: true
