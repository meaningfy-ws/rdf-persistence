id: https://example.org/ns/beside/theme
name: theme
title: Theme module
description: A module kept beside the root of target R, generated by target T.
prefixes: {x: "https://example.org/ns/beside#", linkml: "https://w3id.org/linkml/"}
default_prefix: x
default_range: string
imports: [linkml:types]
annotations:
  python_package: xt.theme.domain.generated

classes:
  Thing:
    title: Thing
    description: A thing that the root's class refers to.
    attributes:
      label: {title: Label, description: Its label.}
  Spare:
    title: Spare
    description: A class the root does not use.
    attributes:
      note: {title: Note, description: Its note.}
