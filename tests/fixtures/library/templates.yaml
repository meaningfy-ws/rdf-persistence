id: https://example.org/ns/library/templates
name: templates
title: Templates module
description: Report templates shared by every library; they live in the application database, not in a tenant's.
prefixes:
  lib: https://example.org/ns/library#
  linkml: https://w3id.org/linkml/
  rp: https://meaningfy.ws/ns/rdf-persistence#
default_prefix: lib
default_range: string
imports:
  - linkml:types
  - rdf_persistence/model/rp_core
  - rdf_persistence/model/rp_annotations
annotations:
  module_kind: domain

classes:
  Template:
    title: Template
    description: A report template shared by every library.
    class_uri: lib:Template
    mixins: [AggregateRoot, Described, Tracked]
    annotations:
      rp_path: templates
      database: application
