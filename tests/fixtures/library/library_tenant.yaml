id: https://example.org/ns/library/tenant
name: library_tenant
title: Library tenant module
description: The tenant root of the toy library application, kept in the tenant's meta graph.
prefixes:
  lib: https://example.org/ns/library#
  linkml: https://w3id.org/linkml/
  schema: http://schema.org/
  rp: https://meaningfy.ws/ns/rdf-persistence#
default_prefix: lib
default_range: string
imports:
  - linkml:types
  - rdf_persistence/model/rp_core
  - rdf_persistence/model/rp_annotations
annotations:
  module_kind: domain

classes:
  Library:
    title: Library
    description: A library; the tenant root. Its IRI is the tenant IRI and it lives in the tenant's meta graph.
    class_uri: schema:Library
    mixins: [Described, Tracked]
    slots: [city, charter]
    annotations:
      graph: meta
      database: tenant
  Charter:
    title: Charter
    description: A library's charter, an owned part of the tenant root; the service mints its IRI.
    class_uri: lib:Charter
    mixins: [Described]

slots:
  charter:
    title: Charter
    description: The library's charter, owned by it and kept in the tenant's meta graph.
    slot_uri: lib:charter
    range: Charter
    inlined: true
    annotations:
      owned: true
  city:
    title: City
    description: The city where the library is located.
    slot_uri: schema:addressLocality
    range: string
