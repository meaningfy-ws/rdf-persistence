id: https://example.org/ns/library/tenant
name: library_tenant
title: Library tenant module
description: The tenant root of the toy library application, kept in the tenant's meta graph.
prefixes:
  lib: https://example.org/ns/library#
  linkml: https://w3id.org/linkml/
  schema: http://schema.org/
  rp: https://meaningfy.ws/ns/rdf-persistence#
default_prefix: lib
default_range: string
imports:
  - linkml:types
  - rdf_persistence/model/rp_core
  - rdf_persistence/model/rp_annotations
annotations:
  module_kind: domain

classes:
  Library:
    title: Library
    description: A library; the tenant root. Its IRI is the tenant IRI and it lives in the tenant's meta graph.
    class_uri: schema:Library
    mixins: [Described, Tracked]
    slots: [city]
    annotations:
      graph: meta
      database: tenant

slots:
  city:
    title: City
    description: The city where the library is located.
    slot_uri: schema:addressLocality
    range: string
