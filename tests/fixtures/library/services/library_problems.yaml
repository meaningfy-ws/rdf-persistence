id: https://example.org/ns/library/library_problems
name: library_problems
title: Library problems module
description: A technical module whose problem class extends the toolkit's Problem, the one class a consumer may extend.
prefixes:
  lib: https://example.org/ns/library#
  linkml: https://w3id.org/linkml/
default_prefix: lib
default_range: string
imports:
  - linkml:types
  - rdf_persistence/model/technical/api/rp_api_entrypoints
annotations:
  module_kind: technical
  python_package: tests.fixtures.library.services.generated

classes:
  HeldKeyProblem:
    title: Held key problem
    description: A problem detail that names the aggregate holding a key the request asked for.
    class_uri: lib:HeldKeyProblem
    is_a: Problem
    slots:
      - holder
    slot_usage:
      holder:
        required: true

slots:
  holder:
    title: Holder
    description: The IRI of the aggregate that holds the key.
    slot_uri: lib:holder
    range: uri
