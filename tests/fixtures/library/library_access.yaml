id: https://example.org/ns/library/access
name: library_access
title: Library access module
description: The access model of the toy library application; roles are plain strings matched against the role definitions.
prefixes:
  lib: https://example.org/ns/library#
  linkml: https://w3id.org/linkml/
  rp: https://meaningfy.ws/ns/rdf-persistence#
default_prefix: lib
default_range: string
imports:
  - linkml:types
  - rdf_persistence/model/rp_core
  - rdf_persistence/model/rp_access
  - rdf_persistence/model/rp_tenancy
annotations:
  module_kind: access

classes:
  LibraryAccess:
    title: Library access
    description: The access record of a library tenant; its grants are the metamodel's.
    class_uri: lib:LibraryAccess
    is_a: TenantAccess
