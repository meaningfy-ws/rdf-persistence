# Minimal pyproject.toml — Meaningfy standard (no-src, config-in-root).
# Only [project], [dependency-groups], [tool.uv*], [build-system] live here.
# Every TOOL is configured in its own dedicated root file:
#   ruff.toml · mypy.ini · pytest.ini · .coveragerc · .importlinter
#   .pre-commit-config.yaml · sonar-project.properties
# The single source of truth for the version is the root VERSION file; keep the
# `version` field below in sync.

[project]
name = "rdf-persistence"
version = "0.1.0"
description = "Serialisation and triple store persistence (incl. transactions)"
authors = [
    { name = "Meaningfy", email = "hi@meaningfy.ws" }
]
maintainers = [
    { name = "Meaningfy", email = "hi@meaningfy.ws" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.12,<4.0"
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Natural Language :: English",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
]
dependencies = [
    # Runtime dependencies go here, pinned with `==`. Examples (uncomment as needed):
    # "pydantic[email]==2.13.3",
    # "fastapi==0.128.8",
    # "uvicorn==0.41.0",
]

[dependency-groups]
# PEP 735 dependency groups, installed via `uv sync` (all groups are default-groups).
dev = [
    "pre-commit==4.6.0",
    "linkml==1.10.0",
]
test = [
    "pytest==9.0.3",
    "pytest-bdd==8.1.0",
    "pytest-cov==7.1.0",
    "pytest-asyncio==1.3.0",
    "testcontainers==4.14.2",
    "polyfactory==3.3.0",
    "httpx==0.28.1",
]
lint = [
    "ruff==0.15.11",
    "mypy==1.20.2",
    "import-linter==2.11",
    "radon==6.0.1",
    "xenon==0.9.3",
]

[tool.uv]
default-groups = ["dev", "test", "lint"]

[tool.uv.build-backend]
# No-src layout: the top-level package lives in the repo root, NOT under src/.
module-root = ""

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

# NOTE: intentionally no [tool.ruff], [tool.mypy], [tool.pytest], [tool.coverage]
# sections here — all tool config lives in dedicated root files (see header).
