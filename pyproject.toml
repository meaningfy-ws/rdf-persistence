# Minimal pyproject.toml — Meaningfy standard (no-src, config-in-root).
# Only [project], [dependency-groups], [tool.uv*], [tool.rp-generate], [build-system] live here.
# Every TOOL is configured in its own dedicated root file:
#   ruff.toml · mypy.ini · pytest.ini · .coveragerc · .importlinter
#   .pre-commit-config.yaml · sonar-project.properties
# The version's one source is the root VERSION file. uv_build reads no dynamic version, so
# release-please writes VERSION and mirrors it here and into uv.lock; `make check-version` fails on
# drift. The package reads it back with importlib.metadata (`rdf_persistence.__version__`).
# Never edit either by hand.

[project]
name = "rdf-persistence"
version = "0.14.0"
description = "Serialisation and triple store persistence (incl. transactions)"
authors = [
    { name = "Meaningfy", email = "hi@meaningfy.ws" }
]
maintainers = [
    { name = "Meaningfy", email = "hi@meaningfy.ws" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.12,<4.0"
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Natural Language :: English",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
]
dependencies = [
    # Pinned to the latest release on 2026-11-05 (PD-2); linkml-runtime matches linkml 1.12.1.
    "linkml-runtime==1.12.1",
    "rdflib==7.6.0",
    "pyld==3.3.0",
    "pyshacl==0.40.2",
    "pydantic==2.14.2",
    "httpx==0.28.1",
    "fastapi==0.162.0",
    "pyjwt[crypto]==2.15.1",
    "boto3==1.43.124",
    "anyio==4.16.0",
    "pyyaml==6.0.3",  # latest on 2026-11-06 (PD-2); reads the role definitions
    "python-mimeparse==2.0.0",  # parses the Accept header (PD-5)
    "opentelemetry-api>=1.44,<2",
]

[project.scripts]
# Always installed; without the `generate` extra it exits 2 and says so (PD-2).
rp-generate = "rdf_persistence_generation.cli:main"
# Needs no `generate` extra: stdlib sqlite3, yaml and linkml_runtime (PD-1).
rp-uml2linkml = "rdf_persistence_generation.uml.cli:main"

[project.optional-dependencies]
# The generators, kept out of consumers' running services (PD-2).
generate = [
    "linkml==1.12.1",
    # `rp-generate --check` type-checks what it generated (#242).
    "mypy==1.20.2",
]
# The container fixtures of `rdf_persistence.testkit.containers` (PD-16).
testkit = [
    "testcontainers==4.14.2",
]
# The Redis Streams event bus of `rdf_persistence.events.adapters.redis_events` (aggregate-events PD-8).
events = [
    "faststream[redis]==0.7.8",
]
# `settings_from_env` of `rdf_persistence.api.entrypoints.environment` (technical-models PD-12).
settings = [
    "pydantic-settings==2.16.2",
]

[dependency-groups]
# PEP 735 dependency groups, installed via `uv sync` (all groups are default-groups).
dev = [
    "pre-commit==4.6.0",
    "pytest-xdist==3.8.0",
    "mutmut==3.8.1",
    "uv-build>=0.10,<0.11",
]
test = [
    "pytest==9.0.3",
    "pytest-bdd==8.1.0",
    "pytest-cov==7.1.0",
    "pytest-asyncio==1.3.0",
    "pytest-timeout==2.4.0",
    # Random test order; two seeds ran green (PD-9 trial).
    "pytest-randomly==5.1.0",
    # The round-trip invariants of the conformance suite (PD-27 item 4).
    "hypothesis==6.170.14",
    "opentelemetry-sdk==1.45.2",
    "pytest-split==0.11.0",
    # Selection by recorded execution for make test-changed (agent-test-control PD-5, PD-8).
    "pytest-testmon==2.4.0",
    # The contract test: the service against its own /openapi.json (PD-15).
    "schemathesis==4.33.4",
]
lint = [
    "ruff==0.15.11",
    "mypy==1.20.2",
    "import-linter==2.11",
    "radon==6.0.1",
    "xenon==0.9.3",
]

# This repo's own generation targets (PD-18): the metamodel, the generation module's data, the
# service module, the SPARQL term models, the wire models. Only the service module's classes are
# served, so only it has OpenAPI components.
[[tool.rp-generate]]
schema = "rdf_persistence/model/rp.yaml"
package = "rdf_persistence.core.domain.generated"
regenerate-command = "make generate"
openapi = false
migrations = "rdf_persistence/model/migrations"
diagrams = "docs/modules/ROOT/partials/model"

