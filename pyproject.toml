[tool.uv]
default-groups = ["dev", "test", "lint"]

[tool.uv.build-backend]
# No-src layout: the top-level packages live in the repo root, NOT under src/.
# The generator is a sibling package (DEC-1, PD-7); the library never imports it.
module-name = ["rdf_persistence", "rdf_persistence_generation"]
module-root = ""

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

# NOTE: intentionally no [tool.ruff], [tool.mypy], [tool.pytest], [tool.coverage]
# sections here — all tool config lives in dedicated root files (see header).
