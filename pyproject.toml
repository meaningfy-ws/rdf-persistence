# Minimal pyproject.toml — Meaningfy standard (no-src, config-in-root).
# Only [project], [dependency-groups], [tool.uv*], [tool.rp-generate], [build-system] live here.
# Every TOOL is configured in its own dedicated root file:
#   ruff.toml · mypy.ini · pytest.ini · .coveragerc · .importlinter
#   .pre-commit-config.yaml · sonar-project.properties
# The single source of truth for the version is the root VERSION file; keep the
# `version` field below in sync.

[project]
name = "rdf-persistence"
version = "0.1.0"
description = "Serialisation and triple store persistence (incl. transactions)"
authors = [
    { name = "Meaningfy", email = "hi@meaningfy.ws" }
]
maintainers = [
    { name = "Meaningfy", email = "hi@meaningfy.ws" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.12,<4.0"
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Natural Language :: English",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
]
dependencies = [
    # Pinned to the latest release on 2026-11-05 (PD-2); linkml-runtime matches linkml 1.12.1.
    "linkml-runtime==1.12.1",
    "rdflib==7.6.0",
    "pyld==3.3.0",
    "pyshacl==0.40.2",
    "pydantic==2.14.2",
    "httpx==0.28.1",
    "fastapi==0.162.0",
    "pyjwt[crypto]==2.15.1",
    "boto3==1.43.124",
    "anyio==4.16.0",
    "pyyaml==6.0.3",  # latest on 2026-11-06 (PD-2); reads the role definitions
]

[project.scripts]
# Always installed; without the `generate` extra it exits 2 and says so (PD-2).
rp-generate = "rdf_persistence.generation.cli:main"

[project.optional-dependencies]
# The generators, kept out of consumers' running services (PD-2).
generate = [
    "linkml==1.12.1",
]
# The container fixtures of `rdf_persistence.testkit.containers` (PD-16).
testkit = [
    "testcontainers==4.14.2",
]

[dependency-groups]
# PEP 735 dependency groups, installed via `uv sync` (all groups are default-groups).
dev = [
    "pre-commit==4.6.0",
]
test = [
    "pytest==9.0.3",
    "pytest-bdd==8.1.0",
    "pytest-cov==7.1.0",
    "pytest-asyncio==1.3.0",
    "polyfactory==3.3.0",
    # The round-trip invariants of the conformance suite (PD-27 item 4).
    "hypothesis==6.170.14",
]
lint = [
    "ruff==0.15.11",
    "mypy==1.20.2",
    "import-linter==2.11",
    "radon==6.0.1",
    "xenon==0.9.3",
]

# This repo's own generation targets (PD-18): the metamodel, the generation module's data, the
# service module, the wire models. Only the service module's classes are served, so only it has
# OpenAPI components.
[[tool.rp-generate]]
schema = "rdf_persistence/model/rp.yaml"
package = "rdf_persistence.domain.generated"
regenerate-command = "make generate"
openapi = false

[[tool.rp-generate]]
schema = "rdf_persistence/generation/model/rp_generation.yaml"
package = "rdf_persistence.generation.generated"
regenerate-command = "make generate"
openapi = false

[[tool.rp-generate]]
schema = "rdf_persistence/model/service/rp_service.yaml"
package = "rdf_persistence.domain.generated.service"
regenerate-command = "make generate"

[[tool.rp-generate]]
schema = "rdf_persistence/model/adapters/rp_wire.yaml"
package = "rdf_persistence.adapters.generated"
regenerate-command = "make generate"
openapi = false

[tool.uv]
default-groups = ["dev", "test", "lint"]

[tool.uv.build-backend]
# No-src layout: the top-level package lives in the repo root, NOT under src/.
module-root = ""

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

# NOTE: intentionally no [tool.ruff], [tool.mypy], [tool.pytest], [tool.coverage]
# sections here — all tool config lives in dedicated root files (see header).
