# SonarCloud configuration for RDF Persistence
# =============================================
# Project: https://sonarcloud.io/project/overview?id=meaningfy-ws_rdf-persistence
# Free plan: only the main branch is analysed, so that branch must be `develop`
# in the SonarCloud project settings (see .github/workflows/ci.yaml).

sonar.projectKey=meaningfy-ws_rdf-persistence
sonar.organization=meaningfy-ws

# Source and test paths (no-src layout: the top-level package is the source root).
sonar.sources=rdf_persistence/
sonar.tests=tests/
sonar.python.version=3.12

# Coverage and test reports (produced by `make test`).
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results.xml

# Exclusions
sonar.coverage.exclusions=tests/**/*
sonar.cpd.exclusions=tests/**/*
sonar.exclusions=docs/**/*,*.md,infra/**/*
