[pytest]
# No-src layout: make the top-level package importable from the repo root.
pythonpath = .
testpaths = tests
python_files = test_*.py
python_functions = test_*

# No --cov here (decision D5): coverage flags live only in the Makefile's
# `test` and `coverage-report` targets, so plain `pytest` stays fast.
addopts =
    -v
    --strict-markers
    --tb=short

asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# rdflib's own deprecations (Dataset.contexts, default_context, ...) fire thousands of times inside
# its SPARQL engine; linkml's click warning and the pytester sessions of the freshness tests (which
# have no asyncio setting of their own) are not ours to fix. Anything else that shows is ours.
filterwarnings =
    ignore::DeprecationWarning:rdflib.*
    ignore:The configuration option "asyncio_default_fixture_loop_scope" is unset:pytest.PytestDeprecationWarning
    ignore:The '__version__' attribute is deprecated:DeprecationWarning:linkml.*

# Projects whose generated code the session must find fresh (PD-26).
rp_generate_projects =
    pyproject.toml
    tests/fixtures/library/pyproject.toml

log_format = %(asctime)s %(levelname)-8s %(name)s %(message)s
log_date_format = %Y-%m-%dT%H:%M:%S

# Markers are applied automatically by tests/conftest.py via
# pytest_collection_modifyitems (by path) — do NOT add per-file pytestmark. The container markers
# (store, files, identity) are registered by the testkit fixtures plugin, from testkit/markers.py.
markers =
    unit: fast, no I/O — domain/service/adapter layer tests
    feature: BDD feature tests (pytest-bdd step definitions)
    e2e: end-to-end tests against a near-real stack
    integration: requires a running datastore/service
